# ------------------------------------------------- Distribuição por estrato
# Cada estrato distribui seus assentos entre entradas {provider, tier|model, weight}.
#   provider : obrigatório
#   tier     : deep | standard | light (opcional; padrão = tier do perfil do estrato)
#   model    : ID explícito (opcional; sobrepõe tier; aceita id direto ou openrouter_id)
#   weight   : peso relativo (padrão 1). Pesos somando 100 lêem-se como %.
# Alocação determinística (weighted round-robin suave): em cada estrato, os
# assentos seguem os pesos; a sequência desloca 1 posição por réplica, então a
# exposição acumulada converge para os percentuais mesmo com poucos assentos.
# Estrato ausente usa [strata.default].
#
# Exemplo de mistura de modelos dentro do mesmo provider:
#   [strata.regulators]
#   mix = [
#     { provider = "anthropic", tier = "deep",     weight = 15 },
#     { provider = "anthropic", tier = "standard", weight = 10 },
#     { provider = "openai",    model = "openai/gpt-6-sol", weight = 25 },
#     { provider = "xai",       weight = 25 },
#     { provider = "gemini",    weight = 25 },
#   ]

[strata.default]
mix = [
  { provider = "anthropic", weight = 25 },
  { provider = "openai",    weight = 25 },
  { provider = "xai",       weight = 25 },
  { provider = "gemini",    weight = 25 },
]

# Usado só com assignment = "fixed". Atenção: fixar provider por estrato
# confunde viés do modelo com a perspectiva simulada.
[assignment.fixed]
regulators = "anthropic"
publicOperators = "openai"
business = "xai"
research = "gemini"
civilSociety = "anthropic"
workers = "openai"
affectedGroups = "gemini"
infrastructure = "xai"

