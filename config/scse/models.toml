# SCSE - roteamento de modelos por provider e por perfil.
#
# Transporte padrão: OpenRouter (uma assinatura, uma chave: OPENROUTER_API_KEY).
# Os adaptadores diretos (SDK de cada provider) continuam disponíveis:
#   [defaults] transport = "direct", `transport = "direct"` num provider, ou
#   `scse run ... --transport direct`.
#
# Como trocar um modelo para simular:
#   1. Edite o `id` do tier desejado abaixo; ou
#   2. Variável de ambiente:  SCSE_MODEL__<PROVIDER>__<TIER>=<model-id>
#        ex.: SCSE_MODEL__XAI__DEEP=grok-4.6
#   3. Linha de comando:      scse run ... --set openai.deep=gpt-6.1-terra
#   4. Arquivo de experimento (experiments/scse/*.toml), chave `overrides`.
#
# `verified` confirma o ID na API direta do provider; `openrouter_verified`
# confirma a presença do slug no catálogo do OpenRouter. Nenhum dos dois
# confirma que a chave atual tem acesso a chamadas de geração.
#
# price_in / price_out (USD por 1M tokens) alimentam o controle maxCostUsd.
# Sem preço declarado, o custo do provider é reportado como desconhecido e só
# o tokenBudget é aplicado. Preencha com a tabela vigente de cada provider.

[defaults]
transport = "openrouter"         # openrouter | direct
# weighted : cada estrato distribui seus assentos entre provider/modelo
#            conforme os pesos de [strata.<id>] (padrão: pesos iguais). Padrão.
# rotate   : pesos iguais entre os providers selecionados, ignorando [strata].
# fixed    : estrato -> provider fixo (tabela [assignment.fixed]).
# single   : todo o conselho num único provider (ablação; use --providers).
assignment = "weighted"
required_providers = ["anthropic", "openai", "xai", "gemini"]
max_output_tokens = 8000
timeout_seconds = 300
# Repetir uma vez quando o JSON não valida contra o contrato do turno.
repair_attempts = 1

# Perfil funcional -> tier de modelo. O perfil vem do estrato (world pack)
# ou do papel no pipeline (critic, synthesizer).
[profiles]
"perspective.deep" = "deep"          # reguladores, pesquisa, operador público
"perspective.standard" = "standard"  # demais estratos
critic = "standard"                  # crítica cruzada (provider diferente do autor)
synthesizer = "deep"                 # descrições de tensões e próximas ações
smoke = "light"                      # `scse models ping`

# --------------------------------------------------------------- OpenRouter
# API compatível com OpenAI. Para manter a comparação entre providers limpa:
#   pin_upstream       -> força o host original do modelo (provider.only/order)
#   allow_fallbacks    -> false: não cai para outro host silenciosamente
#   require_parameters -> true: só usa host que honra response_format/reasoning
[openrouter]
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
pin_upstream = true
allow_fallbacks = false
require_parameters = true

# ---------------------------------------------------------------- Anthropic
[providers.anthropic]
sdk = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
structured_output = "schema"   # output_config.format json_schema
openrouter_upstream = ["anthropic"]

[providers.anthropic.models.deep]
id = "claude-opus-5-5"
openrouter_id = "anthropic/claude-opus-5.5"
openrouter_verified = true
effort = "high"
price_in = 4.0                 # USD / 1M tokens (Anthropic, nov/2026)
price_out = 20.0                # Opus 5.5 default é medium; explicitamos
fallbacks = "default"          # fallback server-side em recusa (beta)
verified = true

[providers.anthropic.models.standard]
id = "claude-sonnet-5-5"
openrouter_id = "anthropic/claude-sonnet-5.5"
openrouter_verified = true
effort = "medium"
price_in = 2.0
price_out = 10.0
fallbacks = "default"
verified = true

[providers.anthropic.models.light]
id = "claude-haiku-5-5"
openrouter_id = "anthropic/claude-haiku-5.5"
openrouter_verified = true
effort = "low"
price_in = 0.10
price_out = 0.50
verified = true

