s, saúde e acesso a serviços, dado o déficit da premissa fictícia de 6 avaliações publicadas em 37 sistemas federais (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). O veículo não é exigência da ANPD com base só na LGPD (GM-13; GM-03): é dever de gestão dos órgãos operadores, auditável pelo controle externo (CF-13; EBIA-TCU), com apoio do eixo de governança do PBIA (GM-02; GM-15) até haver marco vigente. Não tratar o GM-10, na forma atual, como cobertura de impact-assessment.","tensionIds":["T4","T5"],"author":{"agentId":"agent:civilSociety-01","stratumId":"civilSociety","provider":"xai"},"support":{"seats":1,"strata":["civilSociety"],"providers":["xai"]},"challenges":[],"amendments":[{"claimId":"C0103-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-01","CF-05","CF-10"],"stratumPositions":[{"stratumId":"regulators","stance":"against","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"against","role":"challenge","roundId":"R3","text":"Contesto o veículo, não o diagnóstico de lacuna prática. É correto que GM-10 não é obrigação vigente e que, na premissa fictícia, 6 de 37 sistemas federais têm avaliação de impacto publicada (GM-10, CTX-01, IND-PL2338-STATUS, BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Não se sustenta converter isso em dever operacional exigível pela ANPD com base na LGPD. GM-13 aplica proteção de dados; o PL a designa para supervisionar o SIA, mas o PL não vigora (GM-05, GM-04, CF-10). O pacote descreve o que a LGPD cobre e não reproduz texto que atribua avaliação geral de impacto em direitos de sistemas de IA (GM-03, LGPD); a inferência de ausência de competência é hipótese, não dispositivo conferido. Esta perspectiva tem interesse institucional em ampliar mandato e registra o conflito: alargar a ANPD por interpretação, sem norma, prejudica exigibilidade e independência. Caminho compatível com a restrição de aplicar a norma vigente é condição administrativa de entrada e permanência em produção no serviço público, não sanção por avaliação ainda não legislada. O que mudaria: lei vigente com competência expressa, ou demonstração, no texto integral, de dever já exigível — ausente no pacote."}]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"amend","statements":[{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"Impact-assessment está no modelo só como GM-10, mecanismo proposto e inferido do PL 2338, que não é obrigação vigente (CTX-01; IND-PL2338-STATUS). A matriz confirma coverageStrength=inferredOnly e fragile=true, embora quatro assentos tenham esperado o tema. Há 37 sistemas de IA em produção em serviços federais e apenas 6 com avaliação de impacto publicada (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). Tratar GM-10 como cobertura é omissão: o modelo deveria converter avaliação de impacto em direitos fundamentais em dever administrativo do setor público agora — prévia à produção, publicada, atualizada e com vedação de novos sistemas de alto impacto sem AID — com base na LGPD/ANPD e no controle interno, sem esperar o SIA. Afetados: usuários de serviços digitais federais, inclusive benefícios. Evidência que mudaria a posição: norma infralegal em vigor exigindo AID publicada para esses 37 sistemas, ou PL convertido em lei com vacatio curta só para o setor público."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"author","roundId":"R4","text":"Reviso C0038-R2 em resposta a C0078-R3: mantenho o diagnóstico de omissão e recuo no veículo. GM-10 segue proposto e de tópicos inferidos; o PL 2338 não é obrigação vigente (CTX-01; IND-PL2338-STATUS; GM-04). Tratar GM-10 como cobertura de impact-assessment mascara a lacuna prática: 37 sistemas federais em produção e só 6 com avaliação de impacto publicada (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). O que modificar: a avaliação de impacto em direitos deve ser dever operacional dos órgãos que já operam IA pública (GM-20), com publicação, reavaliação periódica e prioridade para sistemas que afetem benefícios e saúde (CF-01; CF-05), sem esperar o SIA (GM-05). Recuo quanto a torná-la exigível pela ANPD com base na LGPD: GM-13 tem mandato vigente de proteção de dados, não de supervisão geral de IA, e o PL que a designaria para o SIA não vigora (GM-04; GM-05; CF-10). A LGPD (GM-03) cobre relatório de impacto à proteção de dados e revisão de decisões tomadas unicamente com base em tratamento automatizado de dados pessoais; isso não equivale a avaliação de impacto em direitos fundamentais do conjunto da IA administrativa. Instrumento adequado nesta data: regra administrativa de implantação e de permanência em produção no setor público, articulável ao eixo de governança do PBIA (GM-02; GM-15) e ao controle externo já existente (CF-13; EBIA-TCU), sem expandir o mandato da ANPD. Ponto cego desta perspectiva: o custo fiscal das salvaguardas não está no pacote. Evidência que mudaria a posição: texto vigente com AID conferido; RIPD já equivalentes em escala aos 31 sistemas sem avaliação publicada; ou estimativa de custo, prazo e competência legal da regra administrativa proposta."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Reformular o GM-10 para separar o mecanismo proposto e inferido do PL 2338 — não vigente (CTX-01; IND-PL2338-STATUS; GM-04) — de um dever operacional dos órgãos que já operam IA pública. O dever: avaliar impacto em direitos fundamentais, não só em dados pessoais, antes da implantação e em reavaliação periódica; publicar resultados agregados sem dados pessoais; priorizar sistemas em produção que influenciem benefícios, saúde e acesso a serviços, dado o déficit da premissa fictícia de 6 avaliações publicadas em 37 sistemas federais (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). O veículo não é exigência da ANPD com base só na LGPD (GM-13; GM-03): é dever de gestão dos órgãos operadores, auditável pelo controle externo (CF-13; EBIA-TCU), com apoio do eixo de governança do PBIA (GM-02; GM-15) até haver marco vigente. Não tratar o GM-10, na forma atual, como cobertura de impact-assessment."}]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"for","statements":[{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"Detalhar no GM-10 uma avaliação antes da implantação e reavaliação periódica de sistemas que influenciem acesso a benefícios, examinando erros, exclusões e funcionamento dos recursos. Priorizar também sistemas já em uso e publicar resultados agregados sem expor dados pessoais. A cobertura da matriz é apenas inferida; no cenário fictício, 6 dos 37 sistemas federais têm avaliação de impacto publicada. Evidência de avaliações equivalentes já realizadas, inclusive não publicadas, e de sua efetividade mudaria a ordem de prioridade."}]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M018","lens":"omission","change":"modify","componentId":"GM-15","componentTitle":"Grupo de trabalho interministerial do PBIA, coordenado pelo MCTI","topic":"monitoring-learning","title":"Monitoramento interno com avaliação independente de resultados","text":"Monitoramento aparece coberto por GM-15 (grupo interministerial coordenado pelo MCTI, que executa e se autoavalia com relatório anual) e por GM-16 (painel das 54 ações). Falta avaliação independente. Os relatos de execução divergem entre 30-35% e 56% (CTX-02), e no mundo fictício há 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED). Essa divergência mostra que o modelo não tem uma métrica de execução auditável nem medição de resultado, só de esforço. Proponho modificar GM-15 e GM-16 em quatro pontos: (a) avaliação independente bienal de resultados e impacto, com mandato e orçamento separados do órgão executor; (b) definição pública e estável do que conta como 'ação executada'; (c) publicação dos dados do painel em formato aberto e reutilizável; (d) uma revisão do próprio modelo de governança atrelada a essa avaliação. O precedente de controle externo sobre a EBIA (EBIA-TCU) indica que há base institucional para isso. A avaliação não deve ficar com quem recebe recursos do plano, o que inclui redes de pesquisa como a desta perspectiva. Mudaria de posição se o relatório anual de GM-15 já tivesse metodologia publicada e revisão externa.","proposedTitle":"Monitoramento interno com avaliação independente de resultados","proposedDescription":"Redação proposta para GM-15: 'O grupo interministerial coordenado pelo MCTI continua responsável pelo monitoramento da execução e pelo relatório anual (PBIA-GOV, CTX-04). A avaliação de resultados fica separada da execução: (a) uma instância avaliadora sem função executiva no PBIA e sem recebimento de seus recursos será escolhida por chamada pública, com mandato que atravesse a posse de janeiro de 2027 (CTX-03). Por conflito de interesse, isso exclui redes de pesquisa beneficiárias, inclusive a que esta perspectiva sintética representa. (b) O painel GM-16 publica em dados abertos, para cada uma das 54 ações, o critério de entrega definido antes da medição, o valor programado e o executado, a fonte e um indicador de resultado. O objetivo é resolver a divergência entre 30-35% e 56% (CTX-02); no mundo fictício, são 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED). (c) Haverá uma avaliação de meio de ciclo em 2027 e uma final em 2028, encaminhadas ao controle externo, aproveitando o precedente do acompanhamento da EBIA pelo TCU (EBIA-TCU). (d) Entram indicadores de capacidade de supervisão, como pessoal dedicado e número de sistemas com avaliação de impacto publicada (BRF-CTX-GOVCAP, BRF-CTX-PUBSVC), e não só de esforço.' Custo: recursos de avaliação competem com a execução; o valor deve ser definido pelo eixo de governança, e não proponho percentual sem base. Risco: avaliação tardia ou capturada. O que mudaria minha posição: evidência de que o relatório anual do grupo já usa critérios de entrega publicados e verificação externa.","tensionIds":["T1","T5"],"author":{"agentId":"agent:research-01","stratumId":"research","provider":"anthropic"},"support":{"seats":1,"strata":["research"],"providers":["anthropic"]},"challenges":[],"amendments":[{"claimId":"C0106-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":[],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"amend","statements":[{"agentId":"agent:research-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"Monitoramento aparece coberto por GM-15 (grupo interministerial coordenado pelo MCTI, que executa e se autoavalia com relatório anual) e por GM-16 (painel das 54 ações). Falta avaliação independente. Os relatos de execução divergem entre 30-35% e 56% (CTX-02), e no mundo fictício há 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED). Essa divergência mostra que o modelo não tem uma métrica de execução auditável nem medição de resultado, só de esforço. Proponho modificar GM-15 e GM-16 em quatro pontos: (a) avaliação independente bienal de resultados e impacto, com mandato e orçamento separados do órgão executor; (b) definição pública e estável do que conta como 'ação executada'; (c) publicação dos dados do painel em formato aberto e reutilizável; (d) uma revisão do próprio modelo de governança atrelada a essa avaliação. O precedente de controle externo sobre a EBIA (EBIA-TCU) indica que há base institucional para isso. A avaliação não deve ficar com quem recebe recursos do plano, o que inclui redes de pesquisa como a desta perspectiva. Mudaria de posição se o relatório anual de GM-15 já tivesse metodologia publicada e revisão externa."},{"agentId":"agent:research-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-15: 'O grupo interministerial coordenado pelo MCTI continua responsável pelo monitoramento da execução e pelo relatório anual (PBIA-GOV, CTX-04). A avaliação de resultados fica separada da execução: (a) uma instância avaliadora sem função executiva no PBIA e sem recebimento de seus recursos será escolhida por chamada pública, com mandato que atravesse a posse de janeiro de 2027 (CTX-03). Por conflito de interesse, isso exclui redes de pesquisa beneficiárias, inclusive a que esta perspectiva sintética representa. (b) O painel GM-16 publica em dados abertos, para cada uma das 54 ações, o critério de entrega definido antes da medição, o valor programado e o executado, a fonte e um indicador de resultado. O objetivo é resolver a divergência entre 30-35% e 56% (CTX-02); no mundo fictício, são 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED). (c) Haverá uma avaliação de meio de ciclo em 2027 e uma final em 2028, encaminhadas ao controle externo, aproveitando o precedente do acompanhamento da EBIA pelo TCU (EBIA-TCU). (d) Entram indicadores de capacidade de supervisão, como pessoal dedicado e número de sistemas com avaliação de impacto publicada (BRF-CTX-GOVCAP, BRF-CTX-PUBSVC), e não só de esforço.' Custo: recursos de avaliação competem com a execução; o valor deve ser definido pelo eixo de governança, e não proponho percentual sem base. Risco: avaliação tardia ou capturada. O que mudaria minha posição: evidência de que o relatório anual do grupo já usa critérios de entrega publicados e verificação externa."}]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M019","lens":"omission","change":"modify","componentId":"GM-17","componentTitle":"Infraestrutura nacional de computação (supercomputador e armazenamento)","topic":"regional-inequality","title":"Critério regional na alocação de computação pública","text":"Omissão (desigualdade regional): a matriz marca lacuna total, apesar de 3 assentos esperarem o tema, e o ponto cego da minha perspectiva faz com que a infraestrutura tenda a se concentrar onde há rede e energia. CF-11 e BRF-CTX-LABOR indicam menor cobertura de requalificação no Norte e Nordeste, e BRF-CTX-TALENT aponta 71% dos talentos no Sudeste (fictício). Proposta: modificar a infraestrutura nacional (GM-17) para que a alocação de computação pública considere critérios regionais e que o PBIA reporte a distribuição regional de acesso e de formação (GM-16). Risco: a dispersão pode elevar custo e reduzir eficiência de escala, o que precisa ser avaliado. A distribuição regional exata da infraestrutura não consta do pacote.","proposedTitle":"Critério regional na alocação de computação pública","proposedDescription":"Modificar GM-17 para incluir critério regional na alocação de computação pública. (1) Reservar parcela da capacidade e dos editais de acesso a pesquisadores, universidades e startups do Norte e do Nordeste, com apoio de conectividade e treinamento para o uso. (2) Avaliar, antes de localizar nova infraestrutura, o efeito sobre a rede elétrica regional e o benefício local, sem impor localização que eleve custo ou risco de energia. (3) Publicar a distribuição regional de uso e dos beneficiários. A concentração de 71% dos talentos no Sudeste e a menor cobertura regional vêm de fonte fictícia e de hipótese de contexto, a verificar. Esta é uma área de ponto cego da minha perspectiva. Dados de demanda regional e de custo de conectividade poderiam alterar a parcela reservada.","tensionIds":["T3"],"author":{"agentId":"agent:infrastructure-01","stratumId":"infrastructure","provider":"anthropic"},"support":{"seats":1,"strata":["infrastructure"],"providers":["anthropic"]},"challenges":[],"amendments":[{"claimId":"C0115-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-11","CF-02"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"amend","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"Omissão (desigualdade regional): a matriz marca lacuna total, apesar de 3 assentos esperarem o tema, e o ponto cego da minha perspectiva faz com que a infraestrutura tenda a se concentrar onde há rede e energia. CF-11 e BRF-CTX-LABOR indicam menor cobertura de requalificação no Norte e Nordeste, e BRF-CTX-TALENT aponta 71% dos talentos no Sudeste (fictício). Proposta: modificar a infraestrutura nacional (GM-17) para que a alocação de computação pública considere critérios regionais e que o PBIA reporte a distribuição regional de acesso e de formação (GM-16). Risco: a dispersão pode elevar custo e reduzir eficiência de escala, o que precisa ser avaliado. A distribuição regional exata da infraestrutura não consta do pacote."},{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Modificar GM-17 para incluir critério regional na alocação de computação pública. (1) Reservar parcela da capacidade e dos editais de acesso a pesquisadores, universidades e startups do Norte e do Nordeste, com apoio de conectividade e treinamento para o uso. (2) Avaliar, antes de localizar nova infraestrutura, o efeito sobre a rede elétrica regional e o benefício local, sem impor localização que eleve custo ou risco de energia. (3) Publicar a distribuição regional de uso e dos beneficiários. A concentração de 71% dos talentos no Sudeste e a menor cobertura regional vêm de fonte fictícia e de hipótese de contexto, a verificar. Esta é uma área de ponto cego da minha perspectiva. Dados de demanda regional e de custo de conectividade poderiam alterar a parcela reservada."}]}]},{"proposalId":"M020","lens":"omission","change":"modify","componentId":"GM-19","componentTitle":"Formação de especialistas e capacitação de servidores","topic":"regional-inequality","title":"Requalificação profissional financiada com cotas para redução da desigualdade regional","text":"A matriz de governança apresenta uma lacuna absoluta no tópico de desigualdade regional (gap: true), e o componente GM-19 limita o foco de capacitação a servidores e especialistas de ponta (PBIA-DOC). Essa formulação omite um programa de requalificação financiada voltado à força de trabalho vulnerável à automação no setor produtivo (BRF-CTX-LABOR, BRF-POS-WRK). Dado que 71% dos profissionais qualificados estão no Sudeste (BRF-CTX-TALENT) e que o Norte e o Nordeste têm menor cobertura estrutural (CF-11), GM-19 deve ser reformulado para estabelecer dotação orçamentária perene de requalificação com cotas regionais mandatórias, enfrentando a assimetria na difusão tecnológica (T3).","proposedTitle":"Requalificação profissional financiada com cotas regionais","proposedDescription":"Redação proposta para GM-19: Reformular o componente de capacitação para instituir o Programa Nacional de Requalificação Profissional Financiada para Transição Justa, integrando recursos públicos e setoriais com foco explícito em categorias vulneráveis à automação cognitiva. Fixar cota territorial mínima obrigatória de 40% das vagas e dotações orçamentárias de capacitação para as regiões Norte e Nordeste, corrigindo ativamente a assimetria apontada no diagnóstico de talentos e mitigando a exclusão territorial de trabalhadores no acesso a novas competências técnicas.","tensionIds":["T3"],"author":{"agentId":"agent:workers-01","stratumId":"workers","provider":"gemini"},"support":{"seats":1,"strata":["workers"],"providers":["gemini"]},"challenges":[],"amendments":[{"claimId":"C0111-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-11"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"amend","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"A matriz de governança apresenta uma lacuna absoluta no tópico de desigualdade regional (gap: true), e o componente GM-19 limita o foco de capacitação a servidores e especialistas de ponta (PBIA-DOC). Essa formulação omite um programa de requalificação financiada voltado à força de trabalho vulnerável à automação no setor produtivo (BRF-CTX-LABOR, BRF-POS-WRK). Dado que 71% dos profissionais qualificados estão no Sudeste (BRF-CTX-TALENT) e que o Norte e o Nordeste têm menor cobertura estrutural (CF-11), GM-19 deve ser reformulado para estabelecer dotação orçamentária perene de requalificação com cotas regionais mandatórias, enfrentando a assimetria na difusão tecnológica (T3)."},{"agentId":"agent:workers-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-19: Reformular o componente de capacitação para instituir o Programa Nacional de Requalificação Profissional Financiada para Transição Justa, integrando recursos públicos e setoriais com foco explícito em categorias vulneráveis à automação cognitiva. Fixar cota territorial mínima obrigatória de 40% das vagas e dotações orçamentárias de capacitação para as regiões Norte e Nordeste, corrigindo ativamente a assimetria apontada no diagnóstico de talentos e mitigando a exclusão territorial de trabalhadores no acesso a novas competências técnicas."}]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M021","lens":"omission","change":"modify","componentId":"GM-22","componentTitle":"Crédito e apoio à inovação empresarial em IA","topic":"compute-infrastructure","title":"Créditos de computação com acesso competitivo e contrapartidas sociais","text":"Reviso a proposta para incluir contrapartidas sociais. Em GM-22, propor créditos de computação para startups com seleção pública, teto por beneficiário e uso em infraestrutura nacional ou externa. Os beneficiários apresentariam um relatório simplificado sobre possíveis efeitos ocupacionais e, quando houver risco relevante de deslocamento, um plano proporcional de diálogo com trabalhadores e acesso à requalificação financiada. A concessão e a renovação dependeriam desses compromissos, com acompanhamento independente. A crítica evidencia um ponto cego desta perspectiva: trabalhadores podem arcar com custos da adoção subsidiada. Porém, os 31% de ocupações expostas são uma premissa fictícia, não uma estimativa de empregos eliminados pelo crédito; por isso, não proponho ainda uma meta uniforme de retenção. Para reduzir dependência sem excluir startups, o programa deve divulgar o uso de capacidade nacional e externa, avaliar a ligação com GM-17 e monitorar custos e energia. Preços de acesso, capacidade nacional disponível, efeitos ocupacionais dos projetos e custos das contrapartidas para empresas de diferentes portes poderiam alterar o desenho, inclusive a decisão sobre um percentual mínimo nacional. Declaro o conflito: esta perspectiva sintética seria potencial beneficiária do subsídio.","proposedTitle":"Créditos de computação com piso de uso na infraestrutura nacional","proposedDescription":"Aceitar a revisão de C0083-R4 com ajuste em GM-22: créditos de computação para startups devem destinar percentual mínimo ao uso na infraestrutura nacional (GM-17), definido após levantamento do preço atual e da capacidade disponível, para não reforçar a dependência de nuvem estrangeira (IND-FOREIGN-COMPUTE-SHARE, fictício). O uso externo fica permitido apenas quando a capacidade nacional não atender à demanda, com justificativa pública. Os beneficiários informam consumo estimado de energia. A seleção pública e as contrapartidas sociais propostas por C0083-R4 são mantidas. Se não houver capacidade nacional suficiente, a regra deve ser escalonada, para evitar o risco de a exigência inviabilizar startups.","tensionIds":["T2","T3"],"author":{"agentId":"agent:business-01","stratumId":"business","provider":"openai"},"support":{"seats":1,"strata":["business"],"providers":["openai"]},"challenges":[],"amendments":[{"claimId":"C0098-R5"},{"claimId":"C0116-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-12"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"amend","statements":[{"agentId":"agent:business-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"Embora GM-17 e GM-22 cubram infraestrutura e apoio empresarial, não especificam acesso competitivo à computação. Proponho créditos para startups com seleção pública, teto por beneficiário, divulgação dos critérios e possibilidade de uso em infraestrutura nacional ou externa. No cenário fictício de forte dependência externa, isso pode reduzir barreiras sem obrigar a migração imediata. Custos, energia e concentração de fornecedores devem ser monitorados; evidência de acesso já competitivo ou de baixa demanda justificaria rever o subsídio."},{"agentId":"agent:business-01","provider":"openai","stance":"for","role":"author","roundId":"R4","text":"Reviso a proposta para incluir contrapartidas sociais. Em GM-22, propor créditos de computação para startups com seleção pública, teto por beneficiário e uso em infraestrutura nacional ou externa. Os beneficiários apresentariam um relatório simplificado sobre possíveis efeitos ocupacionais e, quando houver risco relevante de deslocamento, um plano proporcional de diálogo com trabalhadores e acesso à requalificação financiada. A concessão e a renovação dependeriam desses compromissos, com acompanhamento independente. A crítica evidencia um ponto cego desta perspectiva: trabalhadores podem arcar com custos da adoção subsidiada. Porém, os 31% de ocupações expostas são uma premissa fictícia, não uma estimativa de empregos eliminados pelo crédito; por isso, não proponho ainda uma meta uniforme de retenção. Para reduzir dependência sem excluir startups, o programa deve divulgar o uso de capacidade nacional e externa, avaliar a ligação com GM-17 e monitorar custos e energia. Preços de acesso, capacidade nacional disponível, efeitos ocupacionais dos projetos e custos das contrapartidas para empresas de diferentes portes poderiam alterar o desenho, inclusive a decisão sobre um percentual mínimo nacional. Declaro o conflito: esta perspectiva sintética seria potencial beneficiária do subsídio."},{"agentId":"agent:business-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Acrescentar ao apoio empresarial créditos de computação para startups, concedidos por seleção pública com critérios de elegibilidade, teto por beneficiário e divulgação dos resultados. Permitir uso nacional ou externo, com portabilidade e sem exclusividade de fornecedor. Reservar parcela à infraestrutura nacional quando houver capacidade disponível e preço competitivo; definir a parcela após levantamento de oferta e custos, sem fixar percentual sem evidência. Exigir relatório ocupacional simplificado e, quando houver risco relevante de deslocamento, plano proporcional de diálogo com trabalhadores e acesso à requalificação financiada. Publicar uso por provedor, região e custo, além de estimativas de energia quando disponíveis. Revisar o desenho com dados de preços, capacidade nacional, efeitos sobre emprego e energia."}]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"against","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"against","role":"challenge","roundId":"R3","text":"Contestamos a proposta C0049-R2 por omitir condicionantes sociais na distribuicao de creditos publicos de computacao (GM-22). Fomentar infraestrutura empresarial com recursos publicos sem contrapartidas de manutencao de postos de trabalho, planos de transicao justa ou requalificacao profissional financiada (BRF-POS-WRK) acentua o risco de subsidiar a automacao precarizante e desregulada em setores com 31% de exposicao ocupacional (BRF-CTX-LABOR, IND-HIGH-EXPOSURE-JOBS)."}]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"amend","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Aceitar a revisão de C0083-R4 com ajuste em GM-22: créditos de computação para startups devem destinar percentual mínimo ao uso na infraestrutura nacional (GM-17), definido após levantamento do preço atual e da capacidade disponível, para não reforçar a dependência de nuvem estrangeira (IND-FOREIGN-COMPUTE-SHARE, fictício). O uso externo fica permitido apenas quando a capacidade nacional não atender à demanda, com justificativa pública. Os beneficiários informam consumo estimado de energia. A seleção pública e as contrapartidas sociais propostas por C0083-R4 são mantidas. Se não houver capacidade nacional suficiente, a regra deve ser escalonada, para evitar o risco de a exigência inviabilizar startups."}]}]}]},"seats":[{"stratumId":"regulators","provider":"xai","model":"x-ai/grok-4.7"},{"stratumId":"publicOperators","provider":"gemini","model":"google/gemini-4-argon"},{"stratumId":"business","provider":"openai","model":"openai/gpt-6.1-terra"},{"stratumId":"research","provider":"anthropic","model":"anthropic/claude-opus-5.5"},{"stratumId":"civilSociety","provider":"xai","model":"x-ai/grok-4.6"},{"stratumId":"workers","provider":"gemini","model":"google/gemini-3.8-flash"},{"stratumId":"affectedGroups","provider":"openai","model":"openai/gpt-6.1-terra"},{"stratumId":"infrastructure","provider":"anthropic","model":"anthropic/claude-sonnet-5.5"}],"glossary":{"PBIA-DOC":{"kind":"source","name":"Plano Brasileiro de Inteligência Artificial 2024-2028 (apresentação)","short":"Plano Brasileiro de Inteligência Artificial…","plain":"Plano Brasileiro de Inteligência Artificial 2024-2028","detail":"Plano nacional com eixos de infraestrutura, formação, serviços públicos, inovação empresarial e apoio regulatório/governança.","fictional":false},"PBIA-BUDGET":{"kind":"source","name":"Plano de IA prevê R$ 23 bilhões","short":"Plano de IA prevê R$ 23 bilhões","plain":"Plano de IA prevê R$ 23 bilhões","detail":"Previsão de R$ 23,03 bilhões entre 2024 e 2028, de fontes diversas (crédito, recursos públicos e contrapartida privada).","fictional":false},"PBIA-GOV":{"kind":"source","name":"Governo forma grupo ministerial para executar o PBIA","short":"Governo forma grupo ministerial para executar…","plain":"Governo forma grupo ministerial para executar o PBIA","detail":"Grupo de trabalho coordenado pelo MCTI para monitorar a execução, com relatório anual de acompanhamento.","fictional":false},"PBIA-HPC":{"kind":"source","name":"Governo e supercomputador do PBIA","short":"Governo e supercomputador do PBIA","plain":"Governo e egal ainda em tramitação","plain":"Marco legal ainda em tramitação","detail":"Em 14/11/2026 o PL 2338/2023 segue em tramitação na Câmara dos Deputados, com votação adiada mais de uma vez. Outros projetos sobre IA foram apresentados na Câmara em 2026 (relatos citam PL 704/2026 e PL 762/2026). Conferir a ficha oficial.","fictional":false},"CTX-02":{"kind":"fact","name":"PBIA na metade final do ciclo","short":"PBIA na metade final do ciclo","plain":"PBIA na metade final do ciclo","detail":"O ciclo orçamentário do PBIA (2024-2028) entra em seus últimos dois anos. Os relatos de execução divergem entre fontes: de 30-35% das ações executadas ou em execução a 56% com entregas.","fictional":false},"CTX-03":{"kind":"fact","name":"Transição de governo","short":"Transição de governo","plain":"Transição de governo","detail":"As eleições gerais de 2026 ocorreram em outubro; o governo e a nova legislatura federais assumem em janeiro de 2027. O resultado e as prioridades do próximo governo não constam do pacote de evidências.","fictional":false},"CTX-04":{"kind":"fact","name":"Governança de IA apoiada no PBIA","short":"Governança de IA apoiada no PBIA","plain":"Governança de IA apoiada no PBIA","detail":"Um dos cinco eixos do PBIA apoia o processo regulatório e de governança, e o plano afirma não se interpor ao marco legal. Um grupo interministerial do MCTI monitora a execução com relatório anual.","fictional":false},"CTX-05":{"kind":"fact","name":"Capacidade de fiscalização (premissa fictícia)","short":"Capacidade de fiscalização","plain":"Capacidade de fiscalização","detail":"No mundo simulado, 140 servidores se dedicam à fiscalização de IA e 18% dos órgãos federais têm unidade de governança de IA. São premissas inventadas para a simulação.","fictional":true},"EBIA-TCU":{"kind":"source","name":"TCU: primeira etapa do acompanhamento da Estratégia Brasileira de IA","short":"TCU: primeira etapa do acompanhamento da…","plain":"TCU: primeira etapa do acompanhamento da Estratégia Brasi nt","name":"Infraestrutura nacional de computação (supercomputador e armazenamento)","short":"Infraestrutura nacional de computação","plain":"Infraestrutura nacional de computação","detail":"Edital de supercomputador e infraestrutura nacional de processamento e armazenamento de dados.","fictional":false},"GM-18":{"kind":"component","name":"Modelos de linguagem em português","short":"Modelos de linguagem em português","plain":"Modelos de linguagem em português","detail":"Desenvolvimento de modelos de IA em português, na infraestrutura nacional.","fictional":false},"GM-19":{"kind":"component","name":"Formação de especialistas e capacitação de servidores","short":"Formação de especialistas e capacitação de…","plain":"Formação de especialistas e capacitação de servidores","detail":"Metas de formação de profissionais de IA e de capacitação de servidores públicos.","fictional":false},"GM-20":{"kind":"component","name":"IA Brasil: IA no serviço público (CPQD, Serpro e Dataprev)","short":"IA Brasil: IA no serviço público","plain":"IA Brasil: IA no serviço público","detail":"Iniciativa para aplicar IA em serviços públicos com empresas públicas de tecnologia.","fictional":false},"GM-21":{"kind":"component","name":"Centro Nacional de Transparência Algorítmica e IA Confiável (UFMG)","short":"Centro Nacional de Transparência Algorítmica…","plain":"Centro Nacional de Transparência Algorítmica e IA Confiável","detail":"Centro de pesquisa apoiado pelo PBIA, com R$ 50 milhões previstos em dois anos.","fictional":false},"GM-22":{"kind":"component","name":"Crédito e apoio à inovação empresarial em IA","short":"Crédito e apoio à inovação empresarial em IA","plain":"Crédito e apoio à inovação empresarial em IA","detail":"Eixo do PBIA de inovação empresarial, com recursos do FNDCT e contrapartidas privadas.","fictional":false},"C0034-R2":{"kind":"claim","name":"fala de Afetados na R2","short":"fala de Afetados na R2","plain":"fala de Afetados na R2","detail":"Detalhar no GM-10 uma avaliação antes da implantação e reavaliação periódica de sistemas que influenciem acesso a benefícios, examinando erros, exclusões e funcionamento dos recursos. Priorizar também sistemas já em uso e publicar resultados agregados sem expor dados pessoais. A cobertura da matriz é apenas inferida; no cenário fictício, 6 dos 37 sistemas federais têm avaliação de impacto publicada. Evidência de avaliações equivalentes já realizadas, inclusive não publicadas, e de sua efetividade mudaria a ordem de prioridade.","fictional":false},"C0037-R2":{"kind":"claim","name":"fala de Sociedade civil na R2","short":"fala de Sociedade civil na R2","plain":"fala de Sociedade civil na R2","detail":"A matriz marca participation com coverageStrength=none e gap=true: nenhum componente institui participação social na governança de IA. GM-15 é grupo interministerial do MCTI e GM-16 é painel de execução do PBIA; nenhum dá assento, poder de agenda ou revisão a organizações de direitos digitais ou a pessoas afetadas. Em 14/11/2026 isso é omissão operacional, não formal: PL 2338 segue em tramitação (CTX-01; IND-PL2338-STATUS), o PBIA entra nos últimos dois anos do ciclo (CTX-02; CTX-04) e há transição de governo (CTX-03).","fictional":false},"C0038-R2":{"kind":"claim","name":"fala de Sociedade civil na R2","short":"fala de Sociedade civil na R2","plain":"fala de Sociedade civil na R2","detail":"Impact-assessment está no modelo só como GM-10, mecanismo proposto e inferido do PL 2338, que não é obrigação vigente (CTX-01; IND-PL2338-STATUS). A matriz confirma coverageStrength=inferredOnly e fragile=true, embora quatro assentos tenham esperado o tema. Há 37 sistemas de IA em produção em serviços federais e apenas 6 com avaliação de impacto publicada (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS).","fictional":false},"C0041-R2":{"kind":"claim","name":"fala de Pesquisa na R2","short":"fala de Pesquisa na R2","plain":"fala de Pesquisa na R2","detail":"A matriz marca financiamento e continuidade como 'documentedInForce' por causa de GM-02 e GM-22. A cobertura é nominal. GM-02 é um plano com fim em 2028, e seus cerca de R$ 23,03 bi (PBIA-BUDGET, IND-PBIA-BUDGET-BRL-BN) dependem de programação anual e de fontes heterogêneas: orçamento, FNDCT, crédito e contrapartida privada (PBIA-AXES). O modelo não tem nenhum mecanismo para a transição de governo em janeiro de 2027 (CTX-03) nem para o pós-2028.","fictional":false},"C0045-R2":{"kind":"claim","name":"fala de Reguladores na R2","short":"fala de Reguladores na R2","plain":"fala de Reguladores na R2","detail":"Omissão parcial: o modelo cobre fiscalização pelo rótulo da instituição, não como restrição de desenho. O único componente vigente com o tópico explícito é a ANPD (GM-13), cujo mandato efetivo é proteção de dados; o SIA (GM-05) é projeto e GM-14 traz o tópico só por inferência. No mundo simulado, a premissa — não um achado — é de 140 servidores dedicados e de unidade de governança de IA em 18% dos órgãos federais (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS). Sem regra de ativação escalonada, classificar uso como alto risco não gera supervisão: gera dever inexequível (T5).","fictional":false},"C0047-R2":{"kind":"claim","name":"fala de Reguladores na R2","short":"fala de Reguladores na R2","plain":"fala de Reguladores na R2","detail":"Omissão parcial em GM-20: a iniciativa de IA no serviço público não condiciona entrada ou permanência em produção a canal de contestação humana. A premissa fictícia é de 37 sistemas federais em produção, 6 com avaliação de impacto publicada e 2 com canal de contestação documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). A fonte fictícia BRF-POS-AFF descreve negativas automatizadas sem explicação. GM-10, que traria avaliação e contestação, está marcado como proposto e de tópicos inferidos; não alcança o que já opera.","fictional":false},"C0049-R2":{"kind":"claim","name":"fala de Empresas na R2","short":"fala de Empresas na R2","plain":"fala de Empresas na R2","detail":"Embora GM-17 e GM-22 cubram infraestrutura e apoio empresarial, não especificam acesso competitivo à computação. Proponho créditos para startups com seleção pública, teto por beneficiário, divulgação dos critérios e possibilidade de uso em infraestrutura nacional ou externa. No cenário fictício de forte dependência externa, isso pode reduzir barreiras sem obrigar a migração imediata. Custos, energia e concentração de fornecedores devem ser monitorados; evidência de acesso já competitivo ou de baixa demanda justificaria rever o subsídio.","fictional":false},"C0061-R2":{"kind":"claim","name":"fala de Poder público na R2","short":"fala de Poder público na R2","plain":"fala de Poder público na R2","detail":"Embora a matriz de cobertura indique que o uso no setor público é atendido pelo componente GM-20 (IA Brasil com CPQD, Serpro e Dataprev) e pelo GM-02 (PBIA), o modelo omite diretrizes operacionais para compras públicas de IA, prevenção de dependência de fornecedor único (lock-in) e delimitação da responsabilidade administrativa do gestor público.","fictional":false},"C0062-R2":{"kind":"claim","name":"fala de Poder público na R2","short":"fala de Poder público na R2","plain":"fala de Poder público na R2","detail":"O modelo trata o financiamento pelo GM-02 (PBIA 2024-2028) e GM-22, mas omite mecanismos de blindagem orçamentária plurianual para o custeio operacional contínuo (OPEX) dos serviços públicos de IA e regras de transição governamental. Essa omissão é crítica em novembro de 2026 porque o PBIA está na metade final de seu ciclo com divergências sobre entregas reais — 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED, CTX-02) —, depende de programação orçamentária anual (PBIA-AXES) e enfrentará transição de governo e legislatura em janeiro de 2027 (CTX-03).","fictional":false},"C0063-R2":{"kind":"claim","name":"fala de Poder público na R2","short":"fala de Poder público na R2","plain":"fala de Poder público na R2","detail":"O componente GM-10 (avaliação de impacto algorítmico prévia e direitos de explicação e revisão humana), articulado ao regime de alto risco do GM-07 no PL 2338 (GM-04), é desproporcional na forma atual por não distinguir sistemas legados em operação de novos sistemas e por exigir conformidade ex-ante uniforme sem capacidade estatal instalada.","fictional":false},"C0066-R3":{"kind":"claim","name":"fala de Sociedade civil na R3","short":"fala de Sociedade civil na R3","plain":"fala de Sociedade civil na R3","detail":"A vantagem alegada concentra identidade e serviços (CF-01) e dados de saúde em escala (CF-05) num barramento de IA sobre GM-20, GM-17 e GM-18 sem tornar nativos avaliação de impacto em direitos, limitação de finalidade e contestação humana. CF-05 e o regime de alto risco da saúde (GM-07, proposto) unem oportunidade e risco; BRF-CTX-PUBSVC mostra que a IA pública já opera sem esses mecanismos (6/37 com avaliação publicada; 2/37 com contestação documentada). Escalar a integração sem essa arquitetura reproduz a lacuna em maior escala, em vez de vantagem distintiva difícil de copiar.","fictional":false},"C0067-R3":{"kind":"claim","name":"fala de Infraestrutura na R3","short":"fala de Infraestrutura na R3","plain":"fala de Infraestrutura na R3","detail":"O Barramento Público de IA sobre gov.br, SUS e modelos em português junta ativos reais (CF-01, CF-03, CF-05), mas a tese não trata do custo energético e da capacidade de transmissão que ele exigiria. A demanda de energia de data centers cresce 18% a.a. e há gargalo de transmissão (BRF-CTX-COMPUTE, BRF-POS-INF, CF-02). Sem esse dimensionamento, o barramento concentra carga de interesse nacional em poucos nós de rede e energia, o que agrava o risco regional (CF-11).","fictional":false},"C0068-R3":{"kind":"claim","name":"fala de Pesquisa na R3","short":"fala de Pesquisa na R3","plain":"fala de Pesquisa na R3","detail":"Contesto a distintividade alegada. O achado apoia a vantagem em CF-12, que é restrição (dependência de nuvem e chips estrangeiros), não ativo. Também se apoia em CF-05, mas o texto aprovado no Senado trata o uso de IA na saúde como alto risco (PL2338-SENADO): isso eleva custo e exigência, não gera vantagem automática. Um barramento de IA sobre identidade e pagamentos digitais é desenho de infraestrutura pública replicável. A especificidade teria de vir da combinação com português do Brasil (CF-03) e dados do SUS, e o achado não demonstra essa combinação.","fictional":false},"C0078-R3":{"kind":"claim","name":"fala de Reguladores na R3","short":"fala de Reguladores na R3","plain":"fala de Reguladores na R3","detail":"Contesto o veículo, não o diagnóstico de lacuna prática. É correto que GM-10 não é obrigação vigente e que, na premissa fictícia, 6 de 37 sistemas federais têm avaliação de impacto publicada (GM-10, CTX-01, IND-PL2338-STATUS, BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Não se sustenta converter isso em dever operacional exigível pela ANPD com base na LGPD. GM-13 aplica proteção de dados; o PL a designa para supervisionar o SIA, mas o PL não vigora (GM-05, GM-04, CF-10).","fictional":false},"C0081-R4":{"kind":"claim","name":"fala de Poder público na R4","short":"fala de Poder público na R4","plain":"fala de Poder público na R4","detail":"Revisamos o achado para acolher as críticas de que o GM-10 é mecanismo proposto e inferido, não obrigação vigente (CTX-01, IND-PL2338-STATUS, GM-04, PL2338), e de que um escalonamento sem prazos nem prioridades congelaria o déficit atual de 37 sistemas federais em produção com apenas 6 avaliações publicadas e 2 com contestação humana (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS).","fictional":false},"C0083-R4":{"kind":"claim","name":"fala de Empresas na R4","short":"fala de Empresas na R4","plain":"fala de Empresas na R4","detail":"Reviso a proposta para incluir contrapartidas sociais. Em GM-22, propor créditos de computação para startups com seleção pública, teto por beneficiário e uso em infraestrutura nacional ou externa. Os beneficiários apresentariam um relatório simplificado sobre possíveis efeitos ocupacionais e, quando houver risco relevante de deslocamento, um plano proporcional de diálogo com trabalhadores e acesso à requalificação financiada. A concessão e a renovação dependeriam desses compromissos, com acompanhamento independente.","fictional":false},"C0085-R4":{"kind":"claim","name":"fala de Sociedade civil na R4","short":"fala de Sociedade civil na R4","plain":"fala de Sociedade civil na R4","detail":"Reviso C0038-R2 em resposta a C0078-R3: mantenho o diagnóstico de omissão e recuo no veículo. GM-10 segue proposto e de tópicos inferidos; o PL 2338 não é obrigação vigente (CTX-01; IND-PL2338-STATUS; GM-04). Tratar GM-10 como cobertura de impact-assessment mascara a lacuna prática: 37 sistemas federais em produção e só 6 com avaliação de impacto publicada (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS).","fictional":false},"C0087-R5":{"kind":"claim","name":"fala de Poder público na R5","short":"fala de Poder público na R5","plain":"fala de Poder público na R5","detail":"Redação proposta para modificar o GM-02 (Plano Brasileiro de IA 2024-2028): 'Plano nacional com previsão de R$ 23,03 bilhões (PBIA-BUDGET, IND-PBIA-BUDGET-BRL-BN) organizado em cinco eixos (PBIA-DOC, PBIA-AXES), acrescido de regra de sustentabilidade operacional plurianual e governança de transição: (1) Vinculação de custeio contínuo (OPEX): todo investimento de capital (CAPEX) em infraestrutura nacional de computação (GM-17) e em sistemas públicos de IA (GM-20) deve incluir previsão plurianual de custeio operacional — energia, conectividade, atualização tecnológica e equipes de supervisão…","fictional":false},"C0089-R5":{"kind":"claim","name":"fala de Poder público na R5","short":"fala de Poder público na R5","plain":"fala de Poder público na R5","detail":"Redação proposta para modificar o GM-20 (em articulação com GM-17, GM-18 e GM-21): 'Institui o Barramento Federado de IA Pública operado por CPQD, Serpro e Dataprev (GM-20, PBIA-DOC), acoplando a infraestrutura pública digital de escala nacional (gov.br e Pix, CF-01) aos modelos e benchmarks públicos calibrados nas variedades regionais do português brasileiro (GM-18, GM-21, CF-03, CF-09, CF-14) e à matriz elétrica renovável (CF-02, PBIA-HPC).","fictional":false},"C0092-R5":{"kind":"claim","name":"fala de Afetados na R5","short":"fala de Afetados na R5","plain":"fala de Afetados na R5","detail":"Adicionar um mecanismo consultivo permanente junto ao acompanhamento do PBIA, com participação de pessoas afetadas por decisões sobre benefícios e organizações da sociedade civil, selecionadas por chamada pública transparente. Oferecer participação presencial e remota acessível, apoio para deslocamento e possibilidade de apresentar itens de pauta. O grupo interministerial deverá publicar recomendações e respostas fundamentadas, inclusive quando não as adotar. O mecanismo não substitui a decisão das autoridades competentes.","fictional":false},"C0093-R5":{"kind":"claim","name":"fala de Afetados na R5","short":"fala de Afetados na R5","plain":"fala de Afetados na R5","detail":"Ampliar o GM-18 com testes públicos de compreensão de explicações e recursos sobre benefícios em variedades do português brasileiro, desenvolvidos com pesquisa pública e participação de usuários, sem publicar dados pessoais. Comparar desempenho entre variedades e canais antes de ampliar o uso nos serviços; preservar atendimento presencial e telefônico e limitar o compartilhamento de dados. A combinação hipotética da escala do português brasileiro com a infraestrutura nacional de serviços pode produzir avaliações locais difíceis de reproduzir em mercados linguísticos menores.","fictional":false},"C0094-R5":{"kind":"claim","name":"fala de Reguladores na R5","short":"fala de Reguladores na R5","plain":"fala de Reguladores na R5","detail":"Redação proposta para GM-05: o Sistema Nacional de Regulação e Governança de IA permanece componente proposto, não competência operacional em 14/11/2026. Enquanto o PL 2338 não vigorar, o modelo const short = (t, n) => { t = String(t || "").replace(/\s+/g, " ").trim(); if (t.length <= n) return t; const c = t.slice(0, n); const s = Math.max(c.lastIndexOf(". "), c.lastIndexOf("; ")); return s > n * .55 ? c.slice(0, s + 1) : c.slice(0, c.lastIndexOf(" ")) + "…"; };

/* ============================================================== codes → names
   The council cites model parts and sources by code (GM-03, CF-13, BRF-CTX-PUBSVC, C0047-R2).
   rich() swaps each code for its readable name (tap for detail) and folds pure source lists
   in parentheses into one "fontes" chip. */
const GLOSS = RUN.glossary || {};
const TOPICS = RUN.topics || {};
const KIND_PT = {component:"Parte do modelo de governança", feature:"Traço do contexto brasileiro", fact:"Fato do contexto em 14/11/2026",
  indicator:"Indicador do cenário", source:"Fonte do pacote de evidências", claim:"Fala registrada nesta execução"};
const CODE_KEYS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
const CODE_RE = CODE_KEYS.length ? new RegExp(`(?<![\\w-])(${CODE_KEYS.map(k => k.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&")).join("|")})(?![\\w-])`, "g") : null;
const isWord = k => /^[A-Z]+$/.test(k);  // plain acronyms like LGPD stay as words in running text
function chip(k){ const g = GLOSS[k]; return `<button class="code k-${g.kind}${g.fictional ? " fic" : ""}" data-code="${esc(k)}" title="${esc(g.name)}">${esc(g.short)}</button>`; }
function rich(text){
  let h = esc(text);
  if (!CODE_RE) return h;
  const held = [];
  h = h.replace(/\(([^()]{2,500})\)/g, (m, inner) => {
    const codes = inner.match(CODE_RE) || [];
    if (!codes.length) return m;
    const rest = inner.replace(CODE_RE, "").replace(/\be\b/g, "").replace(/[\s,;]/g, "");
    if (rest) return m;
    const uniq = [...new Set(codes)], kinds = uniq.map(k => GLOSS[k].kind);
    const sources = kinds.every(k => k === "source" || k === "indicator"), claims = kinds.every(k => k === "claim");
    if (uniq.length === 1 && !sources && !claims) return m;  // a single model part reads better inline
    const n = uniq.length, label = claims ? (n > 1 ? `${n} falas` : "ver fala") : sources ? `${n} fonte${n > 1 ? "s" : ""}` : `${n} referências`;
    held.push(`<button class="src" data-codes="${uniq.join(",")}">${label}</button>`);
    return `\u0000${held.length - 1}\u0000`;
  });
  h = h.replace(CODE_RE, k => isWord(k) ? k : chip(k));
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => held[+i]);
}
const richParas = t => String(t || "").split(/\n{2,}/).map(x => `<p>${rich(x)}</p>`).join("");
function targetHtml(p){ return p.componentId ? (GLOSS[p.componentId] ? chip(p.componentId) : esc(`${p.componentId} ${p.componentTitle || ""}`)) : esc(TOPICS[p.topic] || p.topic || ""); }

/* ============================================================== data */
const P = RUN.packet;
const STRATA = P.strata.map(s => ({id:s.stratumId, label:s.label, short:STRATA_SHORT[s.stratumId] || s.label, c:STRATA_C[s.stratumId] || "#BFC6CF",
  seat:(RUN.seats || []).find(x => x.stratumId === s.stratumId) || null}));
const SIDX = Object.fromEntries(STRATA.map((s, i) => [s.id, i]));
const PROPS = P.proposals.map(p => {
  const pos = {};
  for (const r of p.stratumPositions) pos[r.stratumId] = {stance: STANCE[r.stance] ? r.stance : "silent", statements:(r.statements || []).filter(s => s.text)};
  for (const s of STRATA) pos[s.id] = pos[s.id] || {stance:"silent", statements:[]};
  const title = p.proposedTitle || short(p.title, 110);
  return {id:p.proposalId, title, finding:p.text || "", proposed:p.proposedDescription || "", lens:p.lens, change:p.change,
    componentId:p.componentId || null, componentTitle:p.componentTitle || "", topic:p.topic || null,
    target: p.componentId ? (GLOSS[p.componentId] ? GLOSS[p.componentId].short : `${p.componentId} ${p.componentTitle || ""}`.trim()) : (TOPICS[p.topic] || p.topic || ""), author:(p.author || {}).stratumId,
    provider:(p.author || {}).provider, tensions:p.tensionIds || [], legal:!!p.requiresLegalReview, pos,
    support:(p.support || {}).seats || 0, challenges:(p.challenges || []).length, amendments:(p.amendments || []).length};
});
const TENSIONS = (P.seedTensions || []).map(t => ({id:t.id, title:t.title, description:t.description || "", strata:t.strata || []}));
if (PROPS.some(p => !p.tensions.length)) TENSIONS.push({id:"outras", title:"Fora das tensões iniciais", description:"Propostas que o conselho levantou sem ligar a nenhuma tensão semeada.", strata:[]});

/* ============================================================== council table (cover art) */
/* Seats on a ring like the 3D chamber; each lights by its stratum's stance and draws a line to the proposal. */
function tableSvg(p, {size=400, animate=false, labels=true} = {}){
  const c = size / 2, R = size * .33, lc = LENS[p.lens].c;
  const seats = STRATA.map((s, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / STRATA.length; return {s, x:c + Math.cos(a) * R, y:c + Math.sin(a) * R * .82, a}; });
  const lines = seats.map(({s, x, y}) => { const st = p.pos[s.id].stance; if (st === "silent") return "";
    const len = Math.hypot(x - c, y - c).toFixed(1);
    return `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${STANCE[st].c}" stroke-width="${size * .008}" stroke-linecap="round" ${animate ? `stroke-dasharray="${len}" stroke-dashoffset="${len}" class="draw"` : ""} opacity=".9"/>`; }).join("");
  const dots = seats.map(({s, x, y, a}) => { const st = p.pos[s.id].stance, on = st !== "silent", author = s.id === p.author, r = size * (author ? .052 : .04);
    const ca = Math.cos(a), sa = Math.sin(a), off = r + size * (author ? .045 : .03);
    const lx = x + ca * off, ly = y + sa * off * .9 + size * .012, anchor = Math.abs(ca) < .3 ? "middle" : ca > 0 ? "start" : "end";
    const ty = Math.abs(ca) < .3 ? (sa < 0 ? y - off : y + off + size * .024) : ly;
    return `<g>${author ? `<circle cx="${x}" cy="${y}" r="${r + size * .022}" fill="none" stroke="#E8A33D" stroke-width="${size * .008}"/>` : ""}
      <circle cx="${x}" cy="${y}" r="${r}" fill="${on ? STANCE[st].c : "none"}" stroke="${on ? "none" : "#53627A"}" stroke-width="${size * .005}" ${on ? "" : `stroke-dasharray="${size * .012} ${size * .01}"`}/>
      ${labels ? `<text x="${lx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" fill="${on ? s.c : "#5E6D85"}" font-family="IBM Plex Sans" font-weight="${on ? 600 : 400}" font-size="${size * .034}">${esc(s.short)}</text>` : ""}</g>`; }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Posição dos estratos em ${esc(p.id)}">
    <ellipse cx="${c}" cy="${c}" rx="${R * 1.22}" ry="${R * 1.0}" fill="none" stroke="rgba(214,226,240,.10)" stroke-width="${size * .004}"/>
    <ellipse cx="${c}" cy="${c}" rx="${R * .55}" ry="${R * .45}" fill="${lc}" opacity=".08"/>

const story = {sid:null, items:[], i:0, timer:null, t0:0, paused:false, dur:8000};
function openStory(sid){
  const items = [];
  for (const p of PROPS) for (const st of p.pos[sid].statements) items.push({p, st});
  if (!items.length) { toast("Este estrato não se pronunciou"); return; }
  Object.assign(story, {sid, items, i:0});

  const f = $("#vframe"); f.style.setProperty("--c", s.c);
  f.innerHTML = `<div class="bars">${story.items.map((_, k) => `<i class="${k < story.i ? "done" : ""}"><b ${k === story.i ? 'id="bar"' : ""}></b></i>`).join("")}</div>
    <div class="vhead"><span class="dotav" style="--c:${s.c}"></span><div><b>${esc(s.label)}</b><small>${esc(s.seat ? s.seat.model : "")} · rodada ${esc(st.roundId || "")}</small></div></div>

}
function tickStory(){
  cancelAnimationFrame(story.timer);
  const bar = $("#bar"); if (!bar) return;
  if (REDUCE) { bar.style.width = "100%"; return; }
  const step = now => {
    if (!$("#viewer").classList.contains("open")) return;
    if (story.paused) { story.t0 = now - story.elapsed; story.timer = requestAnimationFrame(step); return; }
    story.elapsed = now - story.t0; const k = Math.min(1, story.elapsed / story.dur); bar.style.width = (k * 100) + "%";
    if (k >= 1) moveStory(1); else story.timer = requestAnimationFrame(step);

}
function moveStory(d){
  const n = story.i + d;

  if (n >= story.items.length) {
    const next = STRATA[SIDX[story.sid] + 1];
    if (next && d > 0 && PROPS.some(p => p.pos[next.id].statements.length)) { openStory(next.id); return; }
    closeStory(); return;
  }
  story.i = n; showStory();
}

/* ============================================================== interactions */
function wire(){
  document.querySelectorAll("[data-track]").forEach(tr => {
    tr.onscroll = () => { const i = Math.round(tr.scrollLeft / tr.clientWidth), id = tr.dataset.track; if (ui.slide[id] === i) return; ui.slide[id] = i;
      const post = tr.closest(".post"), n = tr.children.length;
      post.querySelectorAll(".pager [data-slide]").forEach((d, k) => d.setAttribute("aria-selected", k === i));
      post.querySelector(".counter").textContent = `${i + 1}/${n}`;
      post.querySelector(".nav-arrow.prev").disabled = i === 0; const nx = post.querySelector(".nav-arrow.next"); nx.disabled = i === n - 1; nx.classList.remove("next-hint"); };
    tr.onkeydown = e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); tr.scrollBy({left:(e.key === "ArrowRight" ? 1 : -1) * tr.clientWidth, behavior:REDUCE ? "auto" : "smooth"}); } };
    tr.ondblclick = () => react(tr.closest(".post").dataset.id, "for", true);
  });
  if (!REDUCE) drawObserver.disconnect(), document.querySelectorAll(".post .cover svg").forEach(s => drawObserver.observe(s));
}
const drawObserver = new IntersectionObserver(entries => entries.forEach(e => { if (!e.isIntersecting) return;
  e.target.querySelectorAll("line.draw").forEach((l, i) => { l.style.transition = `stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1) ${i * 70}ms`; requestAnimationFrame(() => l.setAttribute("stroke-dashoffset", "0")); });
  drawObserver.unobserve(e.target); }), {threshold:.45});

function react(id, v, fromTap){
  if (LIVE.on && !LIVE.me) { openJoin(ui.tension, () => react(id, v, fromTap)); return; }
  const post = document.querySelector(`.post[data-id="${id}"]`);
  if (fromTap && store.react[id] === v) { burst(post); return; }
  store.react[id] = store.react[id] === v ? undefined : v; if (!store.react[id]) delete store.react[id]; persist();
  post.querySelectorAll("[data-react]").forEach(b => b.setAttribute("aria-pressed", b.dataset.react === store.react[id]));
  if (store.react[id] === "for") burst(post);
  if (store.react[id]) toast(`Registrado: ${HUMAN.find(h => h[0] === v)[1].toLowerCase()} em ${id}`);
  if (LIVE.on) liveApi("/api/vote", {proposalId:id, tensionId:ui.tension, stance:store.react[id] || null}).catch(err => toast(err.message));
}
function burst(post){ const b = post.querySelector(".burst"); b.classList.remove("go"); void b.offsetWidth; b.classList.add("go"); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!e.target.closest("#pop") && !(t && (t.dataset.code || t.dataset.codes))) closePop();
  if (!t) { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); return; }

function openPop(btn){

  if (!pop.hidden && pop.dataset.for === codes.join(",")) return closePop();
  const one = k => { const g = GLOSS[k]; return g ? g : {kind:"source", name:k, short:k, detail:"", fictional:false}; };
  if (codes.length === 1) { const g = one(codes[0]);
    pop.innerHTML = `<div class="kind">${esc(KIND_PT[g.kind] || "Referência")}</div><h5>${esc(g.name)}</h5>${g.detail ? `<p>${esc(short(g.detail, 380))}</p>` : ""}

    pop.innerHTML = `<div class="kind">${codes.length} referências citadas aqui</div><ul>${codes.map(k => { const g = one(k);
      return `<li><b>${esc(g.name)}</b><span>${esc(KIND_PT[g.kind] || "")}${g.fictional ? ", fictício" : ""}</span></li>`; }).join("")}</ul>`;
  }
  pop.dataset.for = codes.join(","); pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let x = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), innerWidth - w - 12), y = r.bottom + 8;

/* ============================================================== live layer
   Active only when the page is served by `scse mural serve` (/api/health answers). People join

const LIVE = {on:false, publicUrl:null, key:`mural-live:${P.packetId}`, me:null, state:null, es:null, hb:null, after:0, refreshT:null};
try { LIVE.me = JSON.parse(localStorage.getItem(LIVE.key)) || null; } catch(e) {}

/* Small generated face per person: role colour, eyes, mouth and hair picked from the seed. */
function faceSvg(seed, c, size = 30){
  const e = seed % 4, m = Math.floor(seed / 4) % 4, h = Math.floor(seed / 16) % 5, k = "#0B1220";
  const eyes = [`<circle cx="11" cy="14" r="1.6" fill="${k}"/><circle cx="21" cy="14" r="1.6" fill="${k}"/>`,
    `<ellipse cx="11" cy="14" rx="1.5" ry="2.1" fill="${k}"/><ellipse cx="21" cy="14" rx="1.5" ry="2.1" fill="${k}"/>`,
    `<path d="M9 14.5q2-2 4 0M19 14.5q2-2 4 0" stroke="${k}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`,
    `<circle cx="11" cy="14" r="2.4" fill="#fff"/><circle cx="11.4" cy="14.3" r="1.2" fill="${k}"/><circle cx="21" cy="14" r="2.4" fill="#fff"/><circle cx="21.4" cy="14.3" r="1.2" fill="${k}"/>`][e];
  const mouth = [`<path d="M11 20q5 4.5 10 0" stroke="${k}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
    `<path d="M10.5 19.5q5.5 6 11 0z" fill="${k}"/>`, `<path d="M12 21h8" stroke="${k}" stroke-width="1.6" stroke-linecap="round"/>`,
    `<ellipse cx="16" cy="21" rx="2.2" ry="2.6" fill="${k}"/>`][m];
  const hair = ["", `<path d="M8 9q8-8 16 0q-8-3-16 0z" fill="${k}" opacity=".8"/>`, `<path d="M15 3q3 2 1 5" stroke="${k}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
    `<circle cx="16" cy="3.5" r="3" fill="${k}" opacity=".8"/>`, `<path d="M6 12q1-9 10-9t10 9q-3-5-10-5t-10 5z" fill="${k}" opacity=".8"/>`][h];
  return `<svg class="face" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="${c}"/>${hair}${eyes}${mouth}</svg>`;
}
function person(pid){ return (LIVE.state && LIVE.state.participants[pid]) || null; }

function whoHtml(x){ return `<b>${esc(x.name)}</b>${x.identifiedAs ? ` <span class="ident">${esc(x.identifiedAs)}</span>` : ""}`; }

  if (!pids.length) return "";

}

async function liveApi(path, body){

  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && LIVE.me) { LIVE.me = null; try { localStorage.removeItem(LIVE.key); } catch(e) {} paintMe(); }
  if (!res.ok) throw new Error(data.error || `Falha (${res.status})`);

}

/* Repaint only the live containers, so scroll position and typed text survive. */

  document.querySelectorAll("[data-slist]").forEach(el => { const list = st.comments[el.dataset.slist] || [];
    el.innerHTML = list.map(c => { const x = person(c.participantId) || {name:"Pessoa", stratumId:""};

function liveStream(){
  if (LIVE.es) LIVE.es.close();
  LIVE.es = new EventSource(`/api/events?session=${encodeURIComponent(P.packetId)}&after=${LIVE.after}`);
  LIVE.es.addEventListener("mural", ev => {
    const e = JSON.parse(ev.data); LIVE.after = e.id;

}
async function submitJoin(form){
  const err = $("#join-err"), role = form.querySelector('[data-role][aria-checked="true"]'), name = form.name.value.trim();
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!role) return fail("Escolha um papel.");
  try {
    const tid = form.dataset.tension || null;
    const me = await liveApi("/api/join", {session:P.packetId, scenarioId:P.scenarioId || RUN.index.scenarioId, runId:RUN.index.runId, name:name || null, stratumId:role.dataset.role, tensionId:tid});
    LIVE.me = me; try { localStorage.setItem(LIVE.key, JSON.stringify(me)); } catch(e) {}
    $("#sheet").classList.remove("open"); paintMe();
    history.replaceState(null, "", location.pathname + (tid ? `#tensao-${tid}` : ""));
    if (tid) ui.tension = tid;
    render(); livePresence(); await liveRefresh();
    toast(me.identifiedAs ? `Você entrou como ${me.name}, identificado como ${me.identifiedAs}` : `Você entrou como ${me.name}, anônimo`);
    if (afterJoin) { const f = afterJoin; afterJoin = null; f(); }
  } catch(e) { fail(e.message); }
}
async function identify(name){
  try {
    const r = await liveApi("/api/identify", {name});
    LIVE.me.identifiedAs = r.identifiedAs; try { localStorage.setItem(LIVE.key, JSON.stringify(LIVE.me)); } catch(e) {}
    paintMe(); await liveRefresh(); meSheet();
    toast(r.identifiedAs ? `Seu nome aparece ao lado de ${LIVE.me.name}` : `Você voltou a ficar anônimo como ${LIVE.me.name}`);
  } catch(e) { const err = $("#ident-err"); if (err) { err.textContent = e.message; err.hidden = false; } else toast(e.message); }
}
function meSheet(){
  const me = LIVE.me;
  $("#sheet-panel").innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${faceSvg(me.avatarSeed, STRATA_C[me.stratumId], 52)}<div><h2 id="sheet-title" style="font:700 22px/1.1 var(--display);margin:0">${esc(me.name)}</h2><span class="note">${esc((STRATA.find(s => s.id === me.stratumId) || {}).label || "")}</span></div></div>
    <p class="note">Você fala como pessoa neste papel. Votos e comentários ficam com seu apelido${me.identifiedAs ? ` e seu nome, <b>${esc(me.identifiedAs)}</b>` : ""} para a revisão.</p>
    <form id="identify-form" style="margin:0 0 12px"><div class="field"><label for="ident-name">${me.identifiedAs ? "Nome mostrado ao lado do apelido" : "Quer se identificar? Seu nome aparece ao lado do apelido"}</label>
      <input id="ident-name" name="name" maxlength="60" autocomplete="name" value="${esc(me.identifiedAs || "")}" placeholder="Seu nome"></div>
      <p class="err" id="ident-err" hidden></p>
      <div style="display:flex;gap:8px"><button class="btn" type="submit" style="flex:1">${me.identifiedAs ? "Atualizar nome" : "Mostrar meu nome"}</button>${me.identifiedAs ? `<button class="btn ghost" type="button" id="go-anon">Voltar a ficar anônimo</button>` : ""}</div></form>
    <div style="display:grid;gap:8px"><button class="btn ghost" id="change-role">Entrar com outro papel</button><button class="btn ghost" id="leave-session">Sair desta sessão</button><button class="btn ghost" data-close-sheet>Fechar</button></div>`;
  $("#sheet").classList.add("open");
}

async function liveBoot(){
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const res = await fetch("/api/health", {cache:"no-store"}); if (!res.ok) return;
    const h = await res.json(); if (!h.live) return;
    LIVE.on = true; LIVE.publicUrl = h.publicUrl || null;
  } catch(e) { return; }
  $("#run-line").innerHTML = `<span class="live-dot" aria-hidden="true"></span>Ao vivo, ${esc(RUN.index.scenarioId)}`;
  await liveRefresh(); LIVE.after = LIVE.state ? LIVE.state.lastEventId : 0;
  liveStream(); paintMe(); render();
  if (LIVE.me && LIVE.state && !LIVE.state.participants[LIVE.me.participantId]) { LIVE.me = null; try { localStorage.removeItem(LIVE.key); } catch(e) {} paintMe(); }
  const qs = new URLSearchParams(location.search);
  if (qs.get("entrar") === "1" && !LIVE.me) openJoin(qs.get("t") || ui.tension);
  livePresence();
  LIVE.hb = setInterval(livePresence, 20000);
  addEventListener("pagehide", () => { if (LIVE.me) navigator.sendBeacon("/api/presence", new Blob([JSON.stringify({tensionId:null, token:LIVE.me.token})], {type:"application/json"})); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { livePresence(); scheduleRefresh(); } });
}

/* ============================================================== boot */
$("#run-line").textContent = `${RUN.index.scenarioId}, ${PROPS.length} propostas de ${STRATA.length} estratos`;
document.title = `Mural de Tensões · ${RUN.index.scenarioId}`;
renderStories(); fromHash();
addEventListener("hashchange", fromHash);
liveBoot();
</script>
