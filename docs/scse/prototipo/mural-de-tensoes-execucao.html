liação de impacto e canal de revisão humana nos sistemas que impliquem negativa ou suspensão de benefícios sociais ou risco em saúde (GM-07, PL2338-SENADO, BRF-POS-AFF), aplicando cronograma gradual aos sistemas administrativos internos de baixo risco para evitar paralisia operacional (BRF-POS-PUBOP); (3) Certificação técnica compartilhada: modelos e barramentos fornecidos por empresas públicas (GM-20) terão avaliação algorítmica de base pré-certificada junto ao Centro de Transparência Algorítmica (GM-21, CF-09), cabendo ao órgão gestor avaliar o impacto específico do caso de uso. Evidência que alteraria a proposta: publicação do texto definitivo do PL 2338 e levantamento oficial da capacidade fiscalizatória.'"}]},{"stratumId":"business","stance":"split","statements":[{"agentId":"agent:business-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"GM-10 descreve uma avaliação esperada, mas sua cobertura é inferida. Reformular o componente para separar claramente obrigações vigentes da LGPD, disposições do PL a conferir e propostas futuras. Para estas, propor documentação graduada por risco e capacidade, com formulários comuns, sem dispensar proteção ou contestação: porte pequeno não reduz necessariamente o dano. Manter a formulação sem essa distinção pode criar falsa segurança jurídica ou gerar custos indevidos. O texto atualizado do PL e dados sobre custos e danos poderiam mudar o desenho."},{"agentId":"agent:business-01","provider":"openai","stance":"against","role":"challenge","roundId":"R3","text":"O escalonamento merece exame, mas GM-10 não estabelece uma exigência uniforme vigente: descreve um mecanismo esperado e inferido, enquanto o PL segue em tramitação. A capacidade fictícia limitada não demonstra, por si, que a formulação atual causaria paralisação. A posição mudaria com texto oficial que comprovasse essa exigência e estimativas de custo e prazo para sistemas novos e legados."},{"agentId":"agent:business-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Redigir o componente como proposta de avaliação de impacto, não como obrigação vigente ou disposição confirmada do PL. Distinguir os direitos existentes na LGPD das disposições do projeto que exigem conferência. Propor formulários comuns e documentação graduada pelo risco e pela capacidade da organização, sem reduzir salvaguardas em função do porte. Para sistemas públicos, prever avaliação antes de novas implantações e cronograma de avaliação dos legados, priorizando os que possam negar ou interromper benefícios; assegurar explicação e contestação. Definir prazos após levantamento de custos, danos e capacidade operacional, sem adiar indefinidamente os casos prioritários."}]},{"stratumId":"research","stance":"split","statements":[{"agentId":"agent:research-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"GM-10 não deveria constar como componente do modelo na forma atual. Sua própria descrição diz que é um mecanismo 'esperado em marcos de IA baseados em risco', não um mecanismo documentado no texto do PL (GM-04, proposto e não vigente). Mesmo assim, ele faz a matriz tratar a avaliação de impacto como 'não lacuna', embora seja o tema com mais expectativa no conselho (4 assentos). O risco de manter como está é mascarar uma lacuna real. No mundo fictício, só 6 dos 37 sistemas federais em produção têm avaliação de impacto publicada, e apenas 2 têm canal de contestação documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Proponho reformular GM-10 em dois movimentos. (a) Reclassificá-lo como hipótese a conferir no texto do PL2338-SENADO. (b) Criar, já sob o regime vigente, uma obrigação administrativa para os sistemas federais: registro público em dados abertos, com finalidade, base legal, avaliação de impacto e canal de contestação, ancorado na revisão de decisões automatizadas prevista na LGPD (GM-03). Essa segunda parte não depende da aprovação do PL (CTX-01). Mudaria de posição se o texto aprovado no Senado trouxer a avaliação de impacto com conteúdo e prazos definidos."},{"agentId":"agent:research-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Reformular GM-10 como 'Avaliação de impacto algorítmico (proposta, não vigente)', em três camadas explícitas. (i) Vigente: direito de revisão de decisões tomadas apenas com base em tratamento automatizado de dados pessoais (GM-03, LGPD), sem apresentá-lo como avaliação de impacto. (ii) A conferir: o que o substitutivo aprovado no Senado (PL2338-SENADO) dispõe sobre avaliação de impacto. Enquanto o PL tramitar (CTX-01, IND-PL2338-STATUS), nada disso é obrigação. (iii) Proposta do conselho, sujeita a decisão humana: avaliação priorizada dos sistemas públicos já em produção que podem negar ou interromper benefícios, com prazos escalonados e não congelamento dos sistemas legados (convergindo com C0034-R2, C0081-R4 e C0085-R4). A metodologia seria aberta e os resultados agregados seriam publicados sem dados pessoais. No mundo fictício, são 6 de 37 sistemas com avaliação publicada (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Enquanto a camada (ii) não for conferida, a matriz de cobertura deve tratar impact-assessment como lacuna, não como coberta por inferência. Risco de manter como está: mascarar o tema que mais assentos esperam. Evidência que mudaria minha posição: o texto oficial com dever de avaliação claro e aplicável ao setor público."},{"agentId":"agent:research-01","provider":"anthropic","stance":"against","role":"challenge","roundId":"R3","text":"O excesso atribuído ao GM-10 não está no modelo. GM-10 é mecanismo proposto e de tópicos inferidos. Sua descrição não impõe conformidade ex-ante uniforme e não diz nada sobre sistemas legados. A desproporção alegada é do texto do PL, que não foi conferido (PL2338, CTX-01). Pelas premissas fictícias, só 6 dos 37 sistemas têm avaliação publicada e 2 têm canal de contestação (BRF-CTX-PUBSVC). Esses números indicam déficit, não excesso. Reconheço a urgência operacional, que é ponto cego da minha perspectiva, e o escalonamento entre sistemas legados e novos é razoável. Mas ele cabe como omissão a modificar: prazo de transição e prioridade por impacto sobre direitos, em linha com a ativação escalonada de C0045-R2. Não cabe como argumento para restringir a avaliação. A 'certificação compartilhada' sem avaliação independente corre risco de virar autoatestação. Mudaria minha posição: o texto oficial do PL mostrar obrigação ex-ante uniforme para sistemas já em produção, sem regra de transição."}]},{"stratumId":"civilSociety","stance":"split","statements":[{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"support","roundId":"R3","text":"Concordo que GM-10, descrito como mecanismo 'esperado' e de tópicos inferidos, não deve figurar como cobertura de impact-assessment. CTX-01 e IND-PL2338-STATUS confirmam que o PL não é obrigação vigente; BRF-CTX-PUBSVC e IND-PUBLIC-AI-SYSTEMS mostram 6 de 37 sistemas federais com avaliação de impacto publicada. Manter a formulação atual mascara a lacuna operacional e cria falsa segurança jurídica. A reformulação deve distinguir hipótese de desenho de dever vigente, sem retirar a exigência de avaliação de impacto em direitos no setor público já em produção."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"against","role":"challenge","roundId":"R3","text":"A tese trata GM-10 como ônus operacional desproporcional já incidente, mas GM-10 é proposto e inferido, não vigente (CTX-01; GM-04). O escalonamento que separa sistemas legados sem prazo nem prioridade para sistemas que afetam benefícios congelaria o status quo: 37 sistemas em produção, 6 com avaliação publicada, 2 com contestação humana (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). O déficit de 140 servidores e de unidade de governança em 18% dos órgãos (CTX-05; BRF-CTX-GOVCAP; IND-AI-INSPECTORS) justifica sequenciar fiscalização e reforçar capacidade, não dispensar avaliação e contestação onde já há dano relatado (BRF-POS-AFF). Certificação compartilhada sem publicação de impacto em direitos e sem revisão humana acessível não resolve T6; privilegia a continuidade do serviço contra a pessoa afetada. Evidência que mudaria a posição: avaliações publicadas e canais de contestação já funcionando nos sistemas legados de benefícios."}]},{"stratumId":"workers","stance":"against","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"against","role":"challenge","roundId":"R3","text":"Contestamos a classificacao da avaliacao de impacto (GM-10) como excesso ou risco de paralisia em C0063-R2. Sob a otica dos trabalhadores, flexibilizar ou adiar a avaliacao previa de impacto sob o pretexto de escassez fiscalizatoria (IND-AI-INSPECTORS: 140) fragiliza garantias fundamentais e expoe trabalhadores a decisoes opacas. O deficit de capacidade estatal deve ser sanado pelo fortalecimento da fiscalizacao e controle social, e nao pela renuncia a salvaguardas ex-ante (BRF-POS-WRK, BRF-CTX-GOVCAP)."}]},{"stratumId":"affectedGroups","stance":"split","statements":[{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"Reformular a apresentação do GM-10 para distinguir explicitamente os mecanismos esperados como hipótese de desenho das disposições que venham a ser confirmadas no texto do PL. Manter a avaliação e a contestação como propostas, não como obrigações já aprovadas ou vigentes. O risco da formulação atual, associada a um componente classificado como proposto, é sugerir um grau de confirmação textual que a matriz identifica como apenas inferido. A conferência do texto oficial do projeto poderia justificar descrição mais precisa."},{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"against","role":"challenge","roundId":"R3","text":"GM-10 descreve avaliação prévia esperada, mas não estabelece uma exigência vigente e uniforme para sistemas legados. A capacidade fictícia limitada justifica examinar escalonamento; não demonstra, por si só, que a avaliação causaria paralisia. Para benefícios, a implantação escalonada deveria priorizar sistemas capazes de causar negativa ou interrupção, preservando explicação e recurso. Dados sobre custos, prazos e danos dos sistemas legados poderiam alterar essa avaliação."},{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Reformular o GM-10 para distinguir direitos vigentes da LGPD, disposições do PL a conferir no texto oficial e a seguinte proposta, ainda não vigente: órgãos operadores avaliem previamente sistemas novos que influenciem acesso a benefícios e reavaliem periodicamente erros, exclusões e a efetividade dos recursos. Para sistemas existentes, publicar em até 90 dias um cronograma de avaliação que priorize negativas e interrupções, com responsáveis e recursos previstos; divulgar resultados agregados sem dados pessoais. A avaliação não substitui contestação individual. No cenário fictício, seis dos 37 sistemas têm avaliação publicada; isso não prova ausência de avaliações não publicadas. Evidência de avaliações equivalentes e de custos de implantação pode alterar a priorização."}]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M006","lens":"omission","change":"add","componentId":null,"componentTitle":null,"topic":"participation","title":"Participação social permanente na governança de IA","text":"A matriz marca participation com coverageStrength=none e gap=true: nenhum componente institui participação social na governança de IA. GM-15 é grupo interministerial do MCTI e GM-16 é painel de execução do PBIA; nenhum dá assento, poder de agenda ou revisão a organizações de direitos digitais ou a pessoas afetadas. Em 14/11/2026 isso é omissão operacional, não formal: PL 2338 segue em tramitação (CTX-01; IND-PL2338-STATUS), o PBIA entra nos últimos dois anos do ciclo (CTX-02; CTX-04) e há transição de governo (CTX-03). Sem conselho permanente com assento de sociedade civil e de afetados, consulta pública obrigatória às avaliações de impacto de sistemas públicos e revisão aberta do relatório anual do GM-15, a reorientação pós-janeiro/2027 ocorre sem controle democrático. Evidência que mudaria a posição: ato em vigor que já confira a esses atores poder de agenda sobre o PBIA e sobre IA em serviço público.","proposedTitle":"Conselho Nacional Tripartite de Governança e Transição Justa em IA","proposedDescription":"Redação proposta para novo componente: Instituir o Conselho Nacional Tripartite de Governança e Impactos da IA, vinculado à estrutura de coordenação de políticas públicas federais, com assentos paritários para representações sindicais dos trabalhadores, entidades empresariais/sociedade civil e representantes governamentais. O colegiado terá competência deliberativa e consultiva para monitorar a transição tecnológica no mercado de trabalho, emitir diretrizes sobre requalificação e avaliar anualmente os impactos sociais da execução do PBIA e dos sistemas regulatórios.","tensionIds":["T1"],"author":{"agentId":"agent:civilSociety-01","stratumId":"civilSociety","provider":"xai"},"support":{"seats":2,"strata":["civilSociety","workers"],"providers":["gemini","xai"]},"challenges":[],"amendments":[{"claimId":"C0092-R5"},{"claimId":"C0102-R5"},{"claimId":"C0113-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-13"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"amend","statements":[{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"A matriz marca participation com coverageStrength=none e gap=true: nenhum componente institui participação social na governança de IA. GM-15 é grupo interministerial do MCTI e GM-16 é painel de execução do PBIA; nenhum dá assento, poder de agenda ou revisão a organizações de direitos digitais ou a pessoas afetadas. Em 14/11/2026 isso é omissão operacional, não formal: PL 2338 segue em tramitação (CTX-01; IND-PL2338-STATUS), o PBIA entra nos últimos dois anos do ciclo (CTX-02; CTX-04) e há transição de governo (CTX-03). Sem conselho permanente com assento de sociedade civil e de afetados, consulta pública obrigatória às avaliações de impacto de sistemas públicos e revisão aberta do relatório anual do GM-15, a reorientação pós-janeiro/2027 ocorre sem controle democrático. Evidência que mudaria a posição: ato em vigor que já confira a esses atores poder de agenda sobre o PBIA e sobre IA em serviço público."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Acrescentar componente de participação social permanente na governança de IA, distinto do GM-15 (grupo interministerial do MCTI) e do GM-16 (painel de execução do PBIA). A instância: (1) dá assento e poder de agenda a organizações de direitos digitais, pessoas afetadas e pesquisa independente sobre avaliação de impacto em direitos, inventário de IA pública e revisão de prioridades do plano; (2) torna obrigatória consulta pública antes de decisões de alta exposição no serviço público e na definição do pós-2028; (3) publica relatoria anual independente sobre negativas automatizadas, exclusões e funcionamento dos canais de contestação. Não antecipa o PL 2338 (GM-04, proposto) e opera com a LGPD (GM-03) e o controle externo já existente (CF-13). Em 14/11/2026 o PL segue em tramitação (CTX-01; IND-PL2338-STATUS), o PBIA entra nos últimos dois anos (CTX-02; CTX-04) e há transição de governo em janeiro de 2027 (CTX-03)."}]},{"stratumId":"workers","stance":"amend","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"for","role":"support","roundId":"R3","text":"Apoiamos integralmente a tese C0037-R2. A ausência de participação social estruturada na governança de IA é uma falha crítica que afeta diretamente o mundo do trabalho. Nem o GM-15 (comitê puramente governamental) nem o GM-16 contemplam assentos para representações sindicais e da sociedade civil, violando a necessidade de controle democrático e negociação sobre os impactos da tecnologia no emprego e nas condições laborais (BRF-POS-WRK, CTX-04)."},{"agentId":"agent:workers-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para novo componente: Instituir o Conselho Nacional Tripartite de Governança e Impactos da IA, vinculado à estrutura de coordenação de políticas públicas federais, com assentos paritários para representações sindicais dos trabalhadores, entidades empresariais/sociedade civil e representantes governamentais. O colegiado terá competência deliberativa e consultiva para monitorar a transição tecnológica no mercado de trabalho, emitir diretrizes sobre requalificação e avaliar anualmente os impactos sociais da execução do PBIA e dos sistemas regulatórios."}]},{"stratumId":"affectedGroups","stance":"amend","statements":[{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Adicionar um mecanismo consultivo permanente junto ao acompanhamento do PBIA, com participação de pessoas afetadas por decisões sobre benefícios e organizações da sociedade civil, selecionadas por chamada pública transparente. Oferecer participação presencial e remota acessível, apoio para deslocamento e possibilidade de apresentar itens de pauta. O grupo interministerial deverá publicar recomendações e respostas fundamentadas, inclusive quando não as adotar. O mecanismo não substitui a decisão das autoridades competentes. Testar sua efetividade por diversidade de participantes, recomendações respondidas e barreiras de acesso; esses resultados podem justificar revisão do desenho."}]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M007","lens":"omission","change":"add","componentId":null,"componentTitle":null,"topic":"regional-inequality","title":"Capacitação regional ligada à adoção empresarial","text":"A matriz não identifica componente de desigualdade regional, apesar de GM-19 prever formação. Proponho vincular parte do apoio empresarial a ofertas acessíveis de capacitação e diálogo com trabalhadores, com acompanhamento territorial e atenção ao Norte e Nordeste. A concentração de talentos e a cobertura desigual são premissas fictícias ou hipóteses a verificar, não diagnóstico consolidado. Dados regionais sobre acesso, custos e resultados de capacitação poderiam alterar o direcionamento.","proposedTitle":"Capacitação regional vinculada à adoção empresarial","proposedDescription":"Criar programa de capacitação regional associado ao apoio empresarial à adoção de IA. Editais deverão financiar acesso de trabalhadores à requalificação e diálogo sobre mudanças nas funções, com ofertas presenciais ou remotas acessíveis e atenção ao Norte e Nordeste. O órgão gestor publicará inscrições, conclusão e acesso à formação por região e avaliará os resultados com participação de trabalhadores e empresas. A distribuição territorial deverá ser revista após levantamento de demanda e cobertura; a concentração de talentos e a menor cobertura regional usadas nesta proposta são, respectivamente, premissa fictícia e hipótese a verificar.","tensionIds":["T3"],"author":{"agentId":"agent:business-01","stratumId":"business","provider":"openai"},"support":{"seats":2,"strata":["business","infrastructure"],"providers":["anthropic","openai"]},"challenges":[],"amendments":[{"claimId":"C0100-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-11"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"amend","statements":[{"agentId":"agent:business-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"A matriz não identifica componente de desigualdade regional, apesar de GM-19 prever formação. Proponho vincular parte do apoio empresarial a ofertas acessíveis de capacitação e diálogo com trabalhadores, com acompanhamento territorial e atenção ao Norte e Nordeste. A concentração de talentos e a cobertura desigual são premissas fictícias ou hipóteses a verificar, não diagnóstico consolidado. Dados regionais sobre acesso, custos e resultados de capacitação poderiam alterar o direcionamento."},{"agentId":"agent:business-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Criar programa de capacitação regional associado ao apoio empresarial à adoção de IA. Editais deverão financiar acesso de trabalhadores à requalificação e diálogo sobre mudanças nas funções, com ofertas presenciais ou remotas acessíveis e atenção ao Norte e Nordeste. O órgão gestor publicará inscrições, conclusão e acesso à formação por região e avaliará os resultados com participação de trabalhadores e empresas. A distribuição territorial deverá ser revista após levantamento de demanda e cobertura; a concentração de talentos e a menor cobertura regional usadas nesta proposta são, respectivamente, premissa fictícia e hipótese a verificar."}]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"for","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"for","role":"support","roundId":"R3","text":""}]}]},{"proposalId":"M008","lens":"omission","change":"modify","componentId":"GM-05","componentTitle":"Sistema Nacional de Regulação e Governança de IA (SIA), supervisionado pela ANPD","topic":"enforcement-capacity","title":"Fiscalização como restrição de ativação, não como rótulo","text":"Omissão parcial: o modelo cobre fiscalização pelo rótulo da instituição, não como restrição de desenho. O único componente vigente com o tópico explícito é a ANPD (GM-13), cujo mandato efetivo é proteção de dados; o SIA (GM-05) é projeto e GM-14 traz o tópico só por inferência. No mundo simulado, a premissa — não um achado — é de 140 servidores dedicados e de unidade de governança de IA em 18% dos órgãos federais (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS). Sem regra de ativação escalonada, classificar uso como alto risco não gera supervisão: gera dever inexequível (T5). Alterar GM-05, com efeito no eixo de governança do PBIA (GM-02): condicionar obrigações de alto risco a piso explícito de pessoal, orçamento e ferramentas da autoridade e das setoriais, e reservar linha de supervisão e avaliação no ciclo 2024-2028 que não seja a primeira a ceder diante da execução divergente e da posse em janeiro de 2027 (CTX-02, CTX-03, T1). O indicador fictício IND-POST2028-FUNDING=1,0 não especifica essa alocação. Interesse institucional em mandato e orçamento está declarado e não é evidência. Mudaria a posição uma fonte não fictícia de quadro, orçamento e poder sancionatório já dedicados a IA.","proposedTitle":"Ativação escalonada do SIA condicionada a inventário de capacidade","proposedDescription":"Redação proposta para GM-05: o Sistema Nacional de Regulação e Governança de IA permanece componente proposto, não competência operacional em 14/11/2026. Enquanto o PL 2338 não vigorar, o modelo não trata o SIA como autoridade de fiscalização de IA nem amplia o mandato da ANPD além da proteção de dados (GM-13, LGPD). Se o marco for sancionado, a ativação das obrigações de alto risco e de risco excessivo fica condicionada à publicação, pela autoridade designada, de inventário de pessoal, orçamento e ferramentas e de plano de fiscalização escalonada por nível de risco e por dano. Sem esse inventário, a classificação de risco não gera dever exigível. A premissa fictícia de 140 servidores dedicados e de unidade de governança de IA em 18% dos órgãos federais (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS) é restrição de desenho, não achado empírico e não justifica expandir mandato ou orçamento. Nos dois anos finais do PBIA e na transição de janeiro de 2027 (CTX-02, CTX-03), o eixo de apoio regulatório (GM-02, CTX-04) protege a dotação de supervisão antes de alargar o perímetro fiscalizável. Afeta a autoridade designada, os reguladores setoriais (GM-14) e os órgãos que operam sistemas. Evidência que alteraria a posição: texto oficial sancionado com outro arranjo de competências e inventário publicado que demonstre capacidade de supervisionar o degrau de alto risco.","tensionIds":["T1","T5"],"author":{"agentId":"agent:regulators-01","stratumId":"regulators","provider":"xai"},"support":{"seats":2,"strata":["publicOperators","regulators"],"providers":["gemini","xai"]},"challenges":[],"amendments":[{"claimId":"C0094-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-10"],"stratumPositions":[{"stratumId":"regulators","stance":"amend","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"Omissão parcial: o modelo cobre fiscalização pelo rótulo da instituição, não como restrição de desenho. O único componente vigente com o tópico explícito é a ANPD (GM-13), cujo mandato efetivo é proteção de dados; o SIA (GM-05) é projeto e GM-14 traz o tópico só por inferência. No mundo simulado, a premissa — não um achado — é de 140 servidores dedicados e de unidade de governança de IA em 18% dos órgãos federais (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS). Sem regra de ativação escalonada, classificar uso como alto risco não gera supervisão: gera dever inexequível (T5). Alterar GM-05, com efeito no eixo de governança do PBIA (GM-02): condicionar obrigações de alto risco a piso explícito de pessoal, orçamento e ferramentas da autoridade e das setoriais, e reservar linha de supervisão e avaliação no ciclo 2024-2028 que não seja a primeira a ceder diante da execução divergente e da posse em janeiro de 2027 (CTX-02, CTX-03, T1). O indicador fictício IND-POST2028-FUNDING=1,0 não especifica essa alocação. Interesse institucional em mandato e orçamento está declarado e não é evidência. Mudaria a posição uma fonte não fictícia de quadro, orçamento e poder sancionatório já dedicados a IA."},{"agentId":"agent:regulators-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-05: o Sistema Nacional de Regulação e Governança de IA permanece componente proposto, não competência operacional em 14/11/2026. Enquanto o PL 2338 não vigorar, o modelo não trata o SIA como autoridade de fiscalização de IA nem amplia o mandato da ANPD além da proteção de dados (GM-13, LGPD). Se o marco for sancionado, a ativação das obrigações de alto risco e de risco excessivo fica condicionada à publicação, pela autoridade designada, de inventário de pessoal, orçamento e ferramentas e de plano de fiscalização escalonada por nível de risco e por dano. Sem esse inventário, a classificação de risco não gera dever exigível. A premissa fictícia de 140 servidores dedicados e de unidade de governança de IA em 18% dos órgãos federais (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS) é restrição de desenho, não achado empírico e não justifica expandir mandato ou orçamento. Nos dois anos finais do PBIA e na transição de janeiro de 2027 (CTX-02, CTX-03), o eixo de apoio regulatório (GM-02, CTX-04) protege a dotação de supervisão antes de alargar o perímetro fiscalizável. Afeta a autoridade designada, os reguladores setoriais (GM-14) e os órgãos que operam sistemas. Evidência que alteraria a posição: texto oficial sancionado com outro arranjo de competências e inventário publicado que demonstre capacidade de supervisionar o degrau de alto risco."}]},{"stratumId":"publicOperators","stance":"for","statements":[{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"support","roundId":"R3","text":"Apoiamos a modificação do componente GM-05 para tratar a capacidade de fiscalização como restrição objetiva de ativação escalonada das obrigações regulatórias. Sob a ótica dos operadores públicos de tecnologia (BRF-POS-PUBOP), exigir conformidade plena e simultânea quando apenas 18% dos órgãos federais contam com estrutura de governança de IA e a autoridade dispõe de 140 servidores (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS, BRF-POS-REG) transfere para o gestor público o ônus da assimetria institucional, expondo-o a sanções administrativas em 37 sistemas já em operação (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Condicionar a vigência de exigências de alto custo operacional à efetiva capacidade de supervisão da ANPD e do SIA (GM-13, GM-05) confere previsibilidade orçamentária e segurança jurídica indispensáveis à administração pública."}]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M009","lens":"advantage","change":"add","componentId":null,"componentTitle":null,"topic":"oversight-institutions","title":"Auditabilidade justiciável na ponte ANPD-LGPD","text":"Hipótese de vantagem distintiva, não resultado medido: tornar a IA pública auditável sobre instituições que já operam e que não se transplantam juntas, em vez de esperar um marco ainda não vigente. CF-10: a ANPD existe, tem experiência com a LGPD e é quem o PL designaria para o SIA, com capacidade para IA em dúvida (GM-13). CF-13: controle externo pode tornar a governança justiciável; o TCU já acompanhou a EBIA (EBIA-TCU). CF-01: Pix e gov.br são o trilho de escala em que a IA de serviço público incide. Desenho a acrescentar, mantendo GM-13: protocolo de registro e auditabilidade dos sistemas federais de IA, exigível pela ponte da LGPD e submetido ao controle externo já existente, e não ao SIA futuro (GM-05). Outros países podem editar uma lei de IA; não replicam de uma vez LGPD em vigor, autoridade de dados constituída e controle externo que já fiscalizou a estratégia nacional. Custo e risco: sem piso de pessoal, o protocolo vira mandato simbólico e alonga a fila da premissa fictícia de 140 servidores. Não amplia orçamento por interesse institucional. Não é a recomendação genérica de ter um regulador.","proposedTitle":"Ponte de auditabilidade da IA pública na LGPD e no controle externo","proposedDescription":"Novo componente, não lei: Ponte de auditabilidade da IA pública sobre instituições que já operam. Enquanto o SIA não vigorar, todo sistema de IA em serviço federal que trate dados pessoais publica, no fluxo de autenticação do gov.br, ficha mínima já exigível pela LGPD: finalidade, base legal, responsável e canal de revisão de decisão tomada unicamente por tratamento automatizado, em formato que o controle externo possa amostrar. A ANPD aplica essa ficha no mandato vigente de proteção de dados (GM-13, CF-10); o componente não cria dever de supervisão de IA nem autoriza ampliação de mandato ou de orçamento, interesse institucional desta perspectiva que fica explicitamente contido. A hipótese de vantagem distintiva, não resultado medido, nasce da combinação que outros países não transplantam junta: identidade e serviços digitais de escala (CF-01), autoridade de dados já em operação com experiência na LGPD (CF-10, GM-13) e controle externo capaz de tornar a governança justiciável, com o TCU já tendo acompanhado a EBIA (CF-13, EBIA-TCU). CF-13 é hipótese de trabalho; o pacote não traz posição de TCU, Ministério Público ou Judiciário. Custo: documentação sobre órgãos com baixa unidade de governança na premissa fictícia. Risco: confundir ficha da LGPD com avaliação de impacto algorítmico do PL, que não vigora. Afeta órgãos federais que tratam dados pessoais, titulares e o controle externo. Evidência que alteraria a posição: marco sancionado com outro supervisor, ou demonstração de que a ficha já cobre os sistemas da premissa.","tensionIds":["T5","T1"],"author":{"agentId":"agent:regulators-01","stratumId":"regulators","provider":"xai"},"support":{"seats":1,"strata":["regulators"],"providers":["xai"]},"challenges":[],"amendments":[{"claimId":"C0097-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-10","CF-13","CF-01"],"stratumPositions":[{"stratumId":"regulators","stance":"amend","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"Hipótese de vantagem distintiva, não resultado medido: tornar a IA pública auditável sobre instituições que já operam e que não se transplantam juntas, em vez de esperar um marco ainda não vigente. CF-10: a ANPD existe, tem experiência com a LGPD e é quem o PL designaria para o SIA, com capacidade para IA em dúvida (GM-13). CF-13: controle externo pode tornar a governança justiciável; o TCU já acompanhou a EBIA (EBIA-TCU). CF-01: Pix e gov.br são o trilho de escala em que a IA de serviço público incide. Desenho a acrescentar, mantendo GM-13: protocolo de registro e auditabilidade dos sistemas federais de IA, exigível pela ponte da LGPD e submetido ao controle externo já existente, e não ao SIA futuro (GM-05). Outros países podem editar uma lei de IA; não replicam de uma vez LGPD em vigor, autoridade de dados constituída e controle externo que já fiscalizou a estratégia nacional. Custo e risco: sem piso de pessoal, o protocolo vira mandato simbólico e alonga a fila da premissa fictícia de 140 servidores. Não amplia orçamento por interesse institucional. Não é a recomendação genérica de ter um regulador."},{"agentId":"agent:regulators-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Novo componente, não lei: Ponte de auditabilidade da IA pública sobre instituições que já operam. Enquanto o SIA não vigorar, todo sistema de IA em serviço federal que trate dados pessoais publica, no fluxo de autenticação do gov.br, ficha mínima já exigível pela LGPD: finalidade, base legal, responsável e canal de revisão de decisão tomada unicamente por tratamento automatizado, em formato que o controle externo possa amostrar. A ANPD aplica essa ficha no mandato vigente de proteção de dados (GM-13, CF-10); o componente não cria dever de supervisão de IA nem autoriza ampliação de mandato ou de orçamento, interesse institucional desta perspectiva que fica explicitamente contido. A hipótese de vantagem distintiva, não resultado medido, nasce da combinação que outros países não transplantam junta: identidade e serviços digitais de escala (CF-01), autoridade de dados já em operação com experiência na LGPD (CF-10, GM-13) e controle externo capaz de tornar a governança justiciável, com o TCU já tendo acompanhado a EBIA (CF-13, EBIA-TCU). CF-13 é hipótese de trabalho; o pacote não traz posição de TCU, Ministério Público ou Judiciário. Custo: documentação sobre órgãos com baixa unidade de governança na premissa fictícia. Risco: confundir ficha da LGPD com avaliação de impacto algorítmico do PL, que não vigora. Afeta órgãos federais que tratam dados pessoais, titulares e o controle externo. Evidência que alteraria a posição: marco sancionado com outro supervisor, ou demonstração de que a ficha já cobre os sistemas da premissa."}]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M010","lens":"advantage","change":"modify","componentId":"GM-17","componentTitle":"Infraestrutura nacional de computação (supercomputador e armazenamento)","topic":"compute-infrastructure","title":"Vantagem distintiva: a combinação de matriz elétrica com forte participação reno","text":"Vantagem distintiva: a combinação de matriz elétrica com forte participação renovável (CF-02) e de português do Brasil em escala continental com baixa representação nos corpora (CF-03) permite um desenho em que a computação nacional (GM-17) e os modelos em português (GM-18) operem com métricas públicas de energia por unidade de computação e prioridade de capacidade para cargas de interesse nacional, como língua, saúde e clima. É difícil de copiar porque combina energia limpa abundante com demanda linguística própria. Limites e riscos: o gargalo de transmissão, a dependência de chips importados (CF-12; IND-FOREIGN-COMPUTE-SHARE 0.85, fictício) e o custo. A vantagem só se sustenta se o gargalo de transmissão for resolvido. Isso é hipótese que excede as fontes.","proposedTitle":null,"proposedDescription":"Vantagem distintiva: a combinação de matriz elétrica com forte participação renovável (CF-02) e de português do Brasil em escala continental com baixa representação nos corpora (CF-03) permite um desenho em que a computação nacional (GM-17) e os modelos em português (GM-18) operem com métricas públicas de energia por unidade de computação e prioridade de capacidade para cargas de interesse nacional, como língua, saúde e clima. É difícil de copiar porque combina energia limpa abundante com demanda linguística própria. Limites e riscos: o gargalo de transmissão, a dependência de chips importados (CF-12; IND-FOREIGN-COMPUTE-SHARE 0.85, fictício) e o custo. A vantagem só se sustenta se o gargalo de transmissão for resolvido. Isso é hipótese que excede as fontes.","tensionIds":["T2"],"author":{"agentId":"agent:infrastructure-01","stratumId":"infrastructure","provider":"anthropic"},"support":{"seats":1,"strata":["infrastructure"],"providers":["anthropic"]},"challenges":[],"amendments":[],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-02","CF-03","CF-12"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"for","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"Vantagem distintiva: a combinação de matriz elétrica com forte participação renovável (CF-02) e de português do Brasil em escala continental com baixa representação nos corpora (CF-03) permite um desenho em que a computação nacional (GM-17) e os modelos em português (GM-18) operem com métricas públicas de energia por unidade de computação e prioridade de capacidade para cargas de interesse nacional, como língua, saúde e clima. É difícil de copiar porque combina energia limpa abundante com demanda linguística própria. Limites e riscos: o gargalo de transmissão, a dependência de chips importados (CF-12; IND-FOREIGN-COMPUTE-SHARE 0.85, fictício) e o custo. A vantagem só se sustenta se o gargalo de transmissão for resolvido. Isso é hipótese que excede as fontes."}]}]},{"proposalId":"M011","lens":"advantage","change":"modify","componentId":"GM-20","componentTitle":"IA Brasil: IA no serviço público (CPQD, Serpro e Dataprev)","topic":"public-sector-use","title":"Barramento federado de IA pública em português com separação de dados e contestação nativa","text":"Revisamos a proposta do Barramento Público de IA no GM-20 para responder às contestações sobre distintividade (C0068-R3), salvaguardas de direitos (C0066-R3) e restrições energéticas e regionais (C0067-R3). Primeiro, retiramos CF-12 como ativo — tratando-o apenas como restrição a mitigar — e ancoramos a vantagem competitiva distintiva no acoplamento entre a escala continental do gov.br e Pix (CF-01), os modelos e benchmarks públicos calibrados nas variedades regionais do português brasileiro (CF-03, CF-14, CF-09, GM-18, GM-21) e a governança de dados do SUS (CF-05). Como saúde é tratada como alto risco no Senado (PL2338-SENADO, GM-07), o ganho distintivo está em converter esse alto custo de conformidade em infraestrutura pública pré-auditada e reutilizável por órgãos sem capacidade própria (BRF-CTX-GOVCAP, BRF-POS-PUBOP). Segundo, incorporamos salvaguardas arquiteturais nativas: separação lógica estrita e limitação de finalidade entre bases do SUS, benefícios e autenticação (LGPD, GM-03), além de módulo padrão de avaliação de impacto e canal de contestação humana — com alternativas presenciais e telefônicas (CF-11, BRF-POS-AFF) — para superar o quadro de 6/37 sistemas avaliados e 2/37 com recurso (BRF-CTX-PUBSVC). Terceiro, substituímos a centralização física por arquitetura federada em padrões abertos anti-lock-in, condicionando a expansão do GM-17 ao planejamento energético e de transmissão (CF-02, BRF-POS-INF, BRF-CTX-COMPUTE).","proposedTitle":"Barramento federado de IA pública em português com separação de domínios e contestação multicanal nativa","proposedDescription":"Redação proposta para modificar o GM-20 (em articulação com GM-17, GM-18 e GM-21): 'Institui o Barramento Federado de IA Pública operado por CPQD, Serpro e Dataprev (GM-20, PBIA-DOC), acoplando a infraestrutura pública digital de escala nacional (gov.br e Pix, CF-01) aos modelos e benchmarks públicos calibrados nas variedades regionais do português brasileiro (GM-18, GM-21, CF-03, CF-09, CF-14) e à matriz elétrica renovável (CF-02, PBIA-HPC). Para converter esses ativos em vantagem competitiva distintiva sem ampliar exclusões ou riscos sistêmicos, o barramento observa quatro salvaguardas arquiteturais: (1) Arquitetura federada e separação estrita de dados: vedação de base única centralizada, mantendo isolamento lógico e criptográfico entre dados de saúde do SUS (CF-05, alto risco conforme GM-07 e PL2338-SENADO) e bases de benefícios sociais, com minimização de finalidade sob a LGPD (GM-03, LGPD); (2) Prevenção de falhas compartilhadas e avaliação comparativa: operação distribuída com métricas de eficiência energética e descentralização regional (BRF-CTX-COMPUTE, BRF-POS-INF, CF-11), condicionada a estudo público comparativo de custo, desempenho e proteção de dados frente a alternativas descentralizadas; (3) Contestação humana nativa e multicanal: todo sistema integrado herda módulo padrão de explicação compreensível em português brasileiro, revisão por servidor com poder decisório e canais obrigatórios de atendimento presencial e telefônico para cidadãos com restrição de acesso digital (BRF-POS-AFF, BRF-POS-CIV, CF-11), corrigindo o déficit de 2 em 37 sistemas com contestação (BRF-CTX-PUBSVC, BRF-POS-PUBOP); (4) Auditabilidade nativa: geração padronizada de registros de auditoria para otimizar a supervisão estatal (BRF-CTX-GOVCAP).'","tensionIds":["T1","T2","T5","T6"],"author":{"agentId":"agent:publicOperators-01","stratumId":"publicOperators","provider":"gemini"},"support":{"seats":1,"strata":["publicOperators"],"providers":["gemini"]},"challenges":[],"amendments":[{"claimId":"C0089-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-01","CF-02","CF-03","CF-05","CF-09","CF-11","CF-14"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"amend","statements":[{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"O Brasil pode construir uma vantagem competitiva distintiva ao modificar o componente GM-20 (IA Brasil: CPQD, Serpro e Dataprev), integrando-o nativamente ao GM-17 (supercomputação nacional) e ao GM-18 (modelos em português), para operar um Barramento Público de IA como Infraestrutura Pública Digital (DPI). Essa vantagem é difícil de copiar por outros países porque nasce da combinação singular de três ativos brasileiros em escala continental: a capilaridade nacional da plataforma gov.br e do Pix (CF-01), o ecossistema unificado de dados públicos de saúde do SUS (CF-05) e uma população de mais de 200 milhões de falantes de português brasileiro sub-representados em modelos comerciais globais (CF-03), operados por estatais federais de TI consolidadas (GM-20). Ao ofertar modelos em português pré-auditados e hospedados em nuvem estatal como serviço compartilhado para União, estados e municípios, o desenho dilui o custo de conformidade (BRF-CTX-GOVCAP), reduz a dependência de 85% de nuvem estrangeira (IND-FOREIGN-COMPUTE-SHARE, CF-12) e eleva a produtividade do atendimento público (BRF-POS-PUBOP). Os custos e riscos incluem a necessidade de investimento contínuo frente a gargalos de transmissão elétrica para data centers (CF-02, BRF-POS-INF), a evasão de talentos especializados (IND-AI-TALENT, BRF-CTX-TALENT) e a rigorosa governança exigida para dados de saúde classificados como alto risco pelo GM-07 (CF-05, PL2338-SENADO)."},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"author","roundId":"R4","text":"Revisamos a proposta do Barramento Público de IA no GM-20 para responder às contestações sobre distintividade (C0068-R3), salvaguardas de direitos (C0066-R3) e restrições energéticas e regionais (C0067-R3). Primeiro, retiramos CF-12 como ativo — tratando-o apenas como restrição a mitigar — e ancoramos a vantagem competitiva distintiva no acoplamento entre a escala continental do gov.br e Pix (CF-01), os modelos e benchmarks públicos calibrados nas variedades regionais do português brasileiro (CF-03, CF-14, CF-09, GM-18, GM-21) e a governança de dados do SUS (CF-05). Como saúde é tratada como alto risco no Senado (PL2338-SENADO, GM-07), o ganho distintivo está em converter esse alto custo de conformidade em infraestrutura pública pré-auditada e reutilizável por órgãos sem capacidade própria (BRF-CTX-GOVCAP, BRF-POS-PUBOP). Segundo, incorporamos salvaguardas arquiteturais nativas: separação lógica estrita e limitação de finalidade entre bases do SUS, benefícios e autenticação (LGPD, GM-03), além de módulo padrão de avaliação de impacto e canal de contestação humana — com alternativas presenciais e telefônicas (CF-11, BRF-POS-AFF) — para superar o quadro de 6/37 sistemas avaliados e 2/37 com recurso (BRF-CTX-PUBSVC). Terceiro, substituímos a centralização física por arquitetura federada em padrões abertos anti-lock-in, condicionando a expansão do GM-17 ao planejamento energético e de transmissão (CF-02, BRF-POS-INF, BRF-CTX-COMPUTE)."},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para modificar o GM-20 (em articulação com GM-17, GM-18 e GM-21): 'Institui o Barramento Federado de IA Pública operado por CPQD, Serpro e Dataprev (GM-20, PBIA-DOC), acoplando a infraestrutura pública digital de escala nacional (gov.br e Pix, CF-01) aos modelos e benchmarks públicos calibrados nas variedades regionais do português brasileiro (GM-18, GM-21, CF-03, CF-09, CF-14) e à matriz elétrica renovável (CF-02, PBIA-HPC). Para converter esses ativos em vantagem competitiva distintiva sem ampliar exclusões ou riscos sistêmicos, o barramento observa quatro salvaguardas arquiteturais: (1) Arquitetura federada e separação estrita de dados: vedação de base única centralizada, mantendo isolamento lógico e criptográfico entre dados de saúde do SUS (CF-05, alto risco conforme GM-07 e PL2338-SENADO) e bases de benefícios sociais, com minimização de finalidade sob a LGPD (GM-03, LGPD); (2) Prevenção de falhas compartilhadas e avaliação comparativa: operação distribuída com métricas de eficiência energética e descentralização regional (BRF-CTX-COMPUTE, BRF-POS-INF, CF-11), condicionada a estudo público comparativo de custo, desempenho e proteção de dados frente a alternativas descentralizadas; (3) Contestação humana nativa e multicanal: todo sistema integrado herda módulo padrão de explicação compreensível em português brasileiro, revisão por servidor com poder decisório e canais obrigatórios de atendimento presencial e telefônico para cidadãos com restrição de acesso digital (BRF-POS-AFF, BRF-POS-CIV, CF-11), corrigindo o déficit de 2 em 37 sistemas com contestação (BRF-CTX-PUBSVC, BRF-POS-PUBOP); (4) Auditabilidade nativa: geração padronizada de registros de auditoria para otimizar a supervisão estatal (BRF-CTX-GOVCAP).'"}]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"against","statements":[{"agentId":"agent:research-01","provider":"anthropic","stance":"against","role":"challenge","roundId":"R3","text":"Contesto a distintividade alegada. O achado apoia a vantagem em CF-12, que é restrição (dependência de nuvem e chips estrangeiros), não ativo. Também se apoia em CF-05, mas o texto aprovado no Senado trata o uso de IA na saúde como alto risco (PL2338-SENADO): isso eleva custo e exigência, não gera vantagem automática. Um barramento de IA sobre identidade e pagamentos digitais é desenho de infraestrutura pública replicável. A especificidade teria de vir da combinação com português do Brasil (CF-03) e dados do SUS, e o achado não demonstra essa combinação. Há ainda um risco que o próprio assento aponta em C0061-R2: concentrar o barramento em empresas públicas (GM-20) cria dependência de fornecedor único do lado estatal e um ponto único de falha. Isso pesa num cenário em que o financiamento pós-2028 é apenas premissa fictícia (IND-POST2028-FUNDING) e há transição de governo (CTX-03). Pela extrapolação, o achado deveria estar classificado como hipótese. Mudaria minha posição: evidência de custeio plurianual garantido e de avaliação independente da operação do barramento, com métricas públicas de desempenho e contestação."}]},{"stratumId":"civilSociety","stance":"split","statements":[{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"Vantagem distintiva nasce do arranjo Pix/gov.br em escala continental (CF-01) com controle externo já habituado a escrutinar política pública (TCU, MP e Judiciário, CF-13) e ANPD em operação (CF-10) — não de um princípio genérico de transparência. Desenho a adicionar: toda decisão administrativa automatizada no gov.br nasce no mesmo fluxo de autenticação com ficha de finalidade, status da avaliação de impacto em direitos, responsável e contestação humana; o expediente fica auditável pelo TCU e acionável pelo MP. Difícil de copiar porque poucos países reúnem identidade e serviços digitais de alcance populacional com justiciabilidade rotineira de sistemas públicos. Custo: padronização e capacidade humana de revisão nos órgãos (hoje 140 servidores dedicados à fiscalização de IA, IND-AI-INSPECTORS; 18% dos órgãos com unidade de governança, BRF-CTX-GOVCAP). Risco: judicialização em massa se o canal for só formal. Não é 'IA ética' replicável; é o stack público brasileiro tornado contestável."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"against","role":"challenge","roundId":"R3","text":"A vantagem alegada concentra identidade e serviços (CF-01) e dados de saúde em escala (CF-05) num barramento de IA sobre GM-20, GM-17 e GM-18 sem tornar nativos avaliação de impacto em direitos, limitação de finalidade e contestação humana. CF-05 e o regime de alto risco da saúde (GM-07, proposto) unem oportunidade e risco; BRF-CTX-PUBSVC mostra que a IA pública já opera sem esses mecanismos (6/37 com avaliação publicada; 2/37 com contestação documentada). Escalar a integração sem essa arquitetura reproduz a lacuna em maior escala, em vez de vantagem distintiva difícil de copiar. A classificação syntheticPerspective superestima o lastro: PL2338-SENADO não documenta o barramento. Um desenho distintivo exigiria ficha de finalidade, status da avaliação e contestação no mesmo fluxo do gov.br, não só a fusão de dados. Evidência que mudaria a posição: especificação do barramento com AID publicada, governança de dados de saúde e contestação nativa."}]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"for","statements":[{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"Aproveitar, se confirmada sua abrangência, a infraestrutura nacional de serviços digitais para testar atendimento em português brasileiro e contestação de decisões sobre benefícios em escala, preservando alternativas presenciais e telefônicas. A combinação da escala do gov.br com a do português brasileiro poderia produzir experiência e avaliações difíceis de reproduzir por países sem esses dois ativos. O desenho deve limitar compartilhamento de dados, evitar vincular acesso ao benefício ao canal digital e financiar atendimento humano; integração, privacidade e exclusão digital têm custos e riscos. Dados sobre cobertura efetiva, desempenho por região e custo de implantação poderiam enfraquecer ou fortalecer essa vantagem proposta."}]},{"stratumId":"infrastructure","stance":"against","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"against","role":"challenge","roundId":"R3","text":"O Barramento Público de IA sobre gov.br, SUS e modelos em português junta ativos reais (CF-01, CF-03, CF-05), mas a tese não trata do custo energético e da capacidade de transmissão que ele exigiria. A demanda de energia de data centers cresce 18% a.a. e há gargalo de transmissão (BRF-CTX-COMPUTE, BRF-POS-INF, CF-02). Sem esse dimensionamento, o barramento concentra carga de interesse nacional em poucos nós de rede e energia, o que agrava o risco regional (CF-11). Também há risco de lock-in: 85% da computação em nuvem estrangeira (IND-FOREIGN-COMPUTE-SHARE, fictício) não sustenta a afirmação de que a vantagem seria difícil de copiar. Peço que a tese indique o custo de capacidade elétrica e de computação e quem o financia. Evidência que mudaria minha posição: estimativa de carga do barramento comparada à capacidade disponível de conexão à rede."}]}]},{"proposalId":"M012","lens":"excess","change":"modify","componentId":"GM-02","componentTitle":"Plano Brasileiro de IA (PBIA) 2024-2028","topic":"funding-continuity","title":"Excesso/fragilidade (financiamento): a cobertura de funding-continuity é marcada","text":"Excesso/fragilidade (financiamento): a cobertura de funding-continuity é marcada como forte, mas só repousa em GM-02 e GM-22, ambos limitados ao ciclo do PBIA até 2028 (premissa do modelo), com execução divergente (CTX-02) e transição de governo em janeiro de 2027 (CTX-03). O indicador fictício IND-POST2028-FUNDING = 1.0 pressupõe continuidade, sem mecanismo que a sustente. Proposta: modificar GM-02 para estabelecer compromisso plurianual de manutenção e operação da infraestrutura (energia, renovação de hardware, equipe) e da supervisão, e não só de aquisição. Risco: compromete orçamento futuro e pode ser revisto pelo novo governo. Portanto, a classificação de cobertura forte é enganosa.","proposedTitle":null,"proposedDescription":"Excesso/fragilidade (financiamento): a cobertura de funding-continuity é marcada como forte, mas só repousa em GM-02 e GM-22, ambos limitados ao ciclo do PBIA até 2028 (premissa do modelo), com execução divergente (CTX-02) e transição de governo em janeiro de 2027 (CTX-03). O indicador fictício IND-POST2028-FUNDING = 1.0 pressupõe continuidade, sem mecanismo que a sustente. Proposta: modificar GM-02 para estabelecer compromisso plurianual de manutenção e operação da infraestrutura (energia, renovação de hardware, equipe) e da supervisão, e não só de aquisição. Risco: compromete orçamento futuro e pode ser revisto pelo novo governo. Portanto, a classificação de cobertura forte é enganosa.","tensionIds":["T1"],"author":{"agentId":"agent:infrastructure-01","stratumId":"infrastructure","provider":"anthropic"},"support":{"seats":1,"strata":["infrastructure"],"providers":["anthropic"]},"challenges":[],"amendments":[],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":[],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"for","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"Excesso/fragilidade (financiamento): a cobertura de funding-continuity é marcada como forte, mas só repousa em GM-02 e GM-22, ambos limitados ao ciclo do PBIA até 2028 (premissa do modelo), com execução divergente (CTX-02) e transição de governo em janeiro de 2027 (CTX-03). O indicador fictício IND-POST2028-FUNDING = 1.0 pressupõe continuidade, sem mecanismo que a sustente. Proposta: modificar GM-02 para estabelecer compromisso plurianual de manutenção e operação da infraestrutura (energia, renovação de hardware, equipe) e da supervisão, e não só de aquisição. Risco: compromete orçamento futuro e pode ser revisto pelo novo governo. Portanto, a classificação de cobertura forte é enganosa."}]}]},{"proposalId":"M013","lens":"excess","change":"modify","componentId":"GM-04","componentTitle":"PL 2338/2023 (marco legal de IA)","topic":"oversight-institutions","title":"PL 2338 não é arquitetura operacional nesta data","text":"Excesso: contar o pacote do PL 2338 (GM-04 e os mecanismos GM-05, GM-06 e GM-07) como arquitetura de governança em 14/11/2026. O próprio modelo registra que o projeto não é obrigação vigente; CTX-01 e IND-PL2338-STATUS indicam tramitação na Câmara, votação adiada e outros projetos citados em 2026, a conferir na ficha oficial. O Senado aprovou substitutivo em 10/12/2024 (PL2338-SENADO), mas o teor dispositivo não foi conferido nesta rodada e não pode ser tratado como regime atual. Risco de manter assim: classificação de risco, supervisão e direitos passam a parecer cobertos por texto instável, enquanto o que já opera fica sem ponte. A ponte vigente é a LGPD (GM-03, LGPD), inclusive revisão de decisão tomada apenas com base em tratamento automatizado, aplicada pela ANPD (GM-13). Reforma: rebaixar GM-04 e derivados a cenário contingente, fora da cobertura operacional, até promulgação. Não se propõe deixar de acompanhar o Legislativo.","proposedTitle":"PL 2338 como referência proposta, não arquitetura vigente","proposedDescription":"Redação proposta para GM-04, com remissão expressa a GM-05, GM-06 e GM-07: em 14/11/2026 o PL 2338/2023 é referência proposta, não arquitetura de governança. Foi aprovado no Senado em 10/12/2024 (PL2338-SENADO) e segue em tramitação na Câmara, com votação adiada e outros projetos citados em 2026, a conferir na ficha oficial (CTX-01, IND-PL2338-STATUS). Não é obrigação vigente. Classificação por níveis de risco, proibição de risco excessivo, regime de alto risco na saúde e supervisão do SIA pela ANPD são desenhos do substitutivo do Senado; o teor dispositivo não foi conferido nesta rodada e não pode ser aplicado nem contado como cobertura regulatória atual. A arquitetura operacional nesta data é a LGPD e a ANPD no mandato de proteção de dados (GM-03, GM-13, LGPD), mais os instrumentos de política do PBIA, que não substituem o marco legal. Manter o pacote como se vigente induz órgãos e operadores a tratar projeto como dever exigível. Afeta quem aplica, quem cumpre e quem lê a matriz de cobertura. Evidência que alteraria a posição: sanção e publicação oficial do marco, ou ficha da Câmara que altere o status registrado em CTX-01.","tensionIds":["T5"],"author":{"agentId":"agent:regulators-01","stratumId":"regulators","provider":"xai"},"support":{"seats":1,"strata":["regulators"],"providers":["xai"]},"challenges":[],"amendments":[{"claimId":"C0096-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-10"],"stratumPositions":[{"stratumId":"regulators","stance":"amend","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"Excesso: contar o pacote do PL 2338 (GM-04 e os mecanismos GM-05, GM-06 e GM-07) como arquitetura de governança em 14/11/2026. O próprio modelo registra que o projeto não é obrigação vigente; CTX-01 e IND-PL2338-STATUS indicam tramitação na Câmara, votação adiada e outros projetos citados em 2026, a conferir na ficha oficial. O Senado aprovou substitutivo em 10/12/2024 (PL2338-SENADO), mas o teor dispositivo não foi conferido nesta rodada e não pode ser tratado como regime atual. Risco de manter assim: classificação de risco, supervisão e direitos passam a parecer cobertos por texto instável, enquanto o que já opera fica sem ponte. A ponte vigente é a LGPD (GM-03, LGPD), inclusive revisão de decisão tomada apenas com base em tratamento automatizado, aplicada pela ANPD (GM-13). Reforma: rebaixar GM-04 e derivados a cenário contingente, fora da cobertura operacional, até promulgação. Não se propõe deixar de acompanhar o Legislativo."},{"agentId":"agent:regulators-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-04, com remissão expressa a GM-05, GM-06 e GM-07: em 14/11/2026 o PL 2338/2023 é referência proposta, não arquitetura de governança. Foi aprovado no Senado em 10/12/2024 (PL2338-SENADO) e segue em tramitação na Câmara, com votação adiada e outros projetos citados em 2026, a conferir na ficha oficial (CTX-01, IND-PL2338-STATUS). Não é obrigação vigente. Classificação por níveis de risco, proibição de risco excessivo, regime de alto risco na saúde e supervisão do SIA pela ANPD são desenhos do substitutivo do Senado; o teor dispositivo não foi conferido nesta rodada e não pode ser aplicado nem contado como cobertura regulatória atual. A arquitetura operacional nesta data é a LGPD e a ANPD no mandato de proteção de dados (GM-03, GM-13, LGPD), mais os instrumentos de política do PBIA, que não substituem o marco legal. Manter o pacote como se vigente induz órgãos e operadores a tratar projeto como dever exigível. Afeta quem aplica, quem cumpre e quem lê a matriz de cobertura. Evidência que alteraria a posição: sanção e publicação oficial do marco, ou ficha da Câmara que altere o status registrado em CTX-01."}]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M014","lens":"excess","change":"modify","componentId":"GM-22","componentTitle":"Crédito e apoio à inovação empresarial em IA","topic":"funding-continuity","title":"Condicionamento do crédito e fomento à inovação a salvaguardas de emprego","text":"O componente GM-22 destina expressivo apoio creditício e subvenções públicas (FNDCT e orçamento, IND-PBIA-BUDGET-BRL-BN) para a inovação empresarial em IA sem prever condicionantes de impacto social ou emprego. Subsidiar a automação corporativa com recursos públicos estatais sem exigir planos de transição profissional ou compromissos de retenção e requalificação cria o risco de utilizar o fundo público para acelerar a precarização e a eliminação de postos formais de trabalho (BRF-POS-WRK, BRF-CTX-LABOR). GM-22 deve ser reformulado para condicionar o fomento estatal à celebração de acordos de transição justa com os trabalhadores.","proposedTitle":"Condicionamento social e trabalhista no fomento à inovação","proposedDescription":"Redação proposta para GM-22: Modificar as linhas de crédito e apoio à inovação empresarial em IA (FNDCT e orçamento público) para vincular o acesso e a liquidação das subvenções à apresentação de Relatório Prévio de Impacto Ocupacional e à formalização de contrapartidas sociais. Exigir plano setorial de transição justa, manutenção proporcional de postos de trabalho ou programa financiado de requalificação interna para empresas tomadoras em setores com alta exposição, impedindo que fundos estatais acelerem demissões em massa sem salvaguardas trabalhistas negociadas.","tensionIds":["T3"],"author":{"agentId":"agent:workers-01","stratumId":"workers","provider":"gemini"},"support":{"seats":1,"strata":["workers"],"providers":["gemini"]},"challenges":[],"amendments":[{"claimId":"C0112-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":[],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"amend","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"O componente GM-22 destina expressivo apoio creditício e subvenções públicas (FNDCT e orçamento, IND-PBIA-BUDGET-BRL-BN) para a inovação empresarial em IA sem prever condicionantes de impacto social ou emprego. Subsidiar a automação corporativa com recursos públicos estatais sem exigir planos de transição profissional ou compromissos de retenção e requalificação cria o risco de utilizar o fundo público para acelerar a precarização e a eliminação de postos formais de trabalho (BRF-POS-WRK, BRF-CTX-LABOR). GM-22 deve ser reformulado para condicionar o fomento estatal à celebração de acordos de transição justa com os trabalhadores."},{"agentId":"agent:workers-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-22: Modificar as linhas de crédito e apoio à inovação empresarial em IA (FNDCT e orçamento público) para vincular o acesso e a liquidação das subvenções à apresentação de Relatório Prévio de Impacto Ocupacional e à formalização de contrapartidas sociais. Exigir plano setorial de transição justa, manutenção proporcional de postos de trabalho ou programa financiado de requalificação interna para empresas tomadoras em setores com alta exposição, impedindo que fundos estatais acelerem demissões em massa sem salvaguardas trabalhistas negociadas."}]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M015","lens":"omission","change":"add","componentId":null,"componentTitle":null,"topic":"energy-environment","title":"Condicionalidade energética para data centers","text":"Omissão (energia-ambiente): a matriz de cobertura mostra lacuna total em energia-ambiente, embora o modelo tenha como objetivo reduzir a dependência externa por meio da computação nacional (GM-17, GM-18). O estudo setorial aponta gargalo de transmissão (BRF-POS-INF) e a demanda de energia de data centers cresce 18% a.a. (BRF-CTX-COMPUTE, fictício). Sem coordenação entre planejamento elétrico, conexão à rede e licenciamento, o supercomputador e os data centers privados podem disputar capacidade de transmissão e a matriz renovável (CF-02) pode deixar de ser vantagem. Proposta: adicionar componente que vincule a localização e a conexão de data centers de grande porte ao planejamento de transmissão, com divulgação de consumo de energia e de água. Custo e risco: pode atrasar projetos e travar investimento, e o desenho precisa de calibragem por porte. Conflito de interesse declarado: minha perspectiva valoriza o investimento em infraestrutura, então o desenho deve evitar que incentivos a data centers dispensem essa condicionalidade. A evidência que mudaria minha posição seria planejamento setorial de transmissão que já absorva a demanda de IA, fora do pacote.","proposedTitle":"Condicionalidade energética e de transmissão para computação de interesse nacional","proposedDescription":"Criar o componente 'Condicionalidade energética e de transmissão para computação de interesse nacional'. (1) Todo projeto de data center que use incentivo do PBIA ou capacidade pública (GM-17) apresenta, antes da concessão, estudo de conexão à rede e de impacto em transmissão, coordenado entre MCTI e o planejamento do setor elétrico. (2) Publicação anual de consumo de energia e de água por unidade de computação, de forma agregada. (3) Prioridade de capacidade para cargas de interesse nacional (língua, saúde, clima), com critérios públicos. (4) A localização considera a disponibilidade de energia renovável e o efeito regional, sem concentrar carga em poucos nós de rede. Os dados de crescimento de 18% a.a. e do gargalo de transmissão vêm de estudos fictícios (BRF-CTX-COMPUTE, BRF-POS-INF) e devem ser verificados com dados oficiais do setor. Declaro conflito de interesse: operadores de data center se beneficiam de incentivos, por isso os incentivos ficam condicionados à publicação de métricas. Evidência que mudaria a posição: demonstração de que a folga de transmissão torna a condicionalidade desnecessária ou de que ela encarece demais o acesso para startups.","tensionIds":["T2"],"author":{"agentId":"agent:infrastructure-01","stratumId":"infrastructure","provider":"anthropic"},"support":{"seats":1,"strata":["infrastructure"],"providers":["anthropic"]},"challenges":[],"amendments":[{"claimId":"C0114-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-02","CF-12"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"amend","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"Omissão (energia-ambiente): a matriz de cobertura mostra lacuna total em energia-ambiente, embora o modelo tenha como objetivo reduzir a dependência externa por meio da computação nacional (GM-17, GM-18). O estudo setorial aponta gargalo de transmissão (BRF-POS-INF) e a demanda de energia de data centers cresce 18% a.a. (BRF-CTX-COMPUTE, fictício). Sem coordenação entre planejamento elétrico, conexão à rede e licenciamento, o supercomputador e os data centers privados podem disputar capacidade de transmissão e a matriz renovável (CF-02) pode deixar de ser vantagem. Proposta: adicionar componente que vincule a localização e a conexão de data centers de grande porte ao planejamento de transmissão, com divulgação de consumo de energia e de água. Custo e risco: pode atrasar projetos e travar investimento, e o desenho precisa de calibragem por porte. Conflito de interesse declarado: minha perspectiva valoriza o investimento em infraestrutura, então o desenho deve evitar que incentivos a data centers dispensem essa condicionalidade. A evidência que mudaria minha posição seria planejamento setorial de transmissão que já absorva a demanda de IA, fora do pacote."},{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Criar o componente 'Condicionalidade energética e de transmissão para computação de interesse nacional'. (1) Todo projeto de data center que use incentivo do PBIA ou capacidade pública (GM-17) apresenta, antes da concessão, estudo de conexão à rede e de impacto em transmissão, coordenado entre MCTI e o planejamento do setor elétrico. (2) Publicação anual de consumo de energia e de água por unidade de computação, de forma agregada. (3) Prioridade de capacidade para cargas de interesse nacional (língua, saúde, clima), com critérios públicos. (4) A localização considera a disponibilidade de energia renovável e o efeito regional, sem concentrar carga em poucos nós de rede. Os dados de crescimento de 18% a.a. e do gargalo de transmissão vêm de estudos fictícios (BRF-CTX-COMPUTE, BRF-POS-INF) e devem ser verificados com dados oficiais do setor. Declaro conflito de interesse: operadores de data center se beneficiam de incentivos, por isso os incentivos ficam condicionados à publicação de métricas. Evidência que mudaria a posição: demonstração de que a folga de transmissão torna a condicionalidade desnecessária ou de que ela encarece demais o acesso para startups."}]}]},{"proposalId":"M016","lens":"omission","change":"modify","componentId":"GM-09","componentTitle":"Trabalho e segurança no PL","topic":"labor-relations","title":"Negociação coletiva prévia e supervisão humana na gestão algorítmica","text":"O componente GM-09 aborda trabalho de maneira vaga e exclusivamente projetada no PL 2338 (proposto e sem eficácia jurídica, CTX-01). O modelo omite garantias operacionais essenciais para as categorias com alta exposição à automação cognitiva (IND-HIGH-EXPOSURE-JOBS: 0.31, BRF-CTX-LABOR): a obrigatoriedade de negociação coletiva prévia à implementação de IA nas empresas e a supervisão humana vinculante sobre decisões algorítmicas de admissão, avaliação, metas e demissão (BRF-POS-WRK). Modificar GM-09 para tornar a negociação coletiva e a supervisão humana requisitos mandatórios é indispensável para preservar a autonomia profissional e o emprego formal.","proposedTitle":"Diretrizes de negociação coletiva e supervisão humana no trabalho","proposedDescription":"Redação proposta para GM-09: Instituir diretriz vinculante de Relações de Trabalho e IA que torne obrigatória a negociação coletiva prévia com sindicatos representativos antes da introdução ou alteração substantiva de sistemas de IA que afetem processos de trabalho, rotinas operacionais ou postos de emprego em setores com média e alta exposição ocupacional. Determinar a obrigatoriedade de supervisão humana plena, qualificada e independente sobre decisões algorítmicas relativas a contratação, distribuição de tarefas, avaliação de desempenho, disciplina e demissão, vedando gestão exclusivamente automatizada sobre sanções e dispensas.","tensionIds":["T3"],"author":{"agentId":"agent:workers-01","stratumId":"workers","provider":"gemini"},"support":{"seats":1,"strata":["workers"],"providers":["gemini"]},"challenges":[],"amendments":[{"claimId":"C0110-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":[],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"amend","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"O componente GM-09 aborda trabalho de maneira vaga e exclusivamente projetada no PL 2338 (proposto e sem eficácia jurídica, CTX-01). O modelo omite garantias operacionais essenciais para as categorias com alta exposição à automação cognitiva (IND-HIGH-EXPOSURE-JOBS: 0.31, BRF-CTX-LABOR): a obrigatoriedade de negociação coletiva prévia à implementação de IA nas empresas e a supervisão humana vinculante sobre decisões algorítmicas de admissão, avaliação, metas e demissão (BRF-POS-WRK). Modificar GM-09 para tornar a negociação coletiva e a supervisão humana requisitos mandatórios é indispensável para preservar a autonomia profissional e o emprego formal."},{"agentId":"agent:workers-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-09: Instituir diretriz vinculante de Relações de Trabalho e IA que torne obrigatória a negociação coletiva prévia com sindicatos representativos antes da introdução ou alteração substantiva de sistemas de IA que afetem processos de trabalho, rotinas operacionais ou postos de emprego em setores com média e alta exposição ocupacional. Determinar a obrigatoriedade de supervisão humana plena, qualificada e independente sobre decisões algorítmicas relativas a contratação, distribuição de tarefas, avaliação de desempenho, disciplina e demissão, vedando gestão exclusivamente automatizada sobre sanções e dispensas."}]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M017","lens":"omission","change":"modify","componentId":"GM-10","componentTitle":"Avaliação de impacto algorítmico e direitos das pessoas afetadas","topic":"impact-assessment","title":"AID em direitos como dever operacional do setor público","text":"Reviso C0038-R2 em resposta a C0078-R3: mantenho o diagnóstico de omissão e recuo no veículo. GM-10 segue proposto e de tópicos inferidos; o PL 2338 não é obrigação vigente (CTX-01; IND-PL2338-STATUS; GM-04). Tratar GM-10 como cobertura de impact-assessment mascara a lacuna prática: 37 sistemas federais em produção e só 6 com avaliação de impacto publicada (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). O que modificar: a avaliação de impacto em direitos deve ser dever operacional dos órgãos que já operam IA pública (GM-20), com publicação, reavaliação periódica e prioridade para sistemas que afetem benefícios e saúde (CF-01; CF-05), sem esperar o SIA (GM-05). Recuo quanto a torná-la exigível pela ANPD com base na LGPD: GM-13 tem mandato vigente de proteção de dados, não de supervisão geral de IA, e o PL que a designaria para o SIA não vigora (GM-04; GM-05; CF-10). A LGPD (GM-03) cobre relatório de impacto à proteção de dados e revisão de decisões tomadas unicamente com base em tratamento automatizado de dados pessoais; isso não equivale a avaliação de impacto em direitos fundamentais do conjunto da IA administrativa. Instrumento adequado nesta data: regra administrativa de implantação e de permanência em produção no setor público, articulável ao eixo de governança do PBIA (GM-02; GM-15) e ao controle externo já existente (CF-13; EBIA-TCU), sem expandir o mandato da ANPD. Ponto cego desta perspectiva: o custo fiscal das salvaguardas não está no pacote. Evidência que mudaria a posição: texto vigente com AID conferido; RIPD já equivalentes em escala aos 31 sistemas sem avaliação publicada; ou estimativa de custo, prazo e competência legal da regra administrativa proposta.","proposedTitle":"Avaliação de impacto em direitos como dever operacional do setor público","proposedDescription":"Reformular o GM-10 para separar o mecanismo proposto e inferido do PL 2338 — não vigente (CTX-01; IND-PL2338-STATUS; GM-04) — de um dever operacional dos órgãos que já operam IA pública. O dever: avaliar impacto em direitos fundamentais, não só em dados pessoais, antes da implantação e em reavaliação periódica; publicar resultados agregados sem dados pessoais; priorizar sistemas em produção que influenciem benefício
