<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mural de Tensões · GOV-BR-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!--
  Template for the run-backed tension wall. scripts/build_run_prototypes.py replaces the
  RUN placeholder with the run index, the slimmed revision packet and the council roster.
  Layout: a social feed. Strata are "stories", each proposal is a post whose cover is the
  council table seen from above (the same ring as the 3D tour), lit by each stratum's stance.
-->
<style>
:root{
  color-scheme: dark;
  --chamber:#0E1626; --deep:#09101D; --surface:#152038; --surface-2:#1C2945;
  --line:rgba(214,226,240,.12); --line-2:rgba(214,226,240,.22);
  --text:#EAF0F7; --muted:#93A3BC; --brass:#E8A33D; --brass-2:#F5C571;
  --for:#38C2B4; --against:#FF7A59; --amend:#6EA0FF; --split:#A78BFA; --silent:#3A4659;
  --q1:#38C2B4; --q2:#FF7A59; --q3:#E8A33D;
  --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"IBM Plex Sans", system-ui, sans-serif;
  --feed:min(100%, 520px);
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%, #1A2A4A 0%, var(--chamber) 45%, var(--deep) 100%) fixed;color:var(--text);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--brass-2)}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-columns:1fr;justify-items:center;padding-bottom:84px}
header.top{position:sticky;top:0;z-index:20;width:100%;backdrop-filter:blur(14px);background:rgba(9,16,29,.72);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--feed);margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.wordmark{font:700 24px/1 var(--display);letter-spacing:-.02em;margin:0;flex:1}
.wordmark small{display:block;font:500 12.5px/1.4 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--text)}
.icon-btn:hover{background:var(--surface)}
main{width:var(--feed);min-width:0}
aside{display:none;position:sticky;top:90px;align-self:start;padding-top:24px}

/* ---------------------------------------------------------------- stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:16px 16px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;width:72px;display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.story .ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg, var(--c), var(--brass), var(--c));transition:transform .2s}
.story.seen .ring{background:var(--line-2)}
.story:hover .ring{transform:scale(1.05)}
.story .av{width:100%;height:100%;border-radius:50%;border:3px solid var(--deep);display:grid;place-items:center;background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 85%, white), var(--c) 55%, color-mix(in srgb, var(--c) 50%, black));font:700 18px/1 var(--display);color:#0B1220}
.story span{line-height:1.2;max-width:76px}

/* ---------------------------------------------------------------- tension chips */
.chips{position:sticky;top:70px;z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:linear-gradient(var(--chamber) 70%, transparent);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text);font-weight:600;margin-right:4px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--deep);border-color:var(--text)}
.chip[aria-pressed="true"] b{color:var(--deep)}

/* ---------------------------------------------------------------- tension banner */
.banner{margin:6px 16px 22px;padding:22px 20px 18px;border-radius:24px;background:linear-gradient(150deg, var(--surface-2), var(--surface) 60%);border:1px solid var(--line)}
.banner h2{font:700 clamp(26px, 6vw, 34px)/1.05 var(--display);letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
.banner p{margin:0 0 16px;color:var(--muted);max-width:60ch}
.spread{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--silent)}
.spread i{display:block;height:100%}
.spread-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.spread-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.seeders{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.dotav{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid var(--surface);flex:0 0 auto}
.seeders .dotav+.dotav{margin-left:-14px}

/* ---------------------------------------------------------------- post */
.post{margin:0 0 30px;border-bottom:1px solid var(--line);padding-bottom:18px}
@media (min-width:560px){ .post{border:1px solid var(--line);border-radius:22px;background:rgba(21,32,56,.55);padding-bottom:16px;overflow:hidden} }
.post-head{display:flex;align-items:center;gap:11px;padding:12px 14px}
.post-head .av{width:38px;height:38px;border-radius:50%;padding:2px;background:conic-gradient(var(--c), var(--brass), var(--c))}
.post-head .av i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--deep);background:var(--c)}
.who{flex:1;min-width:0;line-height:1.25}
.who b{font-weight:600}
.who small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lens{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--deep);background:var(--lc)}

.carousel{position:relative;aspect-ratio:1/1;background:var(--deep)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
.cover{background:radial-gradient(90% 70% at 50% 38%, color-mix(in srgb, var(--lc) 26%, transparent), transparent 70%), linear-gradient(180deg, #0F1A2E, #0A111F);display:grid;grid-template-rows:1fr auto}
.cover svg{width:100%;height:100%;max-height:100%}
.cover{position:relative}
.key{position:absolute;top:14px;left:14px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);max-width:70%}
.key span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.key .au::before{background:none;border:2px solid var(--brass);width:6px;height:6px}
.cover h3{margin:0;padding:0 22px 22px;font:700 clamp(21px, 5.2vw, 27px)/1.08 var(--display);letter-spacing:-.02em;text-wrap:balance}
.textslide{padding:26px 24px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg, #18264200, #0B1322), var(--surface)}
.textslide h4{margin:0;font:600 13px/1.3 var(--body);color:var(--brass-2)}
.textslide .body{overflow:auto;font-size:15px;line-height:1.55;padding-right:6px;scrollbar-width:thin}
.textslide .body p{margin:0 0 .8em}
.grid8{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:18px;height:100%;background:var(--surface)}
.cell{border-radius:16px;padding:10px 12px;background:color-mix(in srgb, var(--sc) 16%, var(--surface));border:1px solid color-mix(in srgb, var(--sc) 45%, transparent);display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.cell.silent{background:transparent;border-style:dashed;border-color:var(--line-2);color:var(--muted)}
.cell b{font-size:13.5px;font-weight:600}
.cell span{font:700 20px/1 var(--display);color:var(--sc)}
.cell.silent span{color:var(--muted);font-weight:500;font-size:15px}
.counter{position:absolute;top:12px;right:12px;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(9,16,29,.72)}
.pager{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pager button{flex:1 0 auto;height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pager button[aria-selected="true"]{color:var(--deep);background:var(--brass);border-color:var(--brass)}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(9,16,29,.78);border:1px solid var(--line-2);color:var(--text);backdrop-filter:blur(6px);transition:opacity .2s}
.nav-arrow.prev{left:10px}.nav-arrow.next{right:10px}
.nav-arrow[disabled]{opacity:0;pointer-events:none}
.next-hint{animation:nudge 1.6s ease-in-out 1.2s 2}
@keyframes nudge{0%,100%{transform:translateY(-50%)}50%{transform:translate(5px,-50%)}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst.go{animation:burst .9s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}

.actions{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.act{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text);border:1px solid var(--line-2);transition:background .15s, border-color .15s, transform .15s}
.act:active{transform:scale(.94)}
.act[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--deep)}
.act.icon-only{border:0;padding:0 8px}
.act.icon-only[aria-pressed="true"]{background:none;color:var(--brass)}
.spacer{flex:1}
.caption{padding:10px 16px 0;line-height:1.5}
.caption .liked{font-size:14px;margin-bottom:6px}
.caption .liked b{font-weight:600}
.caption .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#D5DEEA}
.caption .desc.open{display:block}
.more{color:var(--muted);font-size:14px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:13.5px}
.tags button{color:var(--brass-2)}
.flag{color:var(--against)}
.comments{padding:6px 16px 0}
.comments>button{color:var(--muted);font-size:14px;margin:4px 0}
.comment{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0}
.comment .dotav{width:28px;height:28px;border:0}
.comment .txt{font-size:14px;line-height:1.5}
.comment .txt b{font-weight:600}
.comment .verb{color:var(--vc);font-weight:500}
.comment .clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.comment .clamp.open{display:block}
.comment .meta{font-size:12px;color:var(--muted);margin-top:2px}
form.say{display:flex;gap:10px;align-items:center;margin:8px 16px 0;padding-top:10px;border-top:1px solid var(--line)}
form.say input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:14px;padding:6px 0}
form.say input::placeholder{color:var(--muted)}
form.say input:focus{outline:none}
form.say button{color:var(--brass-2);font-weight:600;font-size:14px}
form.say button:disabled{opacity:.4;cursor:default}

/* ---------------------------------------------------------------- grid view */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 0 20px}
.tile{position:relative;aspect-ratio:1/1;background:linear-gradient(180deg, #0F1A2E, #0A111F);overflow:hidden}
.tile svg{width:100%;height:100%}
.tile .ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;background:linear-gradient(transparent 45%, rgba(9,16,29,.92));font:600 12px/1.2 var(--body);text-align:left;opacity:.0;transition:opacity .2s}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile .mine{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--mc);border:2px solid var(--deep)}

/* ---------------------------------------------------------------- side panel & sheets */
.card{border:1px solid var(--line);border-radius:20px;padding:18px;background:rgba(21,32,56,.55);margin-bottom:16px}
.card h3{margin:0 0 6px;font:700 18px/1.2 var(--display)}
.card p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat-row div{text-align:center}
.stat-row b{display:block;font:700 22px/1 var(--display)}
.stat-row span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--brass);color:#1A1306}
.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--text)}
.files{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;margin-top:8px}
.files a{font-size:13px;text-decoration:none;color:var(--text);display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:8px}
.files a:hover{background:var(--surface-2)}
.files a span{color:var(--muted)}
.heat{display:grid;grid-template-columns:auto repeat(8, 1fr);gap:3px;font-size:11.5px;align-items:center}
.heat .h{color:var(--muted);text-align:center}
.heat .r{color:var(--muted);padding-right:6px;white-space:nowrap}
.heat i{display:block;aspect-ratio:1/1;border-radius:4px;background:var(--silent)}
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(5,9,17,.6);backdrop-filter:blur(4px)}
.sheet.open{display:flex}
.sheet .panel{width:min(100%, 520px);max-height:86vh;overflow:auto;background:var(--chamber);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px 30px}
@media (min-width:700px){ .sheet{align-items:center} .sheet .panel{border-radius:24px} }
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:rgba(9,16,29,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.bottom button{display:grid;justify-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-width:64px}
nav.bottom button[aria-current="page"]{color:var(--text)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty h3{font:700 22px/1.2 var(--display);color:var(--text);margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--text);color:var(--deep);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------------------------------------------------------------- story viewer */
.viewer{position:fixed;inset:0;z-index:50;display:none;background:#05080F;touch-action:manipulation}
.viewer.open{display:grid;place-items:center}
.vframe{position:relative;width:min(100vw, calc(100vh * 9 / 16), 460px);height:min(100vh, 820px);background:radial-gradient(110% 60% at 50% 0%, color-mix(in srgb, var(--c) 55%, #0E1626), #0E1626 62%);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){ .vframe{border-radius:22px;height:min(92vh, 820px)} }
.bars{display:flex;gap:4px;padding:12px 12px 0}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.vhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.vhead .dotav{width:36px;height:36px;border:2px solid rgba(255,255,255,.6)}
.vhead div{flex:1;line-height:1.25}
.vhead small{display:block;color:rgba(234,240,247,.7);font-size:12.5px}
.vbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:10px 26px 20px;min-height:0}
.vstance{align-self:flex-start;font-weight:600;font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--sc);color:var(--deep)}
.vquote{font:600 clamp(19px, 5vw, 23px)/1.32 var(--display);letter-spacing:-.01em;margin:0;overflow:auto}
.vprop{border-top:1px solid rgba(255,255,255,.18);padding-top:14px;font-size:14px;color:rgba(234,240,247,.85)}
.vfoot{display:flex;gap:10px;padding:0 20px 22px}
.vfoot .btn{flex:1}
.vtap{position:absolute;top:70px;bottom:90px;width:35%;z-index:2}
.vtap.l{left:0}.vtap.r{right:0}
.vclose{position:absolute;top:22px;right:10px;z-index:3;color:#fff}

.code{display:inline;padding:0 .3em;margin:0 .05em;border-radius:6px;font:inherit;color:inherit;background:rgba(232,163,61,.13);box-shadow:inset 0 -1.5px 0 rgba(232,163,61,.55);cursor:pointer;line-height:inherit;text-align:left}
.code:hover{background:rgba(232,163,61,.24)}
.code.fic{box-shadow:inset 0 -1.5px 0 rgba(255,122,89,.0);background:rgba(255,122,89,.10);border-bottom:1.5px dashed rgba(255,122,89,.7);border-radius:6px 6px 0 0}
.code.k-claim{background:rgba(110,160,255,.13);box-shadow:inset 0 -1.5px 0 rgba(110,160,255,.6)}
.src{display:inline-flex;align-items:center;gap:4px;vertical-align:1px;margin:0 .15em;padding:1px 8px;border-radius:999px;font-size:.78em;font-weight:600;color:var(--muted);border:1px solid var(--line-2)}
.src:hover{color:var(--text);border-color:var(--brass)}
.vquote .code,.vquote .src{position:relative;z-index:3}
.pop{position:absolute;z-index:70;width:min(330px, calc(100vw - 24px));background:#1A2742;border:1px solid var(--line-2);border-radius:16px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45);font-size:14px;line-height:1.45}
.pop[hidden]{display:none}
.pop .kind{font-size:12.5px;color:var(--brass-2);font-weight:600}
.pop h5{margin:3px 0 6px;font:700 17px/1.2 var(--display)}
.pop p{margin:0 0 6px;color:#C9D4E3}
.pop .fic{color:var(--against);font-size:12.5px;font-weight:600}
.pop .cd{font-size:12px;color:var(--muted)}
.pop ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pop li b{display:block;font-weight:600}
.pop li span{font-size:12.5px;color:var(--muted)}
.howto{margin:0 0 22px;padding:16px 18px;border-radius:20px;border:1px solid rgba(232,163,61,.35);background:rgba(232,163,61,.07);font-size:14px}
.howto h3{margin:0 0 6px;font:700 17px/1.2 var(--display)}
.howto p{margin:0 0 10px;color:#C9D4E3}
.howto .row{display:flex;gap:10px;flex-wrap:wrap}
.legend-codes{display:grid;gap:12px;margin:12px 0 16px;font-size:13.5px}
.legend-codes div{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.legend-codes .code{white-space:nowrap}
.legend-codes span{color:#C9D4E3;max-width:46ch}
@media (min-width:560px){ .howto{margin-inline:0} }
@media (max-width:559px){ .howto{margin-inline:16px} }
@media (min-width:560px){ .banner{margin-inline:0} .stories,.chips{padding-inline:0} }
@media (min-width:1080px){
  .app{grid-template-columns:minmax(0,1fr) var(--feed) 320px minmax(0,1fr);column-gap:40px;padding-bottom:40px}
  .app>main{grid-column:2} .app>aside{grid-column:3;display:block}
  .top-in{max-width:880px} nav.bottom{display:none} .toast{bottom:32px}
}
/* live layer: faces, presence, QR, join */
.face{display:block;border-radius:50%;flex:0 0 auto}
.stack{display:inline-flex;align-items:center}
.stack .face{border:2px solid var(--deep);margin-left:-10px;box-sizing:content-box}
.stack .face:first-child{margin-left:0}
.stack .more{margin-left:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--deep);font-size:12px;font-weight:600;box-sizing:content-box}
.here{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.here .who-here{flex:1;min-width:160px;font-size:13.5px;color:var(--muted)}
.here .who-here b{color:var(--text);font-weight:600}
.qr-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--text);color:var(--deep);font-weight:600;font-size:13.5px}
.chip .pc{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--for);color:var(--deep);font-size:11px;font-weight:700}
.chip .pc:empty{display:none}
.humans{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.humans:empty{display:none}
.humans b{color:var(--text);font-weight:600}
.me-btn{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:600}
.me-btn[hidden]{display:none}
@media (max-width:440px){ .me-btn span{display:none} .me-btn{padding:3px} .wordmark{font-size:21px} }
.qrbox{display:grid;place-items:center;background:#fff;border-radius:20px;padding:18px;margin:14px auto;width:min(100%, 340px);aspect-ratio:1/1}
.qrbox svg{width:100%;height:100%}
.qrurl{text-align:center;font-size:14px;word-break:break-all;color:var(--muted);margin:0 0 14px}
.qr-full{position:fixed;inset:0;z-index:80;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#0B1220;padding:24px}
.qr-full.open{display:flex}
.qr-full h2{font:700 clamp(28px, 5vw, 56px)/1.05 var(--display);margin:0;text-align:center;max-width:22ch}
.qr-full .qrbox{width:min(70vh, 80vw);margin:0;padding:0}
.qr-full p{font-size:clamp(16px, 2.2vw, 24px);margin:0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.role{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1.5px solid var(--line-2);text-align:left;font-size:13.5px;line-height:1.25}
.role[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, transparent)}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13.5px;font-weight:600}
.field input{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--deep);color:var(--text);padding:0 14px;font:inherit}
.field input:focus{outline:2px solid var(--brass-2);outline-offset:1px}
.note{font-size:13px;color:var(--muted);margin:0 0 14px}
.err{color:var(--against);font-size:13.5px;margin:0 0 10px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--for);margin-right:6px;box-shadow:0 0 0 0 rgba(56,194,180,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(56,194,180,0)}100%{box-shadow:0 0 0 0 rgba(56,194,180,0)}}
.comment .del{color:var(--muted);font-size:12px;margin-left:8px;text-decoration:underline}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
.ident{color:var(--muted,#93A3BC);font-weight:500}
</style>

a.","strata":[{"stratumId":"regulators","label":"Reguladores / fiscalização","seats":1},{"stratumId":"publicOperators","label":"Poder público operador","seats":1},{"stratumId":"business","label":"Empresas / startups","seats":1},{"stratumId":"research","label":"Pesquisa interdisciplinar","seats":1},{"stratumId":"civilSociety","label":"Sociedade civil e direitos","seats":1},{"stratumId":"workers","label":"Trabalhadores / profissões","seats":1},{"stratumId":"affectedGroups","label":"Grupos diretamente afetados","seats":1},{"stratumId":"infrastructure","label":"Infraestrutura / ambiente","seats":1}],"seedTensions":[{"id":"T1","title":"Continuidade do plano × supervisão e avaliação","description":"Se o orçamento pós-2028 encolher, o que se protege primeiro: infraestrutura e pesquisa, ou a capacidade de supervisionar e avaliar?","strata":["research","regulators"],"findingsByReplicate":[9],"expectationSeatsByReplicate":[5]},{"id":"T2","title":"Soberania computacional × custo e energia","description":"Reduzir a dependência de nuvem estrangeira exige capacidade nacional, energia e chips, com custo para quem usa IA hoje.","strata":["infrastructure","business"],"findingsByReplicate":[5],"expectationSeatsByReplicate":[3]},{"id":"T3","title":"Difusão da IA × emprego e desigualdade regional","description":"Adoção rápida e ganho de produtividade de um lado; ocupações expostas e requalificação desigual entre regiões do outro.","strata":["workers","business"],"findingsByReplicate":[7],"expectationSeatsByReplicate":[4]},{"id":"T4","title":"Direitos × custo de conformidade","description":"Avaliação de impacto e transparência algorítmica de um lado; a carga de documentação para PMEs e startups do outro.","strata":["civilSociety","business"],"findingsByReplicate":[4],"expectationSeatsByReplicate":[4]},{"id":"T5","title":"Auditoria × capacidade de fiscalizar","description":"Exigir auditoria em todo sistema público de alto impacto depende de quem consegue fiscalizar e de quantos sistemas já estão em produção.","strata":["regulators","publicOperators"],"findingsByReplicate":[12],"expectationSeatsByReplicate":[5]},{"id":"T6","title":"Eficiência × contestação humana","description":"A triagem automática acelera o atendimento; o cidadão precisa entender e contestar uma negativa.","strata":["publicOperators","affectedGroups"],"findingsByReplicate":[8],"expectationSeatsByReplicate":[5]}],"proposals":[{"proposalId":"M001","lens":"omission","change":"modify","componentId":"GM-02","componentTitle":"Plano Brasileiro de IA (PBIA) 2024-2028","topic":"funding-continuity","title":"Blindagem orçamentária de custeio contínuo (OPEX) e governança de transição para IA pública","text":"O modelo trata o financiamento pelo GM-02 (PBIA 2024-2028) e GM-22, mas omite mecanismos de blindagem orçamentária plurianual para o custeio operacional contínuo (OPEX) dos serviços públicos de IA e regras de transição governamental. Essa omissão é crítica em novembro de 2026 porque o PBIA está na metade final de seu ciclo com divergências sobre entregas reais — 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED, CTX-02) —, depende de programação orçamentária anual (PBIA-AXES) e enfrentará transição de governo e legislatura em janeiro de 2027 (CTX-03). Para operadores públicos que mantêm 37 sistemas em produção (IND-PUBLIC-AI-SYSTEMS, BRF-CTX-PUBSVC) e dependem de infraestrutura nacional em implantação (GM-17), a sujeição ao contingenciamento anual gera risco de paralisação de serviços digitais essenciais e inadimplência contratual (BRF-POS-PUBOP). Propõe-se modificar o GM-02 para vincular recursos plurianuais de custeio contínuo de infraestrutura e sustentação dos sistemas públicos de IA em produção, blindados na transição de 2027 e no pós-2028 (IND-POST2028-FUNDING). A comprovação de garantia orçamentária plurianual vinculante já assegurada na lei orçamentária para a operação contínua de IA pública alteraria este achado.","proposedTitle":"Plano Brasileiro de IA (PBIA) 2024-2028 com proteção de custeio operacional (OPEX) e regra de transição","proposedDescription":"Redação proposta para modificar o GM-02 (Plano Brasileiro de IA 2024-2028): 'Plano nacional com previsão de R$ 23,03 bilhões (PBIA-BUDGET, IND-PBIA-BUDGET-BRL-BN) organizado em cinco eixos (PBIA-DOC, PBIA-AXES), acrescido de regra de sustentabilidade operacional plurianual e governança de transição: (1) Vinculação de custeio contínuo (OPEX): todo investimento de capital (CAPEX) em infraestrutura nacional de computação (GM-17) e em sistemas públicos de IA (GM-20) deve incluir previsão plurianual de custeio operacional — energia, conectividade, atualização tecnológica e equipes de supervisão humana —, prevenindo a interrupção dos 37 sistemas federais em produção (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS, BRF-POS-PUBOP); (2) Salvaguarda de transição governamental e pós-2028: diante da transição federal em janeiro de 2027 (CTX-03), da reta final do ciclo 2024-2028 com divergência de entregas (25/54 ações na premissa simulada; CTX-02, IND-PBIA-ACTIONS-DELIVERED) e da incerteza sobre a manutenção do financiamento pós-2028 (IND-POST2028-FUNDING), fica assegurada prioridade orçamentária para a manutenção de serviços digitais críticos sobre o gov.br (CF-01) e para a capacidade de supervisão, vedando a desativação abrupta de sistemas em produção sem plano de transição assistida. Evidência que alteraria a proposta: comprovação normativa de dotação plurianual obrigatória já imune a contingenciamentos anuais.'","tensionIds":["T1"],"author":{"agentId":"agent:publicOperators-01","stratumId":"publicOperators","provider":"gemini"},"support":{"seats":3,"strata":["infrastructure","publicOperators","research"],"providers":["anthropic","gemini"]},"challenges":[],"amendments":[{"claimId":"C0087-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-01","CF-12"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"amend","statements":[{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"O modelo trata o financiamento pelo GM-02 (PBIA 2024-2028) e GM-22, mas omite mecanismos de blindagem orçamentária plurianual para o custeio operacional contínuo (OPEX) dos serviços públicos de IA e regras de transição governamental. Essa omissão é crítica em novembro de 2026 porque o PBIA está na metade final de seu ciclo com divergências sobre entregas reais — 25 de 54 ações com entregas (IND-PBIA-ACTIONS-DELIVERED, CTX-02) —, depende de programação orçamentária anual (PBIA-AXES) e enfrentará transição de governo e legislatura em janeiro de 2027 (CTX-03). Para operadores públicos que mantêm 37 sistemas em produção (IND-PUBLIC-AI-SYSTEMS, BRF-CTX-PUBSVC) e dependem de infraestrutura nacional em implantação (GM-17), a sujeição ao contingenciamento anual gera risco de paralisação de serviços digitais essenciais e inadimplência contratual (BRF-POS-PUBOP). Propõe-se modificar o GM-02 para vincular recursos plurianuais de custeio contínuo de infraestrutura e sustentação dos sistemas públicos de IA em produção, blindados na transição de 2027 e no pós-2028 (IND-POST2028-FUNDING). A comprovação de garantia orçamentária plurianual vinculante já assegurada na lei orçamentária para a operação contínua de IA pública alteraria este achado."},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para modificar o GM-02 (Plano Brasileiro de IA 2024-2028): 'Plano nacional com previsão de R$ 23,03 bilhões (PBIA-BUDGET, IND-PBIA-BUDGET-BRL-BN) organizado em cinco eixos (PBIA-DOC, PBIA-AXES), acrescido de regra de sustentabilidade operacional plurianual e governança de transição: (1) Vinculação de custeio contínuo (OPEX): todo investimento de capital (CAPEX) em infraestrutura nacional de computação (GM-17) e em sistemas públicos de IA (GM-20) deve incluir previsão plurianual de custeio operacional — energia, conectividade, atualização tecnológica e equipes de supervisão humana —, prevenindo a interrupção dos 37 sistemas federais em produção (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS, BRF-POS-PUBOP); (2) Salvaguarda de transição governamental e pós-2028: diante da transição federal em janeiro de 2027 (CTX-03), da reta final do ciclo 2024-2028 com divergência de entregas (25/54 ações na premissa simulada; CTX-02, IND-PBIA-ACTIONS-DELIVERED) e da incerteza sobre a manutenção do financiamento pós-2028 (IND-POST2028-FUNDING), fica assegurada prioridade orçamentária para a manutenção de serviços digitais críticos sobre o gov.br (CF-01) e para a capacidade de supervisão, vedando a desativação abrupta de sistemas em produção sem plano de transição assistida. Evidência que alteraria a proposta: comprovação normativa de dotação plurianual obrigatória já imune a contingenciamentos anuais.'"}]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"split","statements":[{"agentId":"agent:research-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"A matriz marca financiamento e continuidade como 'documentedInForce' por causa de GM-02 e GM-22. A cobertura é nominal. GM-02 é um plano com fim em 2028, e seus cerca de R$ 23,03 bi (PBIA-BUDGET, IND-PBIA-BUDGET-BRL-BN) dependem de programação anual e de fontes heterogêneas: orçamento, FNDCT, crédito e contrapartida privada (PBIA-AXES). O modelo não tem nenhum mecanismo para a transição de governo em janeiro de 2027 (CTX-03) nem para o pós-2028. O indicador fictício IND-POST2028-FUNDING (1,0) é premissa do mundo simulado, não compromisso: nenhum instrumento do modelo garante esse nível nem sua composição. Proponho modificar GM-02 com três elementos. (a) Uma linha de base plurianual mínima, protegida de contingenciamento, para ações de execução longa: infraestrutura de GM-17, bolsas e formação de GM-19, e avaliação. (b) Um protocolo de transição publicado antes de jan/2027, com o inventário de contratos e editais em curso e o custo de interrupção de cada um. (c) Uma regra explícita sobre o que se protege primeiro se houver corte (T1). Sobre (c), defendo que a capacidade de avaliar e supervisionar não seja a primeira variável de ajuste. Declaro conflito: minha perspectiva é beneficiária direta desses recursos e tem como ponto cego a urgência operacional do setor público. Mudaria de posição diante de evidência de que a programação anual já garante continuidade, por exemplo uma execução estável do FNDCT entre ciclos."},{"agentId":"agent:research-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Acrescentar a GM-02 uma 'Regra de continuidade e transição': (a) o plano identifica um núcleo de continuidade separado das ações novas. Esse núcleo reúne a operação e manutenção da infraestrutura instalada (GM-17), o custeio dos serviços públicos de IA já em produção (na linha de C0062-R2), a capacidade de supervisão e avaliação, e as equipes de pesquisa com compromissos plurianuais. (b) Se o orçamento for contraído (T1), a ordem de proteção será: 1) contestação, avaliação e supervisão dos sistemas que já afetam pessoas; 2) operação da infraestrutura já instalada; 3) pesquisa plurianual em curso; 4) ações novas. Declaro conflito: como beneficiária, coloco a pesquisa em terceiro lugar para compensar meu ponto cego sobre a urgência operacional do setor público. (c) Um dossiê de transição será publicado no primeiro trimestre de 2027 (CTX-03), com execução por fonte (orçamento, FNDCT, crédito, contrapartida privada; PBIA-BUDGET, PBIA-AXES), compromissos assumidos e custo de descontinuar cada ação. (d) Um plano pós-2028 será apresentado a tempo do ciclo orçamentário seguinte. O indicador fictício IND-POST2028-FUNDING (1,0) passa a ser premissa a testar em cenários de contração, não pressuposto. Evidência que mudaria minha posição: programação orçamentária plurianual já vinculada ao núcleo de continuidade."},{"agentId":"agent:research-01","provider":"anthropic","stance":"for","role":"support","roundId":"R3","text":"Apoio, com divulgação de conflito: esta perspectiva é beneficiária direta de recursos do plano. O custeio operacional contínuo é onde a continuidade tende a se romper primeiro. A execução é divergente (CTX-02), o governo muda em janeiro de 2027 (CTX-03) e a programação é anual (PBIA-AXES). O achado complementa C0041-R2 ao cobrir a operação de serviços públicos, que é ponto cego da minha perspectiva. Proponho uma condição: a blindagem deve incluir explicitamente o orçamento de supervisão e de avaliação independente (T1), para que o custeio não proteja só a operação e deixe sem fundos a capacidade de avaliar o que opera. Mudaria minha posição: evidência de que o custeio dos 37 sistemas já está em rubricas permanentes dos órgãos."}]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"for","statements":[{"agentId":"agent:infrastructure-01","provider":"anthropic","stance":"for","role":"support","roundId":"R5","text":"Apoio a blindagem plurianual do custeio operacional (OPEX). A infraestrutura de computação exige energia, manutenção e renovação de hardware depois de 2028, e o IND-POST2028-FUNDING (1,0, fictício) pressupõe continuidade sem mecanismo. Sugiro incluir no desenho a previsão de custo energético e de renovação de equipamentos, com revisão na transição de governo de janeiro de 2027 (CTX-03)."}]}]},{"proposalId":"M002","lens":"omission","change":"modify","componentId":"GM-20","componentTitle":"IA Brasil: IA no serviço público (CPQD, Serpro e Dataprev)","topic":"rights-redress","title":"Contestação acessível em benefícios","text":"Modificar a iniciativa de IA em serviços públicos para prever, nas negativas ou interrupções de benefícios influenciadas por IA, explicação compreensível, contestação gratuita e revisão por pessoa com poder de alterar a decisão. Oferecer atendimento presencial e telefônico, além do digital. A LGPD já contém direitos pertinentes, mas a cobertura temática não demonstra que esses canais existam para todos esses casos. No cenário fictício, apenas 2 dos 37 sistemas têm canal de contestação humana documentado; a desigualdade digital é hipótese a verificar. Dados que mostrem canais acessíveis e resolutivos já disponíveis por região mudariam a prioridade da proposta.","proposedTitle":"Contestação acessível e nativa em IA de benefícios no gov.br","proposedDescription":"Modificar a iniciativa IA Brasil (GM-20) para que negativas ou interrupções de benefícios e demais decisões administrativas influenciadas por IA incluam: explicação compreensível; contestação gratuita; revisão por pessoa com poder de alterar a decisão; e atendimento presencial e telefônico além do digital, em razão da desigualdade de acesso (CF-11). No fluxo do gov.br (CF-01), a decisão nasce com ficha de finalidade, status da avaliação de impacto em direitos, responsável nomeado e canal de contestação, auditável pelo controle externo (CF-13). Escalonar por dano — benefícios e grupos vulneráveis primeiro, com prazos públicos — sem desligamento imediato dos 37 sistemas da premissa fictícia (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). A LGPD (GM-03) não substitui esse canal: só 2 dos 37 sistemas têm contestação humana documentada (BRF-POS-AFF).","tensionIds":["T6"],"author":{"agentId":"agent:affectedGroups-01","stratumId":"affectedGroups","provider":"openai"},"support":{"seats":3,"strata":["affectedGroups","business","civilSociety"],"providers":["openai","xai"]},"challenges":[],"amendments":[{"claimId":"C0104-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-11"],"stratumPositions":[{"stratumId":"regulators","stance":"amend","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"Omissão parcial em GM-20: a iniciativa de IA no serviço público não condiciona entrada ou permanência em produção a canal de contestação humana. A premissa fictícia é de 37 sistemas federais em produção, 6 com avaliação de impacto publicada e 2 com canal de contestação documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). A fonte fictícia BRF-POS-AFF descreve negativas automatizadas sem explicação. GM-10, que traria avaliação e contestação, está marcado como proposto e de tópicos inferidos; não alcança o que já opera. A LGPD já prevê revisão de decisão automatizada (GM-03), mas o modelo não a converte em gate de GM-20. Proposta: sistema estatal que negue benefício, crédito ou acesso só permanece em produção com explicação acessível e revisão humana; nos demais, publicação do canal e da avaliação antes de escalar (T5, T6). O gate é de uso estatal, não carga documental genérica sobre PMEs — ponto cego desta perspectiva (T4). Mudaria a posição contagem auditável de que a maior parte dos sistemas em produção já tem canal documentado."},{"agentId":"agent:regulators-01","provider":"xai","stance":"for","role":"author","roundId":"R4","text":"Reviso o achado diante da contestação: aceito que a permanência em produção não pode ser condicionada de imediato, para os 37 sistemas da premissa fictícia, a um canal de contestação humana sem regra de transição, escalonamento de risco e dotação prévia. Mantenho a omissão parcial em GM-20. A iniciativa de IA no serviço público não condiciona entrada nem permanência em produção a esse canal. A premissa, não um achado, continua sendo 37 sistemas federais em produção, 6 com avaliação de impacto publicada e 2 com canal de contestação humana documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). BRF-POS-AFF, fonte fictícia, descreve negativas automatizadas sem explicação. O que não se sustenta é a condição suspensiva imediata e uniforme. No mundo simulado, 140 servidores dedicam-se à fiscalização de IA e 18% dos órgãos federais têm unidade de governança de IA (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS). Esses números são premissa inventada. Desligamento geral excederia essa capacidade e contrariaria a fiscalização escalonada (BRF-POS-REG, BRF-POS-PUBOP). Também não cabe converter a lacuna em dever novo da ANPD: GM-13 aplica a LGPD; o PL 2338 não vigora (CTX-01, GM-04, IND-PL2338-STATUS); GM-10 é proposto e de tópicos inferidos, não cobertura vigente. Reformulação de GM-20 como regra de desenho do operador público, não como sanção: sistemas novos só entram em produção com canal de contestação humana capaz de explicar a decisão e alterá-la; sistemas já em produção que possam negar ou interromper benefício, ou outra decisão administrativa de alto impacto sobre a pessoa, formam coorte prioritária, com prazo de transição e custeio assegurado antes de qualquer condição suspensiva; os demais entram em coorte posterior, por risco. A LGPD (GM-03) já prevê revisão de decisão tomada unicamente com base em tratamento automatizado de dados pessoais, mas isso não demonstra canal para o conjunto das triagens administrativas. A posição muda se houver evidência de canais já existentes e apenas não documentados, de norma vigente que já imponha a condição, ou de custo e prazo mostrando que mesmo a coorte prioritária interromperia serviço essencial sem alternativa presencial ou telefônica."},{"agentId":"agent:regulators-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para GM-20: a iniciativa de IA no serviço público condiciona a entrada em produção de sistema novo, capaz de negar, suspender ou interromper benefício ou serviço, a explicação compreensível da negativa, canal de contestação gratuito com alternativa presencial ou telefônica e revisão por pessoa com poder de alterar a decisão, em prazo que o próprio órgão publique. Para sistemas já em produção, a permanência não se suspende de imediato: o órgão publica inventário e cronograma de transição, com dotação identificada, priorizando os que possam causar negativa ou interrupção de benefício. A premissa fictícia, não achado, é de 37 sistemas federais em produção, 6 com avaliação de impacto publicada e 2 com canal de contestação humana documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). A LGPD (GM-03, GM-13) segue cobrindo a revisão de decisão baseada unicamente em tratamento automatizado de dados pessoais; este componente não a converte em dever geral de contestação de IA administrativa nem em poder sancionatório novo da ANPD. O déficit simulado de capacidade (CTX-05, IND-AI-INSPECTORS) justifica escalonamento e dotação prévia; não justifica omitir o canal nos sistemas novos de alto dano ao acesso. Afeta órgãos operadores, gestores públicos e pessoas beneficiárias. Evidência que alteraria a posição: demonstração de que os sistemas em produção já têm canal humano documentado, ou estimativa de custo e prazo que mostre inviabilidade mesmo do escalonamento proposto."}]},{"stratumId":"publicOperators","stance":"split","statements":[{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"Embora a matriz de cobertura indique que o uso no setor público é atendido pelo componente GM-20 (IA Brasil com CPQD, Serpro e Dataprev) e pelo GM-02 (PBIA), o modelo omite diretrizes operacionais para compras públicas de IA, prevenção de dependência de fornecedor único (lock-in) e delimitação da responsabilidade administrativa do gestor público. Isso importa neste contexto porque já existem 37 sistemas de IA em produção no governo federal (IND-PUBLIC-AI-SYSTEMS, BRF-CTX-PUBSVC), 85% da computação de IA depende de nuvens estrangeiras (IND-FOREIGN-COMPUTE-SHARE, BRF-CTX-COMPUTE, CF-12) e o PL 2338 (GM-04) segue sem vigência (CTX-01, IND-PL2338-STATUS), tratando apenas de responsabilidade civil (GM-11) enquanto o gestor público responde perante órgãos de controle externo como o TCU (CF-13, EBIA-TCU). Propõe-se modificar o GM-20 para instituir cláusulas contratuais padronizadas de portabilidade de modelos, interoperabilidade e reversibilidade em licitações de IA, combinadas a um regime de segurança jurídica (safe harbor administrativo) para o gestor que contratar e operar sistemas em conformidade com padrões técnicos validados pelas empresas públicas de TI (BRF-POS-PUBOP). Evidência de que normas infralegais vigentes de contratação de TI já mitigam o lock-in de modelos fundacionais e protegem o gestor perante o TCU mudaria esta posição."},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para modificar o GM-20 (IA Brasil: CPQD, Serpro e Dataprev): 'Iniciativa para desenvolver, contratar e operar sistemas de IA em serviços públicos com empresas públicas de tecnologia, regida por três diretrizes operacionais obrigatórias: (1) Compras públicas anti-lock-in: editais e contratos de nuvem e modelos para sistemas federais (IND-PUBLIC-AI-SYSTEMS: 37 sistemas em produção; BRF-CTX-PUBSVC) devem exigir cláusulas de portabilidade, interoperabilidade, APIs abertas e reversibilidade de dados e pesos ajustados, mitigando a dependência de 85% de nuvens estrangeiras (IND-FOREIGN-COMPUTE-SHARE, BRF-CTX-COMPUTE, CF-12); (2) Catálogo público de componentes reutilizáveis: compartilhamento de modelos e módulos entre órgãos para evitar contratações redundantes e captura por fornecedor único (BRF-POS-PUBOP, PBIA-DOC); (3) Segurança jurídica administrativa do gestor: definição de parâmetros objetivos de diligência (safe harbor administrativo) para gestores que aderirem aos padrões técnicos federais e de controle externo (CF-13, EBIA-TCU), delimitando a responsabilidade administrativa pessoal enquanto o PL 2338 segue em tramitação e sem vigência (CTX-01, IND-PL2338-STATUS, GM-04, PL2338). Evidência que alteraria a proposta: pareceres do TCU ou dados de compras públicas demonstrando ausência de risco de lock-in e de paralisia decisória.'"},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"against","role":"challenge","roundId":"R3","text":"Contestamos o condicionamento imediato da permanência em produção dos 37 sistemas federais de IA (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS) à existência de canal de contestação humana sem regra de transição, escalonamento de risco ou dotação orçamentária prévia. Embora a revisão seja relevante, apenas 18% dos órgãos federais possuem unidade de governança de IA e há somente 140 servidores de fiscalização no cenário simulado (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS). Impor condição suspensiva imediata ao componente GM-20 paralisaria serviços digitais de escala nacional (CF-01) e geraria grave insegurança jurídica e responsabilização administrativa para o gestor público perante órgãos de controle (BRF-POS-PUBOP, CF-13, EBIA-TCU). Mudaríamos nossa posição diante de evidência de financiamento plurianual dedicado ao custeio de bancas de revisão humana e cronograma gradual de adequação para sistemas legados."}]},{"stratumId":"business","stance":"for","statements":[{"agentId":"agent:business-01","provider":"openai","stance":"for","role":"support","roundId":"R3","text":"Apoio explicação e contestação acessíveis em benefícios: GM-20 não especifica esses canais, e a LGPD não demonstra sua existência operacional em todos os casos. Na premissa fictícia, apenas 2 de 37 sistemas têm canal de contestação humana documentado; isso não prova que os demais não tenham canal. Inventário verificável dos canais e testes de sua efetividade poderiam alterar a prioridade de implantação."}]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"amend","statements":[{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"support","roundId":"R3","text":"A tese está bem fundada no pacote: BRF-CTX-PUBSVC registra só 2 de 37 sistemas federais com canal de contestação humana documentado e BRF-POS-AFF descreve negativas automatizadas sem explicação. A LGPD (GM-03) cobre revisão de decisões baseadas unicamente em tratamento automatizado de dados pessoais, não o conjunto das triagens de benefícios. Modificar GM-20, já em produção, é o lócus operacional correto enquanto o PL 2338 segue em tramitação (CTX-01; IND-PL2338-STATUS). Canais presenciais e telefônicos, além do digital, respondem a CF-11 e a T6. Evidência que mudaria a posição: inventário público mostrando contestação humana efetiva, gratuita e com poder de alterar a decisão nos sistemas que negam ou interrompem benefícios."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Modificar a iniciativa IA Brasil (GM-20) para que negativas ou interrupções de benefícios e demais decisões administrativas influenciadas por IA incluam: explicação compreensível; contestação gratuita; revisão por pessoa com poder de alterar a decisão; e atendimento presencial e telefônico além do digital, em razão da desigualdade de acesso (CF-11). No fluxo do gov.br (CF-01), a decisão nasce com ficha de finalidade, status da avaliação de impacto em direitos, responsável nomeado e canal de contestação, auditável pelo controle externo (CF-13). Escalonar por dano — benefícios e grupos vulneráveis primeiro, com prazos públicos — sem desligamento imediato dos 37 sistemas da premissa fictícia (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS). A LGPD (GM-03) não substitui esse canal: só 2 dos 37 sistemas têm contestação humana documentada (BRF-POS-AFF)."}]},{"stratumId":"workers","stance":"for","statements":[{"agentId":"agent:workers-01","provider":"gemini","stance":"for","role":"support","roundId":"R3","text":"Apoiamos a tese C0047-R2. Condicionar a operacao de sistemas publicos de IA (GM-20) a existencia efetiva de canais de contestacao e revisao humana vinculante e indispensavel. Essa exigencia assegura a supervisao humana substantiva (BRF-POS-WRK) e resguarda tanto os servidores publicos operadores quanto os cidadaos usuarios frente a decisoes automatizadas arbitrarias, como as relatadas em beneficios sociais (BRF-POS-AFF, BRF-CTX-PUBSVC)."}]},{"stratumId":"affectedGroups","stance":"split","statements":[{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"Modificar a iniciativa de IA em serviços públicos para prever, nas negativas ou interrupções de benefícios influenciadas por IA, explicação compreensível, contestação gratuita e revisão por pessoa com poder de alterar a decisão. Oferecer atendimento presencial e telefônico, além do digital. A LGPD já contém direitos pertinentes, mas a cobertura temática não demonstra que esses canais existam para todos esses casos. No cenário fictício, apenas 2 dos 37 sistemas têm canal de contestação humana documentado; a desigualdade digital é hipótese a verificar. Dados que mostrem canais acessíveis e resolutivos já disponíveis por região mudariam a prioridade da proposta."},{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"for","role":"support","roundId":"R3","text":"Apoio condicionar o uso de IA que possa negar ou interromper benefícios a um recurso acessível, com revisão por pessoa capaz de alterar a decisão. A LGPD oferece direitos pertinentes, mas GM-20 não descreve esse canal. No cenário fictício, apenas 2 dos 37 sistemas têm contestação humana documentada; isso não prova que os demais não tenham canal."},{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Acrescentar ao GM-20: o órgão responsável por benefício cuja negativa ou interrupção seja influenciada por IA deverá informar o uso da tecnologia, apresentar os motivos da decisão em linguagem compreensível e oferecer contestação gratuita por canais presencial, telefônico e digital. A revisão será feita por pessoa com competência para alterar a decisão, com prioridade para risco de interrupção de renda e informação ao interessado sobre o prazo e o resultado. Sistemas novos deverão contar com o recurso antes da implantação; para os existentes, o órgão deverá publicar, em até 90 dias, inventário e cronograma financiado, priorizando benefícios, e disponibilizar atendimento humano provisório durante a transição. A implantação deve evitar interrupção indevida do atendimento. Esta é uma proposta de política, não obrigação derivada do PL. Custos, prazos e evidência de canais equivalentes já efetivos poderiam alterar o cronograma."}]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M003","lens":"advantage","change":"modify","componentId":"GM-18","componentTitle":"Modelos de linguagem em português","topic":"language-culture","title":"Avaliação pública do português brasileiro e de suas variedades como critério de compra","text":"Proponho modificar GM-18 para que os modelos em português sejam acompanhados de conjuntos públicos de avaliação do português brasileiro em suas variedades regionais. Esses conjuntos seriam mantidos pela base científica pública, com governança aberta, licenças claras e uso obrigatório como critério de teste nas compras públicas de IA para serviços federais. A vantagem seria distintiva por três razões: são mais de 200 milhões de falantes com baixa representação nos corpora e avaliações dos grandes modelos (CF-03); a rede de universidades e institutos públicos, incluindo o centro da UFMG (GM-21), pode manter esses referenciais (CF-09); e a escala de gov.br cria demanda estatal real para validá-los (CF-01). Outro país não copia um referencial do português brasileiro em uso continental. Também há ligação com a desigualdade regional, lacuna da matriz. Os talentos estão 71% no Sudeste, com evasão de 9% ao ano (BRF-CTX-TALENT, CF-11), e núcleos de anotação e avaliação no Norte e no Nordeste dariam uso distribuído à infraestrutura de GM-17 (PBIA-HPC). Os custos são de anotação contínua e de manutenção plurianual, o que depende de continuidade (T1). Incluir línguas indígenas (CF-14) exige consentimento e repartição de benefícios, e essa perspectiva não está no pacote. Por isso não proponho incluí-las sem participação própria. A tese extrapola as fontes: é hipótese.","proposedTitle":"Avaliação pública do português brasileiro e de suas variedades como critério de compra","proposedDescription":"Acrescentar a GM-18: 'Os modelos em português desenvolvidos na infraestrutura nacional (GM-17, PBIA-HPC) serão acompanhados de conjuntos públicos de avaliação do português brasileiro e de suas variedades regionais. Esses conjuntos serão mantidos pela base científica pública (CF-09), com governança separada das equipes que desenvolvem os modelos, licenças claras e documentação dos dados. Uma parte dos testes fica reservada e não publicada, para evitar que os modelos sejam ajustados ao próprio teste. Eles servirão de critério de teste nas compras públicas de IA para serviços federais.' A vantagem é distintiva porque nasce da escala do português brasileiro, com baixa representação nos grandes modelos (CF-03), e da diversidade regional (CF-14), que outros países não reproduzem sem falantes e anotadores locais. Ela depende de uma base pública já existente (CF-09, GM-21). Custo e risco: a curadoria é cara. A concentração fictícia de 71% dos talentos no Sudeste (BRF-CTX-TALENT) pode enviesar a anotação, por isso a proposta exige equipes de anotação no Norte e no Nordeste (CF-11). Dados de línguas indígenas só entram com consulta e consentimento: não há fonte de posição dos povos indígenas no pacote, e esta perspectiva não fala por eles. A continuidade depende do pós-2028 (T1). Evidência que mudaria minha posição: conjuntos equivalentes já mantidos por terceiros com cobertura regional comparável.","tensionIds":["T1","T3"],"author":{"agentId":"agent:research-01","stratumId":"research","provider":"anthropic"},"support":{"seats":2,"strata":["publicOperators","research"],"providers":["anthropic","gemini"]},"challenges":[],"amendments":[{"claimId":"C0093-R5"},{"claimId":"C0101-R5"},{"claimId":"C0109-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-03","CF-09","CF-01","CF-11","CF-14"],"stratumPositions":[{"stratumId":"regulators","stance":"silent","statements":[]},{"stratumId":"publicOperators","stance":"for","statements":[{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"support","roundId":"R3","text":"Apoiamos a proposta de acoplar ao componente GM-18 conjuntos públicos de avaliação do português brasileiro mantidos pela rede científica pública (CF-09, GM-21) como critério técnico obrigatório nas compras públicas de IA para serviços federais (GM-20). Para as empresas públicas de TI e gestores de contratos (BRF-POS-PUBOP), esse mecanismo resolve uma vulnerabilidade crítica sob a lei de licitações: permite aferir objetivamente a qualidade e a adequação linguística e regional (CF-03, CF-14) das soluções ofertadas, reduzindo o risco de captura por fornecedor único estrangeiro (CF-12, BRF-CTX-COMPUTE) e oferecendo parâmetro técnico auditável perante o controle externo (CF-13, EBIA-TCU) para justificar contratações e homologações no setor público."}]},{"stratumId":"business","stance":"split","statements":[{"agentId":"agent:business-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Complementar os modelos em português com conjuntos de avaliação compartilhados, documentados e acessíveis a startups e pesquisadores, incluindo variedades regionais do português brasileiro. A base científica pública coordenaria curadoria e testes independentes, com licenças claras, proteção de dados pessoais e publicação de limitações e resultados agregados. A combinação da escala linguística brasileira com conhecimento científico local pode favorecer produtos adaptados a esse mercado, hipótese a testar por comparação com avaliações estrangeiras. Prever custos de curadoria e revisar o desenho se os testes revelarem exclusão de variedades ou tratamento inadequado de dados."},{"agentId":"agent:business-01","provider":"openai","stance":"for","role":"author","roundId":"R2","text":"Ampliar GM-18 com avaliações compartilhadas de português brasileiro e suas variedades, acessíveis a startups e pesquisa, com documentação dos dados, proteção de dados pessoais e testes independentes. A combinação de escala do português brasileiro e diversidade regional pode favorecer produtos adaptados a um mercado linguístico específico, difícil de reproduzir sem dados e avaliação locais. Há custos de curadoria e risco de excluir variedades ou tratar dados indevidamente. Avaliações comparativas existentes e evidência sobre cobertura linguística poderiam mudar a prioridade."}]},{"stratumId":"research","stance":"amend","statements":[{"agentId":"agent:research-01","provider":"anthropic","stance":"for","role":"author","roundId":"R2","text":"Proponho modificar GM-18 para que os modelos em português sejam acompanhados de conjuntos públicos de avaliação do português brasileiro em suas variedades regionais. Esses conjuntos seriam mantidos pela base científica pública, com governança aberta, licenças claras e uso obrigatório como critério de teste nas compras públicas de IA para serviços federais. A vantagem seria distintiva por três razões: são mais de 200 milhões de falantes com baixa representação nos corpora e avaliações dos grandes modelos (CF-03); a rede de universidades e institutos públicos, incluindo o centro da UFMG (GM-21), pode manter esses referenciais (CF-09); e a escala de gov.br cria demanda estatal real para validá-los (CF-01). Outro país não copia um referencial do português brasileiro em uso continental. Também há ligação com a desigualdade regional, lacuna da matriz. Os talentos estão 71% no Sudeste, com evasão de 9% ao ano (BRF-CTX-TALENT, CF-11), e núcleos de anotação e avaliação no Norte e no Nordeste dariam uso distribuído à infraestrutura de GM-17 (PBIA-HPC). Os custos são de anotação contínua e de manutenção plurianual, o que depende de continuidade (T1). Incluir línguas indígenas (CF-14) exige consentimento e repartição de benefícios, e essa perspectiva não está no pacote. Por isso não proponho incluí-las sem participação própria. A tese extrapola as fontes: é hipótese."},{"agentId":"agent:research-01","provider":"anthropic","stance":"amend","role":"amendment","roundId":"R5","text":"Acrescentar a GM-18: 'Os modelos em português desenvolvidos na infraestrutura nacional (GM-17, PBIA-HPC) serão acompanhados de conjuntos públicos de avaliação do português brasileiro e de suas variedades regionais. Esses conjuntos serão mantidos pela base científica pública (CF-09), com governança separada das equipes que desenvolvem os modelos, licenças claras e documentação dos dados. Uma parte dos testes fica reservada e não publicada, para evitar que os modelos sejam ajustados ao próprio teste. Eles servirão de critério de teste nas compras públicas de IA para serviços federais.' A vantagem é distintiva porque nasce da escala do português brasileiro, com baixa representação nos grandes modelos (CF-03), e da diversidade regional (CF-14), que outros países não reproduzem sem falantes e anotadores locais. Ela depende de uma base pública já existente (CF-09, GM-21). Custo e risco: a curadoria é cara. A concentração fictícia de 71% dos talentos no Sudeste (BRF-CTX-TALENT) pode enviesar a anotação, por isso a proposta exige equipes de anotação no Norte e no Nordeste (CF-11). Dados de línguas indígenas só entram com consulta e consentimento: não há fonte de posição dos povos indígenas no pacote, e esta perspectiva não fala por eles. A continuidade depende do pós-2028 (T1). Evidência que mudaria minha posição: conjuntos equivalentes já mantidos por terceiros com cobertura regional comparável."}]},{"stratumId":"civilSociety","stance":"silent","statements":[]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"amend","statements":[{"agentId":"agent:affectedGroups-01","provider":"openai","stance":"amend","role":"amendment","roundId":"R5","text":"Ampliar o GM-18 com testes públicos de compreensão de explicações e recursos sobre benefícios em variedades do português brasileiro, desenvolvidos com pesquisa pública e participação de usuários, sem publicar dados pessoais. Comparar desempenho entre variedades e canais antes de ampliar o uso nos serviços; preservar atendimento presencial e telefônico e limitar o compartilhamento de dados. A combinação hipotética da escala do português brasileiro com a infraestrutura nacional de serviços pode produzir avaliações locais difíceis de reproduzir em mercados linguísticos menores. A vantagem não está demonstrada: custos de curadoria, exclusões de variedades e resultados comparativos com outros países podem alterar a proposta."}]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M004","lens":"excess","change":"modify","componentId":"GM-03","componentTitle":"Lei Geral de Proteção de Dados (Lei 13.709/2018)","topic":"rights-redress","title":"LGPD não equivale a contestação de IA no serviço público","text":"O modelo não deveria contar GM-03 (LGPD) como cobertura em vigor suficiente de rights-redress para IA pública. A LGPD assegura revisão de decisões baseadas unicamente em tratamento automatizado de dados pessoais; não institui explicação acessível nem revisão humana vinculante para o conjunto das triagens administrativas com IA. Só 2 dos 37 sistemas federais em produção têm canal de contestação humana documentado (BRF-CTX-PUBSVC); relatos descrevem negativas automatizadas sem explicação (BRF-POS-AFF). Risco de manter como está: a matriz marca o tema como documentedInForce e 35 sistemas seguem sem contestação enquanto o modelo aparenta o direito resolvido, sobretudo na transição (CTX-03). Reformular: GM-03 permanece para dados pessoais, mas o modelo deve exigir, por ato administrativo, explicação em linguagem clara, revisão humana vinculante e canal no mesmo meio do serviço (gov.br), com prazo e registro público. Evidência que mudaria a posição: prova de que os 35 sistemas sem canal já oferecem revisão humana efetiva por outra via.","proposedTitle":"LGPD não equivale a contestação de IA no serviço público","proposedDescription":"Reformular a apresentação do GM-03 no modelo: a LGPD permanece o regime vigente de proteção de dados pessoais, inclusive o direito de revisão de decisões tomadas unicamente com base em tratamento automatizado. O modelo não deve contabilizá-la como cobertura em vigor suficiente de rights-redress para IA no serviço público. A lei não institui, por si, explicação acessível, revisão humana vinculante para triagens administrativas que não sejam exclusivamente automatizadas, nem canais presenciais e telefônicos. Manter a cobertura nominal mascara a lacuna operacional — 2 de 37 sistemas federais com canal de contestação humana documentado na premissa fictícia (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS) e relatos de negativas sem explicação (BRF-POS-AFF) — e enfraquece a prioridade de desenhar contestação nativa no GM-20.","tensionIds":["T6"],"author":{"agentId":"agent:civilSociety-01","stratumId":"civilSociety","provider":"xai"},"support":{"seats":2,"strata":["civilSociety","regulators"],"providers":["xai"]},"challenges":[],"amendments":[{"claimId":"C0105-R5"}],"requiresLegalReview":true,"weakEvidence":false,"genericity":null,"contextFeatureIds":["CF-01","CF-10"],"stratumPositions":[{"stratumId":"regulators","stance":"for","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"for","role":"support","roundId":"R3","text":"Apoio o achado: GM-03 não deve contar como cobertura vigente suficiente de contestação para IA no serviço público. O modelo limita a LGPD à proteção de dados pessoais e à revisão de decisões tomadas apenas com base em tratamento automatizado (GM-03, LGPD). Isso não institui, por si, explicação compreensível nem canal de revisão humana para triagens administrativas com IA. No cenário fictício, 2 de 37 sistemas federais em produção têm canal de contestação humana documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS), e BRF-POS-AFF descreve negativas automatizadas sem explicação. Quem é afetado é o titular de benefício ou serviço, não o órgão que ganha produtividade. O que mudaria esta posição: norma vigente, fora da LGPD, que já imponha esse canal a sistemas públicos de IA, ou evidência de que os 37 sistemas se restringem a decisões unicamente automatizadas já cobertas pela revisão da LGPD — o que o pacote não mostra."}]},{"stratumId":"publicOperators","stance":"silent","statements":[]},{"stratumId":"business","stance":"silent","statements":[]},{"stratumId":"research","stance":"silent","statements":[]},{"stratumId":"civilSociety","stance":"amend","statements":[{"agentId":"agent:civilSociety-01","provider":"xai","stance":"for","role":"author","roundId":"R2","text":"O modelo não deveria contar GM-03 (LGPD) como cobertura em vigor suficiente de rights-redress para IA pública. A LGPD assegura revisão de decisões baseadas unicamente em tratamento automatizado de dados pessoais; não institui explicação acessível nem revisão humana vinculante para o conjunto das triagens administrativas com IA. Só 2 dos 37 sistemas federais em produção têm canal de contestação humana documentado (BRF-CTX-PUBSVC); relatos descrevem negativas automatizadas sem explicação (BRF-POS-AFF). Risco de manter como está: a matriz marca o tema como documentedInForce e 35 sistemas seguem sem contestação enquanto o modelo aparenta o direito resolvido, sobretudo na transição (CTX-03). Reformular: GM-03 permanece para dados pessoais, mas o modelo deve exigir, por ato administrativo, explicação em linguagem clara, revisão humana vinculante e canal no mesmo meio do serviço (gov.br), com prazo e registro público. Evidência que mudaria a posição: prova de que os 35 sistemas sem canal já oferecem revisão humana efetiva por outra via."},{"agentId":"agent:civilSociety-01","provider":"xai","stance":"amend","role":"amendment","roundId":"R5","text":"Reformular a apresentação do GM-03 no modelo: a LGPD permanece o regime vigente de proteção de dados pessoais, inclusive o direito de revisão de decisões tomadas unicamente com base em tratamento automatizado. O modelo não deve contabilizá-la como cobertura em vigor suficiente de rights-redress para IA no serviço público. A lei não institui, por si, explicação acessível, revisão humana vinculante para triagens administrativas que não sejam exclusivamente automatizadas, nem canais presenciais e telefônicos. Manter a cobertura nominal mascara a lacuna operacional — 2 de 37 sistemas federais com canal de contestação humana documentado na premissa fictícia (BRF-CTX-PUBSVC; IND-PUBLIC-AI-SYSTEMS) e relatos de negativas sem explicação (BRF-POS-AFF) — e enfraquece a prioridade de desenhar contestação nativa no GM-20."}]},{"stratumId":"workers","stance":"silent","statements":[]},{"stratumId":"affectedGroups","stance":"silent","statements":[]},{"stratumId":"infrastructure","stance":"silent","statements":[]}]},{"proposalId":"M005","lens":"excess","change":"modify","componentId":"GM-10","componentTitle":"Avaliação de impacto algorítmico e direitos das pessoas afetadas","topic":"impact-assessment","title":"Separar o vigente, o projetado e o proposto na avaliação de impacto","text":"GM-10 não deveria constar como componente do modelo na forma atual. Sua própria descrição diz que é um mecanismo 'esperado em marcos de IA baseados em risco', não um mecanismo documentado no texto do PL (GM-04, proposto e não vigente). Mesmo assim, ele faz a matriz tratar a avaliação de impacto como 'não lacuna', embora seja o tema com mais expectativa no conselho (4 assentos). O risco de manter como está é mascarar uma lacuna real. No mundo fictício, só 6 dos 37 sistemas federais em produção têm avaliação de impacto publicada, e apenas 2 têm canal de contestação documentado (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Proponho reformular GM-10 em dois movimentos. (a) Reclassificá-lo como hipótese a conferir no texto do PL2338-SENADO. (b) Criar, já sob o regime vigente, uma obrigação administrativa para os sistemas federais: registro público em dados abertos, com finalidade, base legal, avaliação de impacto e canal de contestação, ancorado na revisão de decisões automatizadas prevista na LGPD (GM-03). Essa segunda parte não depende da aprovação do PL (CTX-01). Mudaria de posição se o texto aprovado no Senado trouxer a avaliação de impacto com conteúdo e prazos definidos.","proposedTitle":"Separar o vigente, o projetado e o proposto na avaliação de impacto","proposedDescription":"Reformular GM-10 como 'Avaliação de impacto algorítmico (proposta, não vigente)', em três camadas explícitas. (i) Vigente: direito de revisão de decisões tomadas apenas com base em tratamento automatizado de dados pessoais (GM-03, LGPD), sem apresentá-lo como avaliação de impacto. (ii) A conferir: o que o substitutivo aprovado no Senado (PL2338-SENADO) dispõe sobre avaliação de impacto. Enquanto o PL tramitar (CTX-01, IND-PL2338-STATUS), nada disso é obrigação. (iii) Proposta do conselho, sujeita a decisão humana: avaliação priorizada dos sistemas públicos já em produção que podem negar ou interromper benefícios, com prazos escalonados e não congelamento dos sistemas legados (convergindo com C0034-R2, C0081-R4 e C0085-R4). A metodologia seria aberta e os resultados agregados seriam publicados sem dados pessoais. No mundo fictício, são 6 de 37 sistemas com avaliação publicada (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). Enquanto a camada (ii) não for conferida, a matriz de cobertura deve tratar impact-assessment como lacuna, não como coberta por inferência. Risco de manter como está: mascarar o tema que mais assentos esperam. Evidência que mudaria minha posição: o texto oficial com dever de avaliação claro e aplicável ao setor público.","tensionIds":["T5","T6"],"author":{"agentId":"agent:research-01","stratumId":"research","provider":"anthropic"},"support":{"seats":2,"strata":["civilSociety","research"],"providers":["anthropic","xai"]},"challenges":[],"amendments":[{"claimId":"C0108-R5"}],"requiresLegalReview":false,"weakEvidence":false,"genericity":null,"contextFeatureIds":[],"stratumPositions":[{"stratumId":"regulators","stance":"against","statements":[{"agentId":"agent:regulators-01","provider":"xai","stance":"against","role":"challenge","roundId":"R3","text":"Contesto a premissa de que GM-10, na forma atual, já impõe conformidade ex-ante uniforme capaz de paralisar o serviço público. GM-10 é mecanismo proposto, de tópicos inferidos, descrito como esperado em marcos de risco, não como obrigação vigente (GM-10, GM-04). CTX-01 e IND-PL2338-STATUS mantêm o PL em tramitação. PL2338-SENADO registra níveis de risco e regime de alto risco no texto do Senado; não confirma, neste pacote, avaliação prévia uniforme nem a articulação operacional com GM-07 que o achado pressupõe. A restrição de capacidade é real como premissa de desenho futuro, não como fato: 140 servidores e unidade de governança em 18% dos órgãos são inventados para a simulação (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS). BRF-POS-REG defende fiscalização escalonada, não dispensa de contestação. Escalonar auditoria não autoriza manter em produção, sem revisão humana, sistemas que negam benefícios (BRF-CTX-PUBSVC, BRF-POS-AFF, T6). O que mudaria: texto vigente que imponha avaliação ex-ante uniforme a todo sistema legado, ou evidência de que a contestação humana, e não a auditoria prévia, é o fator de paralisia."}]},{"stratumId":"publicOperators","stance":"amend","statements":[{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"author","roundId":"R2","text":"O componente GM-10 (avaliação de impacto algorítmico prévia e direitos de explicação e revisão humana), articulado ao regime de alto risco do GM-07 no PL 2338 (GM-04), é desproporcional na forma atual por não distinguir sistemas legados em operação de novos sistemas e por exigir conformidade ex-ante uniforme sem capacidade estatal instalada. Em novembro de 2026, apenas 18% dos órgãos federais possuem unidade de governança de IA e há somente 140 fiscais (CTX-05, IND-AI-INSPECTORS, BRF-CTX-GOVCAP, BRF-POS-REG), enquanto dos 37 sistemas federais em produção apenas 6 têm avaliação de impacto publicada e 2 contam com canal documentado de contestação humana (IND-PUBLIC-AI-SYSTEMS, BRF-CTX-PUBSVC). Manter o GM-10 sem escalonamento gera risco imediato de paralisia decisória e apagão de produtividade nos serviços digitais: gestores públicos, temendo responsabilização pelo controle externo (CF-13, BRF-POS-PUBOP), desativarão triagens automatizadas em vez de assumir o risco jurídico de operá-las sem estrutura de revisão humana massiva. Propõe-se modificar o GM-10 para prever regime de adequação escalonada para o estoque de sistemas públicos em produção, certificação por herança a partir de componentes pré-validados no GM-20 e exigência de revisão humana presencial restrita a decisões ablativas de direitos sem alternativa administrativa célere. Dados demonstrando que os órgãos públicos conseguem absorver 100% das avaliações ex-ante e contestações sem queda nos indicadores de produtividade mudariam esta posição."},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"for","role":"author","roundId":"R4","text":"Revisamos o achado para acolher as críticas de que o GM-10 é mecanismo proposto e inferido, não obrigação vigente (CTX-01, IND-PL2338-STATUS, GM-04, PL2338), e de que um escalonamento sem prazos nem prioridades congelaria o déficit atual de 37 sistemas federais em produção com apenas 6 avaliações publicadas e 2 com contestação humana (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS). O excesso na formulação atual do modelo está em apresentar o GM-10 como bloco inferido homogêneo, sem distinguir deveres já vigentes na LGPD (GM-03) de disposições a conferir no PL e sem regra operacional de transição compatível com a capacidade instalada simulada de 18% dos órgãos com governança e 140 fiscais (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS, BRF-POS-REG). Propomos modificar o GM-10 para: (1) separar explicitamente obrigações vigentes de mecanismos propostos; (2) instituir cronograma vinculante de adequação para sistemas públicos legados com prioridade imediata (faixa 1) para aqueles que afetem elegibilidade, negativa ou interrupção de benefícios sociais, saúde e gestão do trabalho, assegurando explicação e revisão humana (BRF-POS-AFF, BRF-POS-WRK, PL2338-SENADO); e (3) adotar avaliação padronizada e certificação compartilhada para módulos reutilizados pelas empresas públicas (GM-20, BRF-POS-PUBOP), conferindo segurança jurídica ao gestor perante o controle externo (CF-13, EBIA-TCU). Evidência do texto oficial do PL 2338 e de custos e prazos de adequação dos sistemas legados alteraria esta posição."},{"agentId":"agent:publicOperators-01","provider":"gemini","stance":"amend","role":"amendment","roundId":"R5","text":"Redação proposta para modificar o GM-10 (Avaliação de impacto algorítmico e direitos das pessoas afetadas): 'Mecanismo estruturado em três camadas para evitar que tópicos inferidos operem como obrigação uniforme sem capacidade estatal correspondente: (1) Distinção explícita de status normativo: separa os deveres vigentes de revisão de decisões automatizadas e transparência da LGPD (GM-03, LGPD, GM-13) das disposições propostas e ainda não vigentes do PL 2338 (GM-04, PL2338, CTX-01, IND-PL2338-STATUS); (2) Escalonamento vinculante por severidade de dano para o passivo público: diante dos 37 sistemas federais em produção com apenas 6 avaliações publicadas e 2 canais de contestação (BRF-CTX-PUBSVC, IND-PUBLIC-AI-SYSTEMS) e da capacidade simulada de 140 servidores de fiscalização e 18% dos órgãos com governança (CTX-05, BRF-CTX-GOVCAP, IND-AI-INSPECTORS, BRF-POS-REG), impõe prioridade imediata (meta de 180 dias) para ava
