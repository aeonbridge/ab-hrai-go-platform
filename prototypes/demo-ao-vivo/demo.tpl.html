<title>Observatório HRAI-GO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;800&display=swap">
<style>
/* Layout: mobile-first. Participante no celular (passos), telão para o apresentador (QR + agregados ao vivo), base de conhecimento e monitoramento individuais. */
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#13212E; --ink-2:#4B5C6C; --ink-3:#6F7F8F; --line:#D2DAE2; --line-2:#BCC7D2;
  --human:#00766C; --human-soft:#D7EEEB; --shadow:#57558F; --shadow-soft:#E6E5F3;
  --c4:#B8341A; --c3:#A15C00; --c2:#76732A; --c1:#6B7B8C;
  --fit-n2:#B4532A; --fit-n1:#DDA27F; --fit-0:#D9DEE3; --fit-p1:#93B46C; --fit-p2:#4E7D2A;
  --ok:#1E7F4F; --warn:#A15C00; --warn-soft:#F5E8D3; --focus:#1C62A8;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C131A; --surface:#131D27; --sunk:#0A1015; --ink:#E2E8EE; --ink-2:#9DAEBE; --ink-3:#7A8B9B; --line:#24323F; --line-2:#334452;
  --human:#3DC3B4; --human-soft:#123430; --shadow:#A9A6EC; --shadow-soft:#24233F;
  --c4:#FF7B5E; --c3:#EFA944; --c2:#CDBE62; --c1:#8C9CAD;
  --fit-n2:#E07A4C; --fit-n1:#8F5A3E; --fit-0:#2A3642; --fit-p1:#5F7E3E; --fit-p2:#9CCB6A;
  --ok:#5BD18B; --warn:#EFA944; --warn-soft:#36270F; --focus:#6CAEF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C131A; --surface:#131D27; --sunk:#0A1015; --ink:#E2E8EE; --ink-2:#9DAEBE; --ink-3:#7A8B9B; --line:#24323F; --line-2:#334452;
  --human:#3DC3B4; --human-soft:#123430; --shadow:#A9A6EC; --shadow-soft:#24233F;
  --c4:#FF7B5E; --c3:#EFA944; --c2:#CDBE62; --c1:#8C9CAD;
  --fit-n2:#E07A4C; --fit-n1:#8F5A3E; --fit-0:#2A3642; --fit-p1:#5F7E3E; --fit-p2:#9CCB6A;
  --ok:#5BD18B; --warn:#EFA944; --warn-soft:#36270F; --focus:#6CAEF0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:13px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.brand span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:8px;padding:3px;overflow-x:auto;max-width:100%}
.tabs a{padding:6px 11px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.conn{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.conn.live i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.conn.bad i{background:var(--c4)}
main{max-width:1500px;margin:0 auto}
.view{padding-block:20px 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--human);border-color:var(--human);color:var(--surface);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;display:inline-block}
.tag.ok{background:var(--human-soft);color:var(--human)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.syn{background:var(--shadow-soft);color:var(--shadow)} .tag.bad{background:color-mix(in srgb,var(--c4) 15%,transparent);color:var(--c4)}
.dia{width:11px;height:11px;transform:rotate(45deg);border:2px dashed var(--shadow);flex:none;border-radius:2px;display:inline-block}
.dot{width:11px;height:11px;border-radius:50%;background:var(--human);flex:none;display:inline-block}

/* participar */
.phone{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.steps i.on{background:var(--human)}
.card{padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:21px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--human);background:var(--human-soft)}
.opt .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.poles{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-display);font-weight:600;font-size:15px}
.poles span:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--human);height:32px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 9px;font-family:var(--f-mono);font-size:12px;min-width:34px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
textarea{width:100%;min-height:96px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);padding:10px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px}
.sent{font-size:12.5px;color:var(--ok);font-family:var(--f-mono)}
.sent.err{color:var(--c4)}

/* telão */
.stage{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.stage{grid-template-columns:minmax(0,1fr)}}
.qrbox{padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:1000px){.qrbox{position:static}}
.qrbox svg{width:100%;max-width:260px;height:auto;background:#fff;padding:10px;border-radius:10px}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.url{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile h3{font-size:17px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .lbl{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.bar .tr{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--human);border-radius:6px;transition:width .5s ease}
.bar .n{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.field{position:relative;height:190px;margin:0 8px}
.axis{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line-2)}
.mk{position:absolute;transform:translate(-50%,-50%);transition:left .5s ease,top .5s ease}
.mk.syn{width:22px;height:22px;display:grid;place-items:center}
.mk.syn::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border:2px dashed var(--shadow);background:var(--shadow-soft);border-radius:2px}
.mk.syn span{position:relative;font-family:var(--f-mono);font-size:8.5px;color:var(--shadow)}
.mk.hum{width:12px;height:12px;border-radius:50%;background:var(--human);border:2px solid var(--surface);opacity:.85}
.mk.med{width:2px;height:120px;background:var(--human);top:50%}
.mk.med b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--human);white-space:nowrap}
.flabels{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-transform:uppercase;gap:10px}
.prow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pc{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center;font-size:12px}
.pc .cell{position:relative;aspect-ratio:1.4/1;border-radius:6px;overflow:hidden}
.pc .cell svg{position:absolute;inset:0;width:100%;height:100%}
.pc .cell .ne{position:absolute;right:4px;top:3px;width:17px;height:17px;border-radius:50%;background:var(--c4);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.pc b{font-family:var(--f-display);font-size:14px}
.pc small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.feed{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;border-left:3px solid var(--line-2);padding:4px 0 4px 10px;font-size:14px;animation:pop .4s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.fi.challenge{border-left-color:var(--c4)} .fi.support{border-left-color:var(--human)} .fi.evidence{border-left-color:var(--focus)} .fi.amend{border-left-color:var(--c2)}
.fi .mv{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;white-space:nowrap}
.fi p{margin:0;overflow-wrap:anywhere}
.fi small{display:block;color:var(--ink-3);font-size:11.5px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}

/* base de conhecimento e monitor */
.kb{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.kb{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:860px){.side{position:static;flex-direction:row;overflow-x:auto}}
.side button{text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;font-size:14px;white-space:nowrap}
.side button[aria-pressed="true"]{background:var(--surface);border-color:var(--line-2);font-weight:600}
.search{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:9px 12px}
.jur{padding:20px;display:flex;flex-direction:column;gap:14px}
.jur h2{font-size:24px}
.inst{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.inst h3{font-size:16px}
.inst p{margin:0;grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.inst .rel{grid-column:1/-1;font-size:13.5px;border-left:2px solid var(--human);padding-left:10px}
.inst .src{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
.inst .src a{color:var(--ink-2)}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:96px 22px minmax(0,1fr);gap:0 12px;align-items:start}
.ev .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.ev .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.ev .rail i{position:relative;margin-top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink-2);border:2px solid var(--paper)}
.ev.br .rail i{background:var(--human)} .ev.fut .rail i{background:var(--paper);border:2px dashed var(--ink-3)}
.ev .b{padding-bottom:18px;min-width:0}
.ev .b b{display:block;font-size:15px}
.ev .b p{margin:2px 0 6px;font-size:13.5px;color:var(--ink-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.today{font-family:var(--f-mono);font-size:11px;color:var(--c4);padding:6px 0 14px 130px}
.banner{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.fi,.bar .tr i,.mk{animation:none;transition:none}}
</style>

</main>

<script>
(() => {
"use strict";
/* ================= conteúdo ================= */
const SECTORS=[["gov","Governo federal"],["reg","Agência reguladora"],["leg","Legislativo"],["est","Estados e municípios"],["aca","Academia"],["soc","Sociedade civil"],["pri","Setor privado"],["out","Outro"]];
const TENSIONS=[
 ["t1","Testar viés com dados sensíveis × minimização de dados",4],
 ["t2","Auditoria ex-ante obrigatória × viabilidade para pequenas empresas",4],
 ["t3","Revisão humana efetiva × escala operacional",3],
 ["t4","Explicação ao cidadão × segredo comercial do modelo",2],
 ["t5","Prazo curto de vigência × capacidade de fiscalização",2]];
const POLE_A="Auditoria ex-ante obrigatória",POLE_B="Viabilidade para pequenas empresas";
const SEATS=[["DD","Direitos digitais",-.7],["TR","Trabalhadores",-.6],["PE","Pequenas empresas",.55],["FI","Fiscalização",.35],["GP","Grandes plataformas",.15],["AA","Auditoria algorítmica",-.25]];
const MODELS=[["ue","UE",-1],["us","EUA",1],["cn","China",-2],["uk","Reino Unido",1],["br","Brasil",0]];
const CRIT="Capacidade estatal de fiscalização";
const MOVES=[["support","Sustentar"],["challenge","Contestar"],["evidence","Pedir evidência"],["amend","Propor alternativa"]];
const LV=["","baixa","moderada","alta","crítica"];

/* ================= transporte ao vivo ================= */
const S={pid:null,sector:null,ans:{},step:0,msgs:new Map(),sim:false,simMsgs:[],showText:true,hidden:new Set(),view:"participar",kbSel:"br",kbQ:"",monF:"all",transport:"local"};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
S.pid=ls.get("hrai.pid")||("p"+Math.random().toString(36).slice(2,10));ls.set("hrai.pid",S.pid);
const params=new URLSearchParams(location.search);
const isArtifact=!!(window.claude&&window.claude.use);
const ARTIFACT_URL="__ARTIFACT_URL__";
let SALA=(params.get("sala")||(isArtifact?"hraigo-principal":ls.get("hrai.sala"))||"").replace(/[^a-z0-9-]/gi,"").slice(0,40);
if(!SALA){SALA="hraigo-"+Math.random().toString(36).slice(2,10)}
ls.set("hrai.sala",SALA);
try{const u=new URL(location.href);if(u.protocol.startsWith("http")&&u.searchParams.get("sala")!==SALA){u.searchParams.set("sala",SALA);history.replaceState(null,"",u)}}catch(e){}
const conn=document.getElementById("conn");
function setConn(cls,txt){conn.className="conn "+cls;conn.querySelector("span").textContent=txt}
const bc=("BroadcastChannel" in window)?new BroadcastChannel("hrai-"+SALA):null;
let sendImpl=async m=>{bc&&bc.postMessage(m);ingest(m)};
function ingest(m){if(!m||typeof m!=="object"||!m.pid||!m.k)return;const key=m.pid+"|"+m.k;const prev=S.msgs.get(key);if(!prev||(m.ts||0)>=(prev.ts||0)){S.msgs.set(key,m);schedule()}}
if(bc)bc.onmessage=e=>ingest(e.data);
async function startNtfy(){
  S.transport="ntfy";setConn("","conectando ao relay…");
  const es=new EventSource("https://ntfy.sh/"+SALA+"/sse?since=all");
  const seen=new Set();
  es.onopen=()=>setConn("live","ao vivo · sala "+SALA.slice(-6));
  es.onerror=()=>setConn("bad","relay indisponível · tentando de novo");
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event&&d.event!=="message")return;if(seen.has(d.id))return;seen.add(d.id);ingest(JSON.parse(d.message))}catch(err){}};
  sendImpl=async m=>{ingest(m);bc&&bc.postMessage(m);
    const r=await fetch("https://ntfy.sh/"+SALA,{method:"POST",body:JSON.stringify(m)});if(!r.ok)throw new Error("HTTP "+r.status)};
}
async function startArtifact(){
  setConn("","conectando…");
  const [db,user]=await Promise.all([claude.use("db").catch(()=>null),claude.use("user").catch(()=>null)]);
  let uid=null;if(user){try{uid=await user.id()}catch(e){}}
  if(!db||!uid){S.transport="local";setConn("bad","modo local · só leitura neste acesso");render();return}
  S.transport="db";S.pid=uid;
  const col=db.collection("salas/"+SALA+"/r");
  const tm=setTimeout(()=>setConn("bad","sem resposta do servidor"),10000);
  col.limit(2000).onSnapshot(s=>{clearTimeout(tm);setConn("live","ao vivo");s.docs.forEach(d=>ingest(d.data()))},()=>{clearTimeout(tm);setConn("bad","indisponível")});
  sendImpl=async m=>{ingest(m);await col.doc(m.pid+"__"+m.k).set(m)};
}
async function send(k,v){const m={pid:S.pid,k,v,sector:S.sector,ts:Date.now()};try{await sendImpl(m);return true}catch(e){return false}}

/* ================= agregação ================= */
function current(){
  const by=new Map();
  const all=[...S.msgs.values(),...(S.sim?S.simMsgs:[])];
  for(const m of all){let p=by.get(m.pid);if(!p){p={pid:m.pid,sim:!!m.sim};by.set(m.pid,p)}p[m.k]=m;if(m.sector)p.sector=m.sector}
  return[...by.values()];
}
