name: Validate general regulatory ontology

on:
  push:
    branches: [main]
    paths:
      - 'ontologies/regulatory/**'
      - 'tests/verify_regulatory_ontology.py'
      - 'tests/verify_regulatory_instances.py'
      - 'scripts/build_regulatory_instances.py'
      - '.github/workflows/validate-regulatory.yml'
      - 'web/assets/modelo.js'
      - 'web/assets/lastro.js'
      - 'scripts/ontologia/**'
      - 'tests/test_*.py'
      - 'ontologies/scse/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RDF test tooling
        run: python -m pip install 'rdflib>=7,<8' pytest
      - name: Verify OWL/RDF graph equivalence and SWRL structure
        run: python tests/verify_regulatory_ontology.py
      - name: Verify ABox RDF/XML twins are up to date
        run: python scripts/build_regulatory_instances.py --check
      - name: Validate ABox instances against TBox and execute SWRL rules
        run: python tests/verify_regulatory_instances.py
      - name: Displayed elements without ontology backing never increase (RF-12)
        run: python scripts/ontologia/lastro.py --check --base-ref HEAD~1
      - name: Core and SCSE modules, lastro counter (RF-12, RF-17)
        run: python -m pytest -q tests/test_modulos.py tests/test_lastro.py tests/test_invariantes.py
