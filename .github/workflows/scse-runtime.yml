name: SCSE runtime tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/scse/**'
      - 'config/scse/**'
      - 'scenarios/**'
      - 'experiments/**'
      - 'schemas/scse/**'
      - 'pyproject.toml'
      - '.github/workflows/scse-runtime.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/scse/**'
      - 'config/scse/**'
      - 'scenarios/**'
      - 'experiments/**'
      - 'schemas/scse/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime with all provider SDKs
        run: python -m pip install -e '.[all,dev]'
      - name: Unit and offline protocol tests (mock provider, no API keys)
        run: python -m pytest -q
      - name: Validate scenarios and dry-run one scenario end to end
        run: |
          scse validate scenarios/brasil-ficticio/*.json
          scse run scenarios/brasil-ficticio/BR-PBIA-001.json --dry-run --seats 8 --replicates 2 --critic --out /tmp/scse-runs
